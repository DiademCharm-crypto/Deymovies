name: Build iOS IPA (unsigned)

on:
  workflow_dispatch:
  push:
    paths: ["ios/**", ".github/workflows/ios.yml"]

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Select newest Xcode
        run: |
          ls -d /Applications/Xcode*.app || true
          X=$(ls -d /Applications/Xcode_16*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$X" ]; then sudo xcode-select -s "$X/Contents/Developer"; fi
          xcodebuild -version

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: List schemes
        working-directory: ios
        run: xcodebuild -project Deymflix.xcodeproj -list

      - name: Build (no signing)
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild -project Deymflix.xcodeproj \
            -scheme Deymflix \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO 2>&1 | tee build.log | grep -E "error:|BUILD" || true
          echo "---- ERROR TAIL ----"
          grep -E "error:" build.log | head -40 || true
          tail -n 30 build.log

      - name: Package unsigned IPA
        if: success()
        run: |
          mkdir -p Payload
          cp -r ios/build/Build/Products/Release-iphoneos/Deymflix.app Payload/
          zip -qr Deymflix-unsigned.ipa Payload
        shell: bash

      - name: Upload IPA artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Deymflix-unsigned-ipa
          path: Deymflix-unsigned.ipa
