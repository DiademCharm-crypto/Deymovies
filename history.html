    body { padding-top: 80px !important; padding-bottom: calc(100px + env(safe-area-inset-bottom, 0px)) !important; }

    .mylist-tabs {
      display: flex;

    .mylist-tab {
      flex: 1;
      min-width: 0;
      padding: 14px 8px;
      text-align: center;
      font-size: 0.78rem;
      font-weight: 700;
      color: rgba(255,255,255,0.5);
      cursor: pointer;
      border: none;
      background: transparent;
      border-bottom: 3px solid transparent;
      transition: all 0.25s ease;
      white-space: nowrap;
    }
    .mylist-tab.active {

    .mylist-progress {

    .mylist-empty {

    .section-header-title {

    /* ── Watch history: Edit mode (pick titles, then delete them) ──────────── */
    .hist-bar {
      display: flex;

    .hist-title { color: #fff; font-size: 1.25rem; font-weight: 800; letter-spacing: .2px; }
    .hist-edit {
      margin-left: auto;
      background: transparent;
      border: 0;
      color: #fff;
      font-family: inherit;

      font-weight: 700;

    .hist-edit.on { color: #e50914; }
    .mylist-content.edit-mode .mylist-remove-btn { display: none !important; }
    .mylist-item.picked { outline: 3px solid #e50914; outline-offset: -3px; }
    .mylist-item.picked::after {

    .hist-selbar.on { display: flex; }

  <script>
    let activeTab = 'movies';

    // ── EDIT MODE ────────────────────────────────────────────────────────────
    // The Edit button (top right of Watch History) turns every card into a
    // selectable tile: tap the titles you want gone, then Delete. The cards
    // keep their normal tap-to-open behaviour the rest of the time.
    let histEdit = false;
    const histSel = new Set();

    function toggleHistEdit(force) {
      histEdit = (force === undefined) ? !histEdit : !!force;
      histSel.clear();
      const btn = document.getElementById('hist-edit');
      if (btn) { btn.textContent = histEdit ? 'Done' : 'Edit'; btn.classList.toggle('on', histEdit); }
      const bar = document.getElementById('hist-selbar');
      if (bar) bar.classList.toggle('on', histEdit);
      const box = document.getElementById('mylist-content');
      if (box) box.classList.toggle('edit-mode', histEdit);
      updateSelBar();
      renderTabContent();
    }

    function updateSelBar() {
      const cnt = document.getElementById('hist-cnt');
      const del = document.getElementById('hist-del');
      if (cnt) cnt.textContent = histSel.size ? histSel.size + ' selected' : 'Select titles to delete';
      if (del) del.disabled = !histSel.size;
    }

    // Capture phase: runs BEFORE the card's own onclick, so in edit mode a tap
    // selects instead of opening the player.
    function tapInEditMode(e) {
      if (!histEdit) return;
      const card = e.target && e.target.closest ? e.target.closest('.mylist-item') : null;
      if (!card) return;
      e.preventDefault();
      e.stopPropagation();
      const key = card.getAttribute('data-del');
      if (!key) return;
      if (histSel.has(key)) { histSel.delete(key); card.classList.remove('picked'); }
      else { histSel.add(key); card.classList.add('picked'); }
      updateSelBar();
    }

    function loadCW() {
      try { return JSON.parse(localStorage.getItem('deymflix_continue_watching') || '{}') || {}; } catch (e) { return {}; }
    }

    function deleteSelectedHistory() {
      if (!histSel.size) return;
      const saved = loadCW();
      const reels = getReelHistory();
      let list = getMyList();
      let removed = 0;
      histSel.forEach(key => {
        const i = String(key).indexOf(':');
        const kind = i > 0 ? String(key).slice(0, i) : String(key);
        const id = i > 0 ? String(key).slice(i + 1) : '';
        if (kind === 'movie') { delete saved[id]; removed++; }
        else if (kind === 'series') {
          Object.keys(saved).forEach(k => { if (k === id || seriesBaseId(k) === id) delete saved[k]; });
          removed++;
        } else if (kind === 'reel') { delete reels[id]; removed++; }
        else if (kind === 'bookmark') { list = list.filter(m => m.id !== id); removed++; }
      });
      try { localStorage.setItem('deymflix_continue_watching', JSON.stringify(saved)); } catch (e) {}
      try { localStorage.setItem('deymflix_reel_history', JSON.stringify(reels)); } catch (e) {}
      try { localStorage.setItem('deymflix_my_list', JSON.stringify(list)); } catch (e) {}
      histSel.clear();
      renderTabContent();
      updateSelBar();
      showToast(removed + ' removed from history');
    }

    function switchTab(tab) {
      activeTab = tab;
      document.querySelectorAll('.mylist-tab').forEach(t => t.classList.remove('active'));
      document.querySelector(`[data-tab="${tab}"]`).classList.add('active');
      renderTabContent();
    }

    function renderTabContent() {
      const container = document.getElementById('mylist-content');
      switch (activeTab) {
        case 'bookmarks': renderBookmarks(container); break;
        case 'movies': renderMovieHistory(container); break;
        case 'series': renderSeriesHistory(container); break;
        case 'reels': renderReelsHistory(container); break;
      }
    }

    // ── BOOKMARKS ──
    function renderBookmarks(container) {
      const list = getMyList();
      if (list.length === 0) {
        container.innerHTML = '<div class="mylist-empty"><div class="mylist-empty-icon">🔖</div><p>Your bookmarks list is empty.<br>Tap the bookmark icon on any movie to save it here.</p></div>';
        return;
      }
      container.innerHTML = '<div class="mylist-grid">' + list.map(m => `
        <div class="mylist-item" data-del="bookmark:${sanitizeHTML(m.id)}" onclick="window.location.href='player.html?id=${encodeURIComponent(m.id)}'">
          <img src="${sanitizeHTML(m.poster)}" alt="${sanitizeHTML(m.title)}" loading="lazy">
          <div class="mylist-item-overlay">
            <div class="mylist-item-title">${sanitizeHTML(m.title)}</div>
          </div>
          <button class="mylist-remove-btn" onclick="event.stopPropagation(); removeBookmark('${sanitizeHTML(m.id)}')">✕</button>
        </div>
      `).join('') + '</div>';
    }

    function removeBookmark(id) {
      const list = getMyList().filter(m => m.id !== id);
      localStorage.setItem('deymflix_my_list', JSON.stringify(list));
      renderTabContent();
      showToast('Removed from Bookmarks');
    }

    function removeMovieHistory(id) {
      let saved;
      try { saved = JSON.parse(localStorage.getItem('deymflix_continue_watching') || '{}') || {}; } catch (e) { saved = {}; }
      delete saved[id];
      try { localStorage.setItem('deymflix_continue_watching', JSON.stringify(saved)); } catch (e) {}
      renderTabContent();
      showToast('Removed from history');
    }

    function removeSeriesHistory(id) {
      let saved;
      try { saved = JSON.parse(localStorage.getItem('deymflix_continue_watching') || '{}') || {}; } catch (e) { saved = {}; }
      delete saved[id];
      try { localStorage.setItem('deymflix_continue_watching', JSON.stringify(saved)); } catch (e) {}
      renderTabContent();
      showToast('Removed from history');
    }

    // The series card stands for the whole show — clearing it wipes EVERY
    // saved episode, so an older episode can't resurface as the "latest".
    function removeSeriesHistoryAll(baseId) {
      let saved;
      try { saved = JSON.parse(localStorage.getItem('deymflix_continue_watching') || '{}') || {}; } catch (e) { saved = {}; }
      Object.keys(saved).forEach(k => {
        if (k === baseId || seriesBaseId(k) === baseId) delete saved[k];
      });
      try { localStorage.setItem('deymflix_continue_watching', JSON.stringify(saved)); } catch (e) {}
      renderTabContent();
      showToast('Removed from history');
    }

    function removeReelHistoryItem(id) {
      const history = getReelHistory();
      delete history[id];
      localStorage.setItem('deymflix_reel_history', JSON.stringify(history));
      renderTabContent();
      showToast('Removed from history');
    }

    // ── MOVIE WATCH HISTORY ──
    function renderMovieHistory(container) {
      let saved;
      try { saved = JSON.parse(localStorage.getItem('deymflix_continue_watching') || '{}') || {}; } catch (e) { saved = {}; }
      const movieList = typeof movies !== 'undefined' ? movies : [];
      const items = Object.values(saved)
        .filter(item => {
          const movie = movieList.find(m => m.id === item.id);
          return movie && !movie.isSeries;
        })
        .sort((a, b) => (b.updatedAt || 0) - (a.updatedAt || 0));

      if (items.length === 0) {
        container.innerHTML = '<div class="mylist-empty"><div class="mylist-empty-icon">🎬</div><p>No movie watch history yet.<br>Start watching a movie and it will appear here.</p></div>';
        return;
      }
      container.innerHTML = '<div class="mylist-grid">' + items.map(item => {
        const pct = Math.min(100, Math.round(item.progress || 0));
        const finished = !!item.finished || pct >= 95;
        const watchAgain = finished ? `<button class="watch-again-btn" onclick="event.stopPropagation(); watchAgainFromHistory('${sanitizeHTML(item.id)}')" title="Watch Again">⟳ Watch Again</button>` : '';
        return `
        <div class="mylist-item" data-del="movie:${sanitizeHTML(item.id)}" onclick="window.location.href='player.html?id=${encodeURIComponent(item.id)}'">
          <img src="${sanitizeHTML(item.poster)}" alt="${sanitizeHTML(item.title)}" loading="lazy">
          ${finished ? '<div class="mylist-progress-badge">Finished</div>' : (pct > 0 ? `<div class="mylist-progress-badge">${pct}% watched</div>` : '')}
          <div class="mylist-progress" style="width: ${pct}%"></div>
          <div class="mylist-item-overlay">
            ${watchAgain}
            <div class="mylist-item-title">${sanitizeHTML(item.title)}</div>
          </div>
          <button class="mylist-remove-btn" onclick="event.stopPropagation(); removeMovieHistory('${sanitizeHTML(item.id)}')">✕</button>
        </div>
      `;
      }).join('') + '</div>';
    }

    // Restart a finished movie: clear its progress and jump straight into the player
    function watchAgainFromHistory(id) {
      let saved;
      try { saved = JSON.parse(localStorage.getItem('deymflix_continue_watching') || '{}') || {}; } catch (e) { saved = {}; }
      delete saved[id];
      try { localStorage.setItem('deymflix_continue_watching', JSON.stringify(saved)); } catch (e) {}
      showToast('Starting from the beginning…');
      setTimeout(() => { window.location.href = 'player.html?id=' + encodeURIComponent(id) + '&restart=1'; }, 350);
    }

    // ── SERIES WATCH HISTORY ──
    // ONE card per series, showing the FURTHEST episode reached: finish ep 1
    // and the card shows ep 1; get to ep 2 and the same card moves to ep 2 —
    // and so on. Episode keys are "<id>-s<n>-ep<m>" (legacy "<id>-ep<m>"; the
    // plain "<id>" row written before season support = episode 1).
    function seriesBaseId(id) {
      if (!id) return id;
      return String(id).replace(/-s\d+-ep\d+$/, '').replace(/-ep\d+$/, '');
    }
    function episodeRank(key) {
      let m = /-s(\d+)-ep(\d+)$/.exec(String(key));
      if (m) return parseInt(m[1], 10) * 1000 + parseInt(m[2], 10);
      m = /-ep(\d+)$/.exec(String(key));
      if (m) return 1000 + parseInt(m[1], 10);
      return 0;
    }

    function renderSeriesHistory(container) {
      let saved;
      try { saved = JSON.parse(localStorage.getItem('deymflix_continue_watching') || '{}') || {}; } catch (e) { saved = {}; }
      const movieList = typeof movies !== 'undefined' ? movies : [];

      // group every saved episode of a series under its base id, keep the one
      // the viewer got furthest into (ties go to the most recently touched)
      const byBase = {};
      Object.keys(saved).forEach(key => {
        const item = saved[key];
        if (!item) return;
        const baseId = seriesBaseId(key);
        const movie = movieList.find(m => m.id === baseId);
        if (!movie || !movie.isSeries) return;
        const sm = /-s(\d+)-ep\d+$/.exec(key);
        const em = /-ep(\d+)$/.exec(key);
        const cand = {
          item, baseId, rank: episodeRank(key),
          season: sm ? sm[1] : '1',
          ep: em ? em[1] : '1'
        };
        const prev = byBase[baseId];
        if (!prev || cand.rank > prev.rank || (cand.rank === prev.rank && (cand.item.updatedAt || 0) > (prev.item.updatedAt || 0))) byBase[baseId] = cand;
      });

      const picks = Object.values(byBase).sort((a, b) => (b.item.updatedAt || 0) - (a.item.updatedAt || 0));
      if (picks.length === 0) {
        container.innerHTML = '<div class="mylist-empty"><div class="mylist-empty-icon">📺</div><p>No series watch history yet.<br>Start watching a series and it will appear here.</p></div>';
        return;
      }
      container.innerHTML = '<div class="mylist-grid">' + picks.map(pick => {
        const item = pick.item;
        const pct = Math.min(100, Math.round(item.progress || 0));
        const finished = !!item.finished || pct >= 95;
        const seriesTitle = String(item.title || '').split(' - ')[0];
        const epLabel = 'S' + pick.season + ' E' + pick.ep;
        const badge = epLabel + (finished ? ' · Finished' : (pct > 0 ? ' · ' + pct + '% watched' : ''));
        const href = 'player.html?id=' + encodeURIComponent(pick.baseId) + '&s=' + pick.season + '&ep=' + pick.ep;
        return `
        <div class="mylist-item" data-del="series:${sanitizeHTML(pick.baseId)}" onclick="window.location.href='${href}'">
          <img src="${sanitizeHTML(item.poster)}" alt="${sanitizeHTML(seriesTitle)}" loading="lazy">
          <div class="mylist-progress-badge">${sanitizeHTML(badge)}</div>
          <div class="mylist-progress" style="width: ${pct}%"></div>
          <div class="mylist-item-overlay">
            <div class="mylist-item-title">${sanitizeHTML(seriesTitle)}</div>
          </div>
          <button class="mylist-remove-btn" onclick="event.stopPropagation(); removeSeriesHistoryAll('${sanitizeHTML(pick.baseId)}')">✕</button>
        </div>
      `;
      }).join('') + '</div>';
    }

    // ── REELS WATCH HISTORY ──
    function renderReelsHistory(container) {
      const history = getReelHistory();
      const items = Object.values(history)
        .filter(h => h && h.currentTime > 3)
        .sort((a, b) => (b.updatedAt || 0) - (a.updatedAt || 0));

      if (items.length === 0) {
        container.innerHTML = '<div class="mylist-empty"><div class="mylist-empty-icon">🎞️</div><p>No reel watch history yet.<br>Watch some reels and they will appear here.</p></div>';
        return;
      }
      container.innerHTML = '<div class="mylist-grid">' + items.map(item => {
        const pct = Math.min(100, Math.round(item.progress || 0));
        return `
        <div class="mylist-item" data-del="reel:${sanitizeHTML(item.id)}" onclick="window.location.href='reels.html?id=${encodeURIComponent(item.id)}'">
          <img src="${sanitizeHTML(item.poster || '')}" alt="${sanitizeHTML(item.title || '')}" loading="lazy">
          ${(item.finished || pct >= 95) ? '<div class="mylist-progress-badge">Finished</div>' : (pct > 0 ? `<div class="mylist-progress-badge">${pct}% watched</div>` : '')}
          <div class="mylist-progress" style="width: ${pct}%"></div>
          <div class="mylist-item-overlay">
            <div class="mylist-item-title">${sanitizeHTML(item.title || '')}</div>
          </div>
          <button class="mylist-remove-btn" onclick="event.stopPropagation(); removeReelHistoryItem('${sanitizeHTML(item.id)}')">✕</button>
        </div>
      `;
      }).join('') + '</div>';
    }

    function getReelHistory() {
      try { return JSON.parse(localStorage.getItem('deymflix_reel_history') || '{}'); } catch (e) { return {}; }
    }

    // Initial render
    document.addEventListener('DOMContentLoaded', () => {
      renderTabContent();
      const box = document.getElementById('mylist-content');
      if (box) box.addEventListener('click', tapInEditMode, true);
    });
  </script>
</body>
</html>
