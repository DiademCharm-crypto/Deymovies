<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DFX PROBE</title>
<style>
  html,body{margin:0;background:#000;color:#0f0}
  pre{padding:10px;font:700 20px/1.3 ui-monospace,Menlo,monospace;white-space:pre-wrap;word-break:break-word}
  iframe{position:fixed;left:0;top:0;width:360px;height:812px;border:0;background:#111;opacity:0.02;z-index:-1}
</style>
</head>
<body>
<pre id="out">PROBE RUNNING …</pre>
<iframe id="fr"></iframe>
<script>
(function () {
  var EP = 'http://localhost:8899';
  var out = document.getElementById('out');
  var seen = [];
  function beacon(s) {
    try {
      s = String(s);
      for (var i = 0; i < s.length; i += 1400) {
        new Image().src = EP + '/b?d=' + encodeURIComponent(s.slice(i, i + 1400));
      }
    } catch (e) {}
  }
  window.__b = beacon;
  function add(k, v) {
    var line = k + '=' + v;
    seen.push(line);
    out.textContent = seen.join('\n');
    beacon(line);
  }
  beacon('BEGIN');
  var fr = document.getElementById('fr');
  window.__frame = fr;

  function navSnapshot(tag) {
    try {
      var w = fr.contentWindow, d = fr.contentDocument;
      if (!d || !d.querySelector) { add(tag + '.noDOM', '1'); return; }
      add(tag + '.htmlclass', d.documentElement.className || 'none');
      add(tag + '.isapp', (w.DFX_IS_APP ? 'yes' : 'no'));
      var items = [].slice.call(d.querySelectorAll('.bottom-nav-item'));
      add(tag + '.count', items.length);
      add(tag + '.labels', [].slice.call(d.querySelectorAll('.bottom-nav-label')).map(function (n) { return n.textContent.trim(); }).join(',') || 'none');
      add(tag + '.rects', items.map(function (n) {
        var r = n.getBoundingClientRect();
        return n.getAttribute('data-page') + '@' + Math.round(r.left) + '+' + Math.round(r.width);
      }).join(' '));
      var ul = d.querySelector('.bottom-nav-items');
      if (ul) {
        var ur = ul.getBoundingClientRect(), cs = getComputedStyle(ul);
        add(tag + '.ul', 'L' + Math.round(ur.left) + ' W' + Math.round(ur.width) + ' scrollW' + ul.scrollWidth + ' clientW' + ul.clientWidth + ' justify=' + cs.justifyContent + ' overflowX=' + cs.overflowX);
      }
      var cw = d.getElementById('continue-watching-section');
      add(tag + '.cw', cw ? (getComputedStyle(cw).display === 'none' || cw.hasAttribute('hidden') ? 'HIDDEN' : 'shown') : 'absent');
      add(tag + '.mebtn', d.querySelector('[data-page="me"]') ? 'PRESENT' : 'ABSENT');
    } catch (e) { add(tag + '.ERR', e.message); }
  }
  window.__nav = navSnapshot;

  // ── static environment facts ──
  add('UA', navigator.userAgent);
  add('UAAPP', /DeymflixApp/i.test(navigator.userAgent) ? 'yes' : 'NO');
  add('VPX', window.innerWidth + 'x' + window.innerHeight + ' dpr' + window.devicePixelRatio);

  try {
    var ctrl = navigator.serviceWorker && navigator.serviceWorker.controller;
    add('SWCTRL', ctrl ? String(ctrl.scriptURL).replace(/^https?:\/\//, '') : 'none');
    navigator.serviceWorker.getRegistrations().then(function (regs) {
      add('SWREGS', regs.length);
      regs.forEach(function (r, i) {
        add('SWREG' + i, 'active=' + (r.active ? 'y' : 'n') + ' waiting=' + (r.waiting ? 'y' : 'n') + ' installing=' + (r.installing ? 'y' : 'n'));
      });
    }).catch(function () {});
  } catch (e) { add('SWERR', e.message); }

  if (window.caches) {
    caches.keys().then(function (k) { add('CACHES', k.join(',') || 'none'); }).catch(function () {});
  }

  fetch('/app.js?_p=' + Date.now(), { cache: 'no-store' }).then(function (r) { return r.text(); }).then(function (t) {
    add('LIVEAPPJS_BYTES', t.length);
    add('LIVEAPPJS_ME', t.indexOf('installMeNavItem') !== -1 ? 'yes' : 'NO');
  }).catch(function (e) { add('LIVEAPPJS_ERR', e.message); });

  // ── the real page, exactly as the app loads it ──
  fr.addEventListener('load', function () {
    add('IFRAME_LOAD', 'yes');
    setTimeout(function () { navSnapshot('NAV0'); }, 2500);
    setTimeout(function () { navSnapshot('NAV5'); }, 5500);
    try {
      var mo = new MutationObserver(function () { navSnapshot('NAVMUT'); });
      mo.observe(fr.contentDocument.querySelector('body'), { childList: true, subtree: true });
    } catch (e) { add('MO_ERR', e.message); }
  });
  fr.src = '/index.html?_p=' + Date.now();
  setTimeout(function () { add('IFRAME_LOAD', 'LATE'); }, 12000);

  // ── command channel: _tools/_dbg_beacon.cjs + .freebuff/dbg.cmd ──
  var lastV = '0';
  setInterval(function () {
    fetch(EP + '/cmd?v=' + lastV, { cache: 'no-store' }).then(function (r) {
      if (r.status === 204) return null;
      return r.json();
    }).then(function (j) {
      if (!j) return;
      lastV = j.v;
      var p = Promise.resolve().then(function () { return eval('(async () => {\n' + j.js + '\n})()'); });
      p.then(function (v) { beacon('R:' + JSON.stringify(v === undefined ? 'ok' : v)); })
       .catch(function (e) { beacon('RERR:' + ((e && e.message) || String(e))); });
    }).catch(function () {});
  }, 1000);
})();
</script>
</body>
</html>
