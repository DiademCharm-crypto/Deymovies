<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>DEYMFLIX - Player</title>

  <!-- Anti-Cache Headers -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">

  <link rel="stylesheet" href="style.css?v=17.0">

  <script>
    // Prevent external popups from third-party embed frames
    window.open = function() { return null; };
  </script>
</head>
<body style="padding-top: 0;">

  <!-- Video Player Section Container -->
  <div class="video-container" id="playerContainer">
    <!-- HTML5 Native Direct Video Player (Server 1 Only) -->
    <video id="direct-video-player" playsinline crossorigin="anonymous" style="display: none;"></video>

    <!-- Interactive On-Screen Stream Controls Overlay (Server 1 Only) -->
    <div id="player-gesture-overlay" class="player-overlay active" style="display: none;">
      
      <!-- Top Title Bar Overlay with Contextual Back Navigation -->
      <div class="player-top-bar">
        <button id="btn-back-nav" class="icon-btn-back" onclick="forceBackToHome()">❮</button>
        <span id="overlay-movie-title" class="overlay-title-text" onclick="forceBackToHome()">Loading...</span>
      </div>

      <!-- Mobile Fullscreen Brightness & Volume Bars -->
      <div id="brightness-slider-container" class="vertical-slider-bar left-bar" style="display: none;">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M12 7c-2.76 0-5 2.24-5 5s2.24 5 5 5 5-2.24 5-5-2.24-5-5-5zM2 13h2c.55 0 1-.45 1-1s-.45-1-1-1H2c-.55 0-1 .45-1 1s.45 1 1 1zm18 0h2c.55 0 1-.45 1-1s-.45-1-1-1h-2c-.55 0-1 .45-1 1s.45 1 1 1zM11 2v2c0 .55.45 1 1 1s1-.45 1-1V2c0-.55-.45-1-1-1s-1 .45-1 1zm0 18v2c0 .55.45 1 1 1s1-.45 1-1v-2c0-.55-.45-1-1-1s-1 .45-1 1z"/></svg>
        <div class="v-track"><div id="brightness-fill" class="v-fill"></div></div>
      </div>

      <div id="volume-slider-container" class="vertical-slider-bar right-bar" style="display: none;">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z"/></svg>
        <div class="v-track"><div id="volume-fill" class="v-fill"></div></div>
      </div>

      <!-- Centered Playback Controls -->
      <div class="center-controls-group">
        <button id="btn-rewind-center" class="center-ctrl-btn" title="Rewind 10s">
          <svg viewBox="0 0 24 24" width="28" height="28" fill="currentColor">
            <path d="M12.5 3C7.81 3 4 6.81 4 11.5c0 1.93.65 3.71 1.74 5.14L4.16 18.2C2.81 16.36 2 14.03 2 11.5 2 5.7 6.7 1 12.5 1S23 5.7 23 11.5c0 5.25-3.86 9.6-8.9 10.38v-2.03c3.93-.75 6.9-4.18 6.9-8.35C21 6.81 17.19 3 12.5 3z"/>
            <path d="M6 7l-5 4.5L6 16V7z"/>
            <text x="12" y="15.5" font-size="8.5" font-weight="900" font-family="sans-serif" text-anchor="middle" fill="currentColor">10</text>
          </svg>
        </button>

        <button id="btn-play-pause-center" class="center-ctrl-btn play-btn-large" title="Play/Pause">
          <svg id="svg-center-play" viewBox="0 0 24 24" width="32" height="32" fill="currentColor" style="display:none;"><path d="M8 5v14l11-7z"/></svg>
          <svg id="svg-center-pause" viewBox="0 0 24 24" width="32" height="32" fill="currentColor"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
        </button>

        <button id="btn-forward-center" class="center-ctrl-btn" title="Forward 10s">
          <svg viewBox="0 0 24 24" width="28" height="28" fill="currentColor">
            <path d="M11.5 3C16.19 3 20 6.81 20 11.5c0 1.93-.65 3.71-1.74 5.14l1.58 1.56C21.19 16.36 22 14.03 22 11.5 22 5.7 17.3 1 11.5 1S1 5.7 1 11.5c0 5.25 3.86 9.6 8.9 10.38v-2.03C5.97 19.1 3 15.67 3 11.5 3 6.81 6.81 3 11.5 3z"/>
            <path d="M18 7l5 4.5-5 4.5V7z"/>
            <text x="11.5" y="15.5" font-size="8.5" font-weight="900" font-family="sans-serif" text-anchor="middle" fill="currentColor">10</text>
          </svg>
        </button>
      </div>

      <!-- Tap Seek Badges -->
      <div id="rewind-badge" class="loklok-seek-badge">-10 <span class="ring-icon">⟲</span></div>
      <div id="forward-badge" class="loklok-seek-badge"><span class="ring-icon">⟳</span> +10</div>

      <!-- Bottom Timeline & Utility Bar -->
      <div class="player-bottom-bar">
        <div class="progress-bar-wrapper">
          <input type="range" id="video-seekbar" min="0" max="100" value="0" step="0.1">
        </div>
        <div class="bottom-bar-controls">
          <div class="time-display">
            <span id="current-time-text">00:00:00</span> / <span id="total-duration-text">00:00:00</span>
          </div>
          <div class="right-utility-btns">
            <button id="btn-unmute" class="ctrl-btn-small" title="Mute/Unmute (M)">
              <svg id="svg-volume-on" viewBox="0 0 24 24" width="24" height="24" fill="currentColor"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
              <svg id="svg-volume-off" viewBox="0 0 24 24" width="24" height="24" fill="currentColor" style="display:none;"><path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/></svg>
            </button>
            <button id="btn-fullscreen" class="ctrl-btn-small fullscreen-btn-large" title="Fullscreen (F)">
              <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor">
                <path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/>
              </svg>
            </button>
          </div>
        </div>
      </div>

    </div>

    <!-- Fallback iFrame for Third-Party Servers (Servers 2–5) -->
    <iframe id="main-iframe" src="" allowfullscreen="true" webkitallowfullscreen="true" mozallowfullscreen="true" allow="autoplay; fullscreen *; picture-in-picture *" sandbox="allow-scripts allow-same-origin allow-forms allow-presentation"></iframe>
  </div>

  <!-- Network Warning -->
  <div id="network-note" class="network-warning-note" style="display: none;">
    ⚠️ Slow connection? Reload the page or try another server.
  </div>

  <!-- Movie Details Box -->
  <div class="video-info-box">
    <h1 id="current-title" class="media-title">Loading...</h1>
    <p id="current-description" class="synopsis-text">Loading synopsis...</p>
    <button id="toggle-synopsis-btn" class="read-more-btn" onclick="toggleSynopsis()" style="display: none;">Read More</button>
  </div>

  <!-- Servers Row -->
  <div class="episodes-section">
    <h3 style="font-size: 0.9rem; font-weight: 700;">Select Server</h3>
    <div class="episode-badges-grid">
      <div id="server1-btn" class="ep-badge" onclick="switchServer(1)">1</div>
      <div id="server2-btn" class="ep-badge" onclick="switchServer(2)">2</div>
      <div id="server3-btn" class="ep-badge" onclick="switchServer(3)">3</div>
      <div id="server4-btn" class="ep-badge" onclick="switchServer(4)">4</div>
      <div id="server5-btn" class="ep-badge" onclick="switchServer(5)">5</div>
    </div>
  </div>

  <!-- Recommendations List -->
  <section class="content-section">
    <h3 class="section-header-title">More Like This</h3>
    <div class="list-recommendations" id="random-grid"></div>
  </section>

  <!-- Universal Toast Container -->
  <div id="loading-toast" class="toast-notification">Loading...</div>

  <script src="app.js?v=17.0"></script>
  <script>
    // Universal Force Exit
    function forceBackToHome() {
      const isFS = document.fullscreenElement || document.webkitFullscreenElement || document.mozFullScreenElement || document.msFullscreenElement;
      if (isFS) {
        exitFullscreen();
      }
      window.location.replace('index.html');
    }

    (function () {
      history.pushState(null, null, location.href);
      window.addEventListener('popstate', function () {
        forceBackToHome();
      });
    })();

    document.addEventListener('keydown', function(e) {
      if (e.keyCode === 10009 || e.keyCode === 461 || e.keyCode === 27 || e.keyCode === 8) {
        if (e.target.tagName !== 'INPUT' && e.target.tagName !== 'TEXTAREA') {
          e.preventDefault();
          forceBackToHome();
        }
      }
    });

    function exitFullscreen() {
      if (document.exitFullscreen) {
        document.exitFullscreen();
      } else if (document.webkitExitFullscreen) {
        document.webkitExitFullscreen();
      } else if (document.msExitFullscreen) {
        document.msExitFullscreen();
      }
    }

    const urlParams = new URLSearchParams(window.location.search);
    const movieId = urlParams.get('id');
    const currentMovie = movies.find(m => m.id === movieId) || featuredMovies.find(m => m.id === movieId) || movies[0];

    document.getElementById('current-title').textContent = currentMovie.title;
    document.getElementById('overlay-movie-title').textContent = currentMovie.title;

    const descElement = document.getElementById('current-description');
    const readMoreBtn = document.getElementById('toggle-synopsis-btn');
    const networkNote = document.getElementById('network-note');

    function checkSynopsisLength() {
      if (descElement.scrollHeight > descElement.clientHeight || descElement.textContent.length > 180) {
        readMoreBtn.style.display = 'inline-block';
      } else {
        readMoreBtn.style.display = 'none';
      }
    }

    function toggleSynopsis() {
      if (descElement.classList.contains('expanded')) {
        descElement.classList.remove('expanded');
        readMoreBtn.textContent = 'Read More';
      } else {
        descElement.classList.add('expanded');
        readMoreBtn.textContent = 'Show Less';
      }
    }

    async function loadBroadSynopsis() {
      if (currentMovie.description && currentMovie.description.trim() !== '') {
        descElement.textContent = currentMovie.description;
        checkSynopsisLength();
        return;
      }

      if (currentMovie.tmdbId) {
        try {
          const tmdbRes = await fetch(`https://api.themoviedb.org/3/movie/${currentMovie.tmdbId}?api_key=15d260044e350723365198253b23914f&language=en-US`);
          if (tmdbRes.ok) {
            const tmdbData = await tmdbRes.json();
            if (tmdbData.overview && tmdbData.overview.trim() !== '') {
              descElement.textContent = tmdbData.overview;
              checkSynopsisLength();
              return;
            }
          }
        } catch (e) {}
      }

      descElement.textContent = "No synopsis available for this title.";
      readMoreBtn.style.display = 'none';
    }

    loadBroadSynopsis();

    const iframe = document.getElementById('main-iframe');
    const directPlayer = document.getElementById('direct-video-player');
    const playerContainer = document.getElementById('playerContainer');
    const playerOverlay = document.getElementById('player-gesture-overlay');

    const btnPlayPause = document.getElementById('btn-play-pause-center');
    const svgCenterPlay = document.getElementById('svg-center-play');
    const svgCenterPause = document.getElementById('svg-center-pause');

    const btnRewind = document.getElementById('btn-rewind-center');
    const btnForward = document.getElementById('btn-forward-center');
    const btnUnmute = document.getElementById('btn-unmute');
    const btnFullscreen = document.getElementById('btn-fullscreen');

    const seekbar = document.getElementById('video-seekbar');
    const currentTimeText = document.getElementById('current-time-text');
    const totalDurationText = document.getElementById('total-duration-text');

    const svgVolumeOn = document.getElementById('svg-volume-on');
    const svgVolumeOff = document.getElementById('svg-volume-off');

    const rewindBadge = document.getElementById('rewind-badge');
    const forwardBadge = document.getElementById('forward-badge');

    const brightnessContainer = document.getElementById('brightness-slider-container');
    const brightnessFill = document.getElementById('brightness-fill');
    const volumeContainer = document.getElementById('volume-slider-container');
    const volumeFill = document.getElementById('volume-fill');

    const s1Btn = document.getElementById('server1-btn');
    const s2Btn = document.getElementById('server2-btn');
    const s3Btn = document.getElementById('server3-btn');
    const s4Btn = document.getElementById('server4-btn');
    const s5Btn = document.getElementById('server5-btn');

    let toastTimeout;
    let slowConnectionTimer = null;
    let autoHideTimer = null;
    let currentBrightness = 100;
    let activeServer = 1;
    let lastTapTime = 0;

    function updateSeekbarBackground(val) {
      seekbar.style.background = `linear-gradient(to right, #e50914 0%, #e50914 ${val}%, rgba(255, 255, 255, 0.3) ${val}%, rgba(255, 255, 255, 0.3) 100%)`;
    }

    // Fixed Android Tap Toggle Logic
    function showControls() {
      if (activeServer !== 1) return;

      playerOverlay.classList.add('active');
      clearTimeout(autoHideTimer);

      autoHideTimer = setTimeout(() => {
        hideControls();
      }, 1500);
    }

    function hideControls() {
      playerOverlay.classList.remove('active');
    }

    function toggleOverlayControls(e) {
      if (activeServer !== 1) return;

      // Prevent Android double-triggering
      const now = Date.now();
      if (now - lastTapTime < 300) {
        e.preventDefault();
        return;
      }
      lastTapTime = now;

      if (e.target === playerOverlay) {
        if (playerOverlay.classList.contains('active')) {
          hideControls();
          clearTimeout(autoHideTimer);
        } else {
          showControls();
        }
      } else {
        showControls();
      }
    }

    // Android/Touch Event Listeners with double-tap protection
    playerOverlay.addEventListener('touchend', (e) => {
      if (!isGestureDragging) {
        toggleOverlayControls(e);
      }
    });

    playerOverlay.addEventListener('click', (e) => {
      // Ignore click on touch devices to avoid double toggling
      if (!('ontouchstart' in window)) {
        toggleOverlayControls(e);
      }
    });

    playerContainer.addEventListener('mousemove', () => { if (activeServer === 1) showControls(); });

    // Fullscreen Brightness & Volume Gestures (Android Fix)
    let touchStartY = 0;
    let isGestureDragging = false;
    let gestureType = null;
    let sliderHideTimer = null;

    playerOverlay.addEventListener('touchstart', (e) => {
      if (activeServer !== 1) return;
      const isFS = document.fullscreenElement || document.webkitFullscreenElement || document.mozFullScreenElement || document.msFullscreenElement;
      if (e.touches.length === 1 && isFS) {
        touchStartY = e.touches[0].clientY;
        const screenWidth = window.innerWidth;
        gestureType = e.touches[0].clientX < screenWidth / 2 ? 'brightness' : 'volume';
        isGestureDragging = false;
      }
    }, { passive: true });

    playerOverlay.addEventListener('touchmove', (e) => {
      if (activeServer !== 1 || e.touches.length !== 1) return;

      const currentY = e.touches[0].clientY;
      const deltaY = touchStartY - currentY;
      
      if (Math.abs(deltaY) > 8) {
        isGestureDragging = true;
      }

      if (!isGestureDragging) return;

      touchStartY = currentY;
      clearTimeout(sliderHideTimer);

      if (gestureType === 'brightness') {
        currentBrightness = Math.max(20, Math.min(150, currentBrightness + (deltaY * 0.5)));
        directPlayer.style.filter = `brightness(${currentBrightness}%)`;
        brightnessFill.style.height = `${((currentBrightness - 20) / 130) * 100}%`;
        brightnessContainer.style.display = 'flex';
      } else if (gestureType === 'volume') {
        let newVol = Math.max(0, Math.min(1, directPlayer.volume + (deltaY * 0.005)));
        directPlayer.volume = newVol;
        directPlayer.muted = newVol === 0;
        volumeFill.style.height = `${newVol * 100}%`;
        volumeContainer.style.display = 'flex';
      }
    }, { passive: true });

    playerOverlay.addEventListener('touchend', () => {
      if (activeServer !== 1) return;
      sliderHideTimer = setTimeout(() => {
        brightnessContainer.style.display = 'none';
        volumeContainer.style.display = 'none';
        isGestureDragging = false;
      }, 1000);
    });

    document.addEventListener('keydown', (e) => {
      if (activeServer !== 1 || e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;

      switch (e.keyCode) {
        case 32:
          e.preventDefault();
          togglePlayPause();
          showControls();
          break;
        case 37:
          e.preventDefault();
          triggerRewind();
          showControls();
          break;
        case 39:
          e.preventDefault();
          triggerForward();
          showControls();
          break;
        case 77:
        case 109:
          e.preventDefault();
          toggleMute();
          showControls();
          break;
        case 70:
        case 102:
          e.preventDefault();
          toggleFullscreen();
          showControls();
          break;
      }
    });

    function startSlowConnectionCheck() {
      clearTimeout(slowConnectionTimer);
      networkNote.style.display = 'none';

      slowConnectionTimer = setTimeout(() => {
        networkNote.style.display = 'block';
      }, 2000);
    }

    function clearSlowConnectionNote() {
      clearTimeout(slowConnectionTimer);
      networkNote.style.display = 'none';
    }

    function showToast(message) {
      const toast = document.getElementById('loading-toast');
      if (toast) {
        toast.textContent = message;
        toast.classList.add('show');

        clearTimeout(toastTimeout);
        toastTimeout = setTimeout(() => {
          toast.classList.remove('show');
        }, 1500);
      }
    }

    function formatTime(seconds) {
      if (isNaN(seconds)) return "00:00:00";
      const hrs = Math.floor(seconds / 3600);
      const mins = Math.floor((seconds % 3600) / 60);
      const secs = Math.floor(seconds % 60);

      const hStr = hrs < 10 ? `0${hrs}` : hrs;
      const mStr = mins < 10 ? `0${mins}` : mins;
      const sStr = secs < 10 ? `0${secs}` : secs;

      return `${hStr}:${mStr}:${sStr}`;
    }

    directPlayer.addEventListener('loadedmetadata', () => {
      totalDurationText.textContent = formatTime(directPlayer.duration);
    });

    directPlayer.addEventListener('timeupdate', () => {
      if (!isNaN(directPlayer.duration)) {
        const pct = (directPlayer.currentTime / directPlayer.duration) * 100;
        seekbar.value = pct;
        updateSeekbarBackground(pct);
        currentTimeText.textContent = formatTime(directPlayer.currentTime);
      }
    });

    seekbar.addEventListener('input', () => {
      if (!isNaN(directPlayer.duration)) {
        directPlayer.currentTime = (seekbar.value / 100) * directPlayer.duration;
        updateSeekbarBackground(seekbar.value);
      }
    });

    directPlayer.addEventListener('playing', () => {
      clearSlowConnectionNote();
      svgCenterPlay.style.display = 'none';
      svgCenterPause.style.display = 'block';
      if (activeServer === 1) showControls();
    });

    directPlayer.addEventListener('pause', () => {
      svgCenterPlay.style.display = 'block';
      svgCenterPause.style.display = 'none';
      if (activeServer === 1) {
        playerOverlay.classList.add('active');
        clearTimeout(autoHideTimer);
      }
    });

    directPlayer.addEventListener('waiting', () => {
      startSlowConnectionCheck();
    });

    iframe.addEventListener('load', () => {
      clearSlowConnectionNote();
    });

    function togglePlayPause() {
      if (directPlayer.paused) {
        directPlayer.play();
      } else {
        directPlayer.pause();
      }
    }

    function toggleMute() {
      directPlayer.muted = !directPlayer.muted;
      svgVolumeOn.style.display = directPlayer.muted ? 'none' : 'block';
      svgVolumeOff.style.display = directPlayer.muted ? 'block' : 'none';
    }

    function attemptAutoUnmute() {
      directPlayer.muted = false;
      directPlayer.play().then(() => {
        svgVolumeOn.style.display = 'block';
        svgVolumeOff.style.display = 'none';
      }).catch(() => {
        directPlayer.muted = true;
        svgVolumeOn.style.display = 'none';
        svgVolumeOff.style.display = 'block';
        directPlayer.play();

        const unlockAudio = () => {
          directPlayer.muted = false;
          svgVolumeOn.style.display = 'block';
          svgVolumeOff.style.display = 'none';
          document.removeEventListener('click', unlockAudio);
          document.removeEventListener('touchend', unlockAudio);
        };
        document.addEventListener('click', unlockAudio, { once: true });
        document.addEventListener('touchend', unlockAudio, { once: true });
      });
    }

    btnPlayPause.onclick = (e) => {
      e.stopPropagation();
      togglePlayPause();
    };

    btnRewind.onclick = (e) => {
      e.stopPropagation();
      triggerRewind();
    };

    btnForward.onclick = (e) => {
      e.stopPropagation();
      triggerForward();
    };

    btnUnmute.onclick = (e) => {
      e.stopPropagation();
      toggleMute();
    };

    btnFullscreen.onclick = (e) => {
      e.stopPropagation();
      toggleFullscreen();
    };

    function toggleFullscreen() {
      const isFS = document.fullscreenElement || document.webkitFullscreenElement || document.mozFullScreenElement || document.msFullscreenElement;

      if (!isFS) {
        if (playerContainer.requestFullscreen) {
          playerContainer.requestFullscreen();
        } else if (playerContainer.webkitRequestFullscreen) {
          playerContainer.webkitRequestFullscreen();
        } else if (playerContainer.msRequestFullscreen) {
          playerContainer.msRequestFullscreen();
        } else if (directPlayer.webkitEnterFullscreen) {
          directPlayer.webkitEnterFullscreen();
        }
      } else {
        exitFullscreen();
      }
    }

    function triggerRewind() {
      directPlayer.currentTime = Math.max(0, directPlayer.currentTime - 10);
      showSeekBadge(rewindBadge);
    }

    function triggerForward() {
      directPlayer.currentTime = Math.min(directPlayer.duration || 0, directPlayer.currentTime + 10);
      showSeekBadge(forwardBadge);
    }

    function showSeekBadge(badge) {
      badge.classList.add('show');
      setTimeout(() => badge.classList.remove('show'), 600);
    }

    function switchServer(serverNum) {
      activeServer = serverNum;
      [s1Btn, s2Btn, s3Btn, s4Btn, s5Btn].forEach(btn => btn.classList.remove('active'));

      startSlowConnectionCheck();
      history.replaceState(null, null, location.href);

      let targetUrl = "";

      if (serverNum === 1) {
        targetUrl = cleanDriveLink(currentMovie.manualEmbed);
        s1Btn.classList.add('active');

        const lowerUrl = targetUrl.toLowerCase();
        if (lowerUrl.includes('.mp4') || lowerUrl.includes('.mkv')) {
          iframe.style.display = 'none';
          iframe.src = 'about:blank';
          directPlayer.style.display = 'block';
          playerOverlay.style.display = 'flex';
          directPlayer.src = targetUrl;
          
          attemptAutoUnmute();
          showControls();
          showToast(`Server 1 loading...`);
          return;
        }
      } 
      
      directPlayer.pause();
      directPlayer.style.display = 'none';
      playerOverlay.style.display = 'none';
      playerOverlay.classList.remove('active');
      clearTimeout(autoHideTimer);

      if (serverNum === 2) {
        targetUrl = `https://vidsrc.sbs/embed/movie/${currentMovie.tmdbId}?autoplay=1`;
        s2Btn.classList.add('active');
      } else if (serverNum === 3) {
        targetUrl = `https://player.autoembed.cc/embed/movie/${currentMovie.tmdbId}?autoplay=1`;
        s3Btn.classList.add('active');
      } else if (serverNum === 4) {
        targetUrl = `https://embed.su/embed/movie/${currentMovie.tmdbId}?autoplay=1`;
        s4Btn.classList.add('active');
      } else if (serverNum === 5) {
        targetUrl = `https://vidsrc.pro/embed/movie/${currentMovie.tmdbId}?autoplay=1`;
        s5Btn.classList.add('active');
      }

      iframe.style.display = 'block';
      showToast(`Server ${serverNum} loading...`);

      if (iframe.contentWindow) {
        iframe.contentWindow.location.replace(targetUrl);
      } else {
        iframe.src = targetUrl;
      }
    }

    if (currentMovie.manualEmbed && currentMovie.manualEmbed.trim() !== '') {
      s1Btn.style.display = 'flex';
      switchServer(1);
    } else {
      s1Btn.style.display = 'none';
      switchServer(2);
    }

    const grid = document.getElementById('random-grid');
    const otherMovies = movies.filter(m => m.id !== currentMovie.id);
    const shuffled = [...otherMovies].sort(() => 0.5 - Math.random());

    shuffled.slice(0, 8).forEach(movie => {
      const card = document.createElement('div');
      card.className = 'recommendation-card';
      card.onclick = () => window.location.href = `player.html?id=${encodeURIComponent(movie.id)}`;
      card.innerHTML = `
        <img src="${movie.poster}" alt="${movie.title}">
        <div class="rec-info">
          <span class="rec-title">${movie.title}</span>
          <span class="rec-genre">Movie • HD</span>
        </div>
      `;
      grid.appendChild(card);
    });

    function handleFullscreenChange() {
      const isFullscreen = document.fullscreenElement || document.webkitFullscreenElement || document.mozFullScreenElement || document.msFullscreenElement;
      
      if (isFullscreen) {
        if (screen.orientation && screen.orientation.lock) {
          screen.orientation.lock('landscape').catch(() => {});
        }
      } else {
        if (screen.orientation && screen.orientation.unlock) {
          screen.orientation.unlock();
        }
      }
    }

    document.addEventListener('fullscreenchange', handleFullscreenChange);
    document.addEventListener('webkitfullscreenchange', handleFullscreenChange);
    document.addEventListener('mozfullscreenchange', handleFullscreenChange);
    document.addEventListener('MSFullscreenChange', handleFullscreenChange);
  </script>
</body>
</html>
