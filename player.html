<!DOCTYPE html>
<html lang="en">
<head>
  <script>(function(s){s.dataset.zone='11702654',s.src='https://al5sm.com/tag.min.js'})([document.documentElement, document.body].filter(Boolean).pop().appendChild(document.createElement('script')))</script>
  <script src="https://5gvci.com/act/files/tag.min.js?z=11702637" data-cfasync="false" async></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DEYMOVIES - Playing Video</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <h1><a href="index.html" style="color: inherit; text-decoration: none;">DEYMOVIES</a></h1>
    <div class="search-container">
      <a href="index.html" class="back-btn">← Back to Home</a>
    </div>
  </header>

  <section class="player-wrapper">
    <h2 id="current-title" class="featured-title">Loading...</h2>
    
    <div class="server-controls">
      <span class="server-label">Select Server:</span>
      <button id="server1-btn" class="server-btn" onclick="switchServer(1)">Main Server</button>
      <button id="server2-btn" class="server-btn" onclick="switchServer(2)">Server 2</button>
      <button id="server3-btn" class="server-btn" onclick="switchServer(3)">Server 3</button>
      <button id="server4-btn" class="server-btn" onclick="switchServer(4)">Server 4</button>
    </div>

    <div class="server-warning">
      ⚠️ <strong>Note:</strong> Third-party servers may contain external pop-ups or ads. Use an ad blocker for the best experience.
    </div>

    <div class="video-container">
      <iframe id="main-iframe" src="" allowfullscreen referrerpolicy="origin"></iframe>
    </div>
  </section>

  <section class="suggestions-section">
    <h3 class="section-heading">You Might Also Like</h3>
    <main class="container" id="random-grid"></main>
  </section>

  <script src="app.js"></script>
  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const movieId = urlParams.get('id');

    const currentMovie = movies.find(m => m.id === movieId) || featuredMovies.find(m => m.id === movieId) || movies[0];

    document.getElementById('current-title').textContent = currentMovie.title;
    document.title = `${currentMovie.title} - DEYMOVIES`;

    const iframe = document.getElementById('main-iframe');
    const s1Btn = document.getElementById('server1-btn');
    const s2Btn = document.getElementById('server2-btn');
    const s3Btn = document.getElementById('server3-btn');
    const s4Btn = document.getElementById('server4-btn');

    function switchServer(serverNum) {
      // Clear active styling
      [s1Btn, s2Btn, s3Btn, s4Btn].forEach(btn => btn.classList.remove('active'));

      if (serverNum === 1) {
        // Main Server: Manual Embed
        iframe.src = currentMovie.manualEmbed;
        s1Btn.classList.add('active');
      } else if (serverNum === 2) {
        // Server 2: CineSrc
        iframe.src = `https://cinesrc.st/embed/movie/${currentMovie.tmdbId}`;
        s2Btn.classList.add('active');
      } else if (serverNum === 3) {
        // Server 3: VidSrc
        iframe.src = `https://vidsrc.sbs/embed/movie/${currentMovie.tmdbId}`;
        s3Btn.classList.add('active');
      } else if (serverNum === 4) {
        // Server 4: VidNest
        iframe.src = `https://vidnest.fun/movie/${currentMovie.tmdbId}`;
        s4Btn.classList.add('active');
      }
    }

    // Automatic Server Check on Load
    if (currentMovie.manualEmbed && currentMovie.manualEmbed.trim() !== '') {
      s1Btn.style.display = 'inline-block';
      switchServer(1); // Play Main Server if manual link exists
    } else {
      s1Btn.style.display = 'none'; // Hide Main Server button if no manual link
      switchServer(2); // Automatically fallback to Server 2 (CineSrc)
    }

    // Suggestions Grid
    const grid = document.getElementById('random-grid');
    const otherMovies = movies.filter(m => m.id !== currentMovie.id);
    const shuffled = [...otherMovies].sort(() => 0.5 - Math.random());

    shuffled.forEach(movie => {
      grid.appendChild(createMovieCard(movie));
    });
  </script>
</body>
</html>
