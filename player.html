<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>DEYMOVIES - Player</title>
  <link rel="stylesheet" href="style.css">
  
  <script>
    // Disable external window popups from video embed servers
    window.open = function() { return null; };
  </script>
</head>
<body>

  <!-- Top Navigation -->
  <header class="player-top-header">
    <a href="index.html" class="back-icon-btn">←</a>
    <span style="font-weight: 700; font-size: 0.95rem;">DEYMOVIES</span>
  </header>

  <!-- Embedded Player -->
  <div class="video-container">
    <iframe id="main-iframe" src="" allowfullscreen="true" webkitallowfullscreen="true" mozallowfullscreen="true" allow="autoplay; fullscreen; picture-in-picture" sandbox="allow-scripts allow-same-origin allow-forms allow-presentation"></iframe>
  </div>

  <!-- Media Details & Action Card -->
  <div class="video-info-box">
    <h1 id="current-title" class="media-title">Loading...</h1>
    
    <div class="quick-action-bar">
      <div class="action-item"><span>📥</span><span>Download</span></div>
      <div class="action-item"><span>➕</span><span>My List</span></div>
      <div class="action-item"><span>↗</span><span>Share</span></div>
    </div>
  </div>

  <!-- Servers / Sources Row -->
  <div class="episodes-section">
    <h3 style="font-size: 0.9rem; font-weight: 700;">Select Server</h3>
    <div class="episode-badges-grid">
      <div id="server1-btn" class="ep-badge" onclick="switchServer(1)">1</div>
      <div id="server2-btn" class="ep-badge" onclick="switchServer(2)">2</div>
      <div id="server3-btn" class="ep-badge" onclick="switchServer(3)">3</div>
      <div id="server4-btn" class="ep-badge" onclick="switchServer(4)">4</div>
    </div>
  </div>

  <!-- Recommendations Horizontal List -->
  <section class="content-section">
    <h3 class="section-header-title">More Like This</h3>
    <div class="list-recommendations" id="random-grid"></div>
  </section>

  <script src="app.js"></script>
  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const movieId = urlParams.get('id');

    const currentMovie = movies.find(m => m.id === movieId) || featuredMovies.find(m => m.id === movieId) || movies[0];

    document.getElementById('current-title').textContent = currentMovie.title;

    const iframe = document.getElementById('main-iframe');
    const s1Btn = document.getElementById('server1-btn');
    const s2Btn = document.getElementById('server2-btn');
    const s3Btn = document.getElementById('server3-btn');
    const s4Btn = document.getElementById('server4-btn');

    function switchServer(serverNum) {
      [s1Btn, s2Btn, s3Btn, s4Btn].forEach(btn => btn.classList.remove('active'));

      if (serverNum === 1) {
        iframe.src = cleanDriveLink(currentMovie.manualEmbed);
        s1Btn.classList.add('active');
      } else if (serverNum === 2) {
        iframe.src = `https://cinesrc.st/embed/movie/${currentMovie.tmdbId}`;
        s2Btn.classList.add('active');
      } else if (serverNum === 3) {
        iframe.src = `https://vidsrc.sbs/embed/movie/${currentMovie.tmdbId}`;
        s3Btn.classList.add('active');
      } else if (serverNum === 4) {
        iframe.src = `https://vidnest.fun/movie/${currentMovie.tmdbId}`;
        s4Btn.classList.add('active');
      }
    }

    if (currentMovie.manualEmbed && currentMovie.manualEmbed.trim() !== '') {
      s1Btn.style.display = 'flex';
      switchServer(1);
    } else {
      s1Btn.style.display = 'none';
      switchServer(2);
    }

    const grid = document.getElementById('random-grid');
    const otherMovies = movies.filter(m => m.id !== currentMovie.id);
    const shuffled = [...otherMovies].sort(() => 0.5 - Math.random());

    shuffled.slice(0, 8).forEach(movie => {
      const card = document.createElement('div');
      card.className = 'recommendation-card';
      card.onclick = () => window.location.href = `player.html?id=${encodeURIComponent(movie.id)}`;
      card.innerHTML = `
        <img src="${movie.poster}" alt="${movie.title}">
        <div class="rec-info">
          <span class="rec-title">${movie.title}</span>
          <span class="rec-genre">Movie • HD</span>
        </div>
      `;
      grid.appendChild(card);
    });
  </script>
</body>
</html>
