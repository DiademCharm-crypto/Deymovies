<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>DEYMFLIX - Player</title>

  <!-- Favicon Link -->
  <link rel="icon" type="image/svg+xml" href="favicon.svg">

  <!-- Anti-Cache Headers -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">

  <link rel="stylesheet" href="style.css?v=153.0">

  <style>
    /* RESET & BASE BODY FOR PLAYER PAGE ONLY */
    body {
      padding-top: 0 !important;
      background-color: #0f0f0f !important;
      margin: 0 !important;
      color: #ffffff !important;
      width: 100% !important;
      overflow-x: hidden !important;
      -webkit-user-select: none !important;
      user-select: none !important;
    }

    /* VIDEO PLAYER CONTAINER LAYOUT FIXES */
    .video-container {
      position: relative !important;
      width: 100% !important;
      max-width: 100% !important;
      aspect-ratio: 16 / 9 !important;
      background: #000000 !important;
      margin: 0 auto !important;
      overflow: hidden !important;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.9) !important;
      -webkit-user-select: none !important;
      user-select: none !important;
      -webkit-touch-callout: none !important;
    }

    /* HEIGHT FALLBACK FOR BROWSERS WITHOUT aspect-ratio SUPPORT */
    /* If aspect-ratio is unsupported the container collapses to 0px tall and
       embedded YouTube frames end up audio-only with invisible video. */
    @supports not (aspect-ratio: 16 / 9) {
      .video-container {
        height: min(56.25vw, 90vh) !important;
        aspect-ratio: auto !important;
      }
    }

    /* FULLSCREEN NATIVE OVERRIDES */
    .video-container:fullscreen,
    .video-container:-webkit-full-screen,
    .video-container:-moz-full-screen,
    .video-container.fullscreen-active {
      width: 100vw !important;
      height: 100vh !important;
      max-width: 100vw !important;
      max-height: 100vh !important;
      aspect-ratio: auto !important;
      margin: 0 !important;
      padding: 0 !important;
      border-radius: 0 !important;
      background-color: #000000 !important;
    }

    #direct-video-player,
    #main-iframe {
      position: absolute !important;
      top: 0 !important;
      left: 0 !important;
      width: 100% !important;
      height: 100% !important;
      object-fit: contain !important;
      border: none !important;
      display: block !important;
    }

    /* TRAILER START OVERLAY TO BYPASS AUTOPLAY BLOCKS */
    .trailer-start-card {
      position: absolute;
      inset: 0;
      z-index: 50;
      background-size: cover;
      background-position: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .trailer-start-card::before {
      content: '';
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.65);
    }

    .trailer-play-btn {
      position: relative;
      z-index: 2;
      width: 70px;
      height: 70px;
      background: #e50914;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 25px rgba(229, 9, 20, 0.8);
      transition: transform 0.2s ease;
    }

    .trailer-start-card:hover .trailer-play-btn {
      transform: scale(1.1);
    }

    .trailer-play-btn svg {
      width: 32px;
      height: 32px;
      fill: #ffffff;
      margin-left: 4px;
    }

    .trailer-play-label {
      position: relative;
      z-index: 2;
      margin-top: 14px;
      font-size: 1.1rem;
      font-weight: 700;
      color: #ffffff;
      text-shadow: 0 2px 6px rgba(0,0,0,0.9);
    }

    /* FLOATING BACK BUTTON FOR TRAILER MODE */
    /* Trailer mode hides the player overlay (which normally holds the back
       button), so this dedicated button stays on top of the start card
       and the YouTube iframe. */
    .trailer-back-btn {
      position: absolute !important;
      top: max(12px, env(safe-area-inset-top)) !important;
      left: 14px !important;
      z-index: 60 !important;
      width: 40px !important;
      height: 40px !important;
      border-radius: 50% !important;
      background: rgba(0, 0, 0, 0.55) !important;
      border: 1px solid rgba(255, 255, 255, 0.2) !important;
      color: #ffffff !important;
      display: flex !important;
      align-items: center !important;
      justify-content: center !important;
      font-size: 1.2rem !important;
      font-weight: 800 !important;
      cursor: pointer !important;
      -webkit-user-select: none !important;
      user-select: none !important;
      -webkit-tap-highlight-color: transparent !important;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.5) !important;
    }

    /* FULL-SCREEN CLICK ABSORBER OVERLAY */
    .ultimate-ad-shield {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 10;
      background: rgba(0, 0, 0, 0.001);
      cursor: pointer;
    }

    /* ANIMATED LOADING BUFFER SPINNER */
    .loading-spinner-overlay {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 28;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      pointer-events: none;
    }

    .spinner-ring {
      width: 54px;
      height: 54px;
      border: 4px solid rgba(255, 255, 255, 0.2);
      border-top: 4px solid #e50914;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    .spinner-text {
      color: #fff;
      font-size: 0.85rem;
      margin-top: 10px;
      font-weight: 600;
      letter-spacing: 0.5px;
      text-shadow: 0 2px 4px rgba(0,0,0,0.8);
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    /* VERTICAL SLIDER BARS FOR BRIGHTNESS/VOLUME */
    .vertical-slider-bar {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      width: 36px;
      height: 120px;
      background: rgba(0, 0, 0, 0.75);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 20px;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 10px 0;
      z-index: 35;
      pointer-events: none;
    }
    .vertical-slider-bar.left-bar { left: 20px; }
    .vertical-slider-bar.right-bar { right: 20px; }
    .v-track {
      width: 4px;
      height: 75px;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 2px;
      position: relative;
      overflow: hidden;
    }
    .v-fill {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      background: #e50914;
      height: 50%;
    }

    /* PLAYER OVERLAY CONTROLS */
    .player-overlay {
      position: absolute !important;
      inset: 0 !important;
      width: 100% !important;
      height: 100% !important;
      background: linear-gradient(180deg, rgba(0,0,0,0.6) 0%, transparent 25%, transparent 75%, rgba(0,0,0,0.8) 100%) !important;
      display: flex !important;
      flex-direction: column !important;
      justify-content: space-between !important;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
      z-index: 20 !important;
      box-sizing: border-box !important;
      -webkit-user-select: none !important;
      user-select: none !important;
    }

    .player-overlay.active {
      opacity: 1 !important;
      pointer-events: auto !important;
    }

    /* TOP-LEFT BACK HEADER (< Title) */
    /* Only the back button + title area is clickable; without this the bar
       stretches across the full player width and clicking the top middle or
       top right also navigates back. */
    .player-top-bar {
      display: flex !important;
      align-items: center !important;
      gap: 8px !important;
      padding: 16px 20px !important;
      color: #ffffff !important;
      align-self: flex-start !important;
      width: fit-content !important;
      max-width: 100% !important;
      box-sizing: border-box !important;
      z-index: 30 !important;
      cursor: pointer !important;
      -webkit-user-select: none !important;
      user-select: none !important;
    }

    .icon-btn-back {
      background: transparent !important;
      border: none !important;
      color: #ffffff !important;
      font-size: 1.1rem !important;
      font-weight: 700 !important;
      cursor: pointer !important;
      padding: 0 !important;
      display: inline-block !important;
    }

    .overlay-title-text {
      font-weight: 700 !important;
      font-size: 1rem !important;
      color: #ffffff !important;
      cursor: pointer !important;
      text-shadow: 0 2px 4px rgba(0, 0, 0, 0.8) !important;
      -webkit-user-select: none !important;
      user-select: none !important;
    }

    /* CENTER CONTROL ICONS */
    .center-controls-group {
      position: absolute !important;
      top: 50% !important;
      left: 50% !important;
      transform: translate(-50%, -50%) !important;
      display: flex !important;
      align-items: center !important;
      gap: 22px !important;
      z-index: 25 !important;
    }

    .center-ctrl-btn {
      background: transparent !important;
      border: none !important;
      color: #ffffff !important;
      width: 36px !important;
      height: 36px !important;
      display: flex !important;
      align-items: center !important;
      justify-content: center !important;
      cursor: pointer !important;
      padding: 0 !important;
    }

    .center-ctrl-btn.play-btn-large {
      width: 44px !important;
      height: 44px !important;
      background: #e50914 !important;
      border-radius: 50% !important;
      box-shadow: 0 4px 15px rgba(229, 9, 20, 0.5) !important;
    }

    /* SPEED UP FLOATING BADGE */
    .loklok-speed-badge {
      position: absolute;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.75);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #ffffff;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 700;
      display: none;
      z-index: 40;
      letter-spacing: 0.5px;
      -webkit-user-select: none;
      user-select: none;
    }
    .loklok-speed-badge.show {
      display: block;
    }

    /* SEEK BADGES */
    .loklok-seek-badge {
      position: absolute !important;
      top: 50% !important;
      transform: translateY(-50%) !important;
      background: rgba(0, 0, 0, 0.8) !important;
      color: #ffffff !important;
      padding: 8px 16px !important;
      border-radius: 20px !important;
      font-size: 0.85rem !important;
      font-weight: bold !important;
      display: none !important;
      opacity: 0 !important;
      transition: opacity 0.2s ease !important;
      pointer-events: none !important;
      z-index: 30 !important;
      border: 1px solid rgba(255, 255, 255, 0.15) !important;
    }

    #rewind-badge { left: 15% !important; }
    #forward-badge { right: 15% !important; }

    .loklok-seek-badge.show {
      display: flex !important;
      align-items: center !important;
      gap: 6px !important;
      opacity: 1 !important;
    }

    .player-bottom-bar {
      padding: 10px 14px !important;
      display: flex !important;
      flex-direction: column !important;
      gap: 4px !important;
      width: 100% !important;
      box-sizing: border-box !important;
    }

    .progress-bar-wrapper {
      width: 100% !important;
    }

    .progress-bar-wrapper input[type="range"] {
      width: 100% !important;
      height: 4px !important;
      accent-color: #e50914 !important;
      cursor: pointer !important;
    }

    .bottom-bar-controls {
      display: flex !important;
      align-items: center !important;
      justify-content: space-between !important;
      color: #ffffff !important;
      width: 100% !important;
    }

    .left-controls-group {
      display: flex !important;
      align-items: center !important;
      gap: 6px !important;
    }

    .btn-bottom-play {
      background: transparent !important;
      border: none !important;
      color: #ffffff !important;
      cursor: pointer !important;
      display: flex !important;
      align-items: center !important;
      justify-content: center !important;
      padding: 0 !important;
      width: 22px !important;
      height: 22px !important;
    }

    .right-utility-btns {
      display: flex !important;
      align-items: center !important;
      gap: 10px !important;
    }

    .ctrl-btn-small {
      background: transparent !important;
      border: none !important;
      color: #ffffff !important;
      cursor: pointer !important;
      padding: 0 !important;
      display: flex !important;
      align-items: center !important;
      justify-content: center !important;
    }

    /* Unified sizing for single-path buttons */
    .ctrl-btn-small svg,
    .btn-bottom-play svg,
    .center-ctrl-btn svg {
      width: 18px !important;
      height: 18px !important;
      display: block !important;
    }

    /* SETTINGS (QUALITY + CAPTIONS) BUTTON & PANEL */
    .subtitle-active-badge {
      color: #e50914 !important;
    }

    .settings-btn {
      flex-direction: column !important;
      gap: 2px !important;
    }
    .settings-btn svg {
      width: 16px !important;
      height: 16px !important;
    }
    .settings-btn-label {
      font-size: 0.5rem !important;
      font-weight: 800 !important;
      line-height: 1 !important;
      letter-spacing: 0.3px !important;
    }

    .settings-panel {
      position: absolute !important;
      right: 14px !important;
      bottom: 66px !important;
      width: 270px !important;
      max-height: calc(100% - 110px) !important;
      background: rgba(18, 18, 18, 0.97) !important;
      border: 1px solid rgba(255, 255, 255, 0.15) !important;
      border-radius: 10px !important;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6) !important;
      z-index: 46 !important;
      padding: 12px !important;
      box-sizing: border-box !important;
      display: none;
      flex-direction: column !important;
      gap: 10px !important;
      color: #ffffff !important;
      font-size: 0.85rem !important;
      overflow-y: auto !important;
    }
    .settings-panel.open {
      display: flex !important;
    }
    .settings-panel-header {
      display: flex !important;
      justify-content: space-between !important;
      align-items: center !important;
      font-weight: 800 !important;
      font-size: 0.9rem !important;
    }
    .settings-panel-close {
      background: transparent !important;
      border: none !important;
      color: #aaaaaa !important;
      font-size: 1.3rem !important;
      cursor: pointer !important;
      line-height: 1 !important;
      padding: 0 2px !important;
    }
    .settings-section {
      display: flex !important;
      flex-direction: column !important;
      gap: 8px !important;
    }
    .settings-section-title {
      font-size: 0.72rem !important;
      font-weight: 800 !important;
      letter-spacing: 0.8px !important;
      text-transform: uppercase !important;
      color: #e50914 !important;
      border-bottom: 1px solid rgba(255, 255, 255, 0.12) !important;
      padding-bottom: 4px !important;
    }
    .settings-panel select {
      width: 100% !important;
      background: #1f1f1f !important;
      color: #ffffff !important;
      border: 1px solid #333333 !important;
      border-radius: 6px !important;
      padding: 6px 8px !important;
      font-size: 0.82rem !important;
    }

    .subtitle-search-btn {
      background: #e50914 !important;
      color: #ffffff !important;
      border: none !important;
      border-radius: 6px !important;
      padding: 8px !important;
      font-weight: 800 !important;
      cursor: pointer !important;
      font-size: 0.82rem !important;
    }

    .subtitle-results {
      overflow-y: auto !important;
      max-height: 170px !important;
      display: flex !important;
      flex-direction: column !important;
      gap: 6px !important;
    }

    .subtitle-result-item {
      background: rgba(255, 255, 255, 0.05) !important;
      border: 1px solid rgba(255, 255, 255, 0.12) !important;
      border-radius: 6px !important;
      padding: 6px 8px !important;
      cursor: pointer !important;
      font-size: 0.75rem !important;
      line-height: 1.3 !important;
      word-break: break-word !important;
    }

    .subtitle-result-item:hover {
      border-color: #e50914 !important;
    }

    .subtitle-status {
      font-size: 0.75rem !important;
      color: #cccccc !important;
      min-height: 1em !important;
      line-height: 1.3 !important;
    }

    .subtitle-off-btn {
      background: transparent !important;
      border: 1px solid rgba(255, 255, 255, 0.25) !important;
      color: #ffffff !important;
      border-radius: 6px !important;
      padding: 7px !important;
      cursor: pointer !important;
      font-size: 0.8rem !important;
      font-weight: 700 !important;
      display: none;
    }

    .subtitle-off-btn.show {
      display: block !important;
    }

    .quality-options {
      display: flex !important;
      flex-direction: column !important;
      gap: 6px !important;
    }
    .quality-option {
      background: rgba(255, 255, 255, 0.05) !important;
      border: 1px solid rgba(255, 255, 255, 0.12) !important;
      border-radius: 6px !important;
      padding: 8px 10px !important;
      cursor: pointer !important;
      display: flex !important;
      align-items: center !important;
      justify-content: space-between !important;
      gap: 8px !important;
    }
    .quality-option.active {
      border-color: #e50914 !important;
      background: rgba(229, 9, 20, 0.15) !important;
    }
    .quality-option-info {
      display: flex !important;
      flex-direction: column !important;
      gap: 1px !important;
      text-align: left !important;
    }
    .quality-option-label {
      font-weight: 800 !important;
      font-size: 0.82rem !important;
    }
    .quality-option-hint {
      font-size: 0.68rem !important;
      color: #aaaaaa !important;
    }
    .quality-option-check {
      color: #e50914 !important;
      font-weight: 900 !important;
      font-size: 1rem !important;
    }

    .center-ctrl-btn.play-btn-large svg {
      width: 20px !important;
      height: 20px !important;
    }

    /* WARNING NOTE AND DETAILS BOX */
    .network-warning-note {
      width: calc(100% - 40px) !important;
      margin: 14px auto 0 auto !important;
      padding: 10px 16px !important;
      background: rgba(229, 9, 20, 0.12) !important;
      border: 1px solid rgba(229, 9, 20, 0.4) !important;
      border-radius: 8px !important;
      color: #ffffff !important;
      font-size: 0.82rem !important;
      font-weight: 600 !important;
      box-sizing: border-box !important;
    }

    /* SYNOPSIS & DESCRIPTION BOX */
    .video-info-box {
      width: 100% !important;
      padding: 16px 20px 0 20px !important;
      box-sizing: border-box !important;
    }

    .media-title {
      font-size: 1.35rem !important;
      font-weight: 800 !important;
      margin-bottom: 6px !important;
      color: #ffffff !important;
    }

    /* TITLE ROW WITH AUTO-DETECTED GENRE CHIPS */
    .title-row {
      display: flex !important;
      align-items: center !important;
      gap: 10px !important;
      flex-wrap: wrap !important;
    }

    .genre-badge {
      display: none;
      align-items: center !important;
      gap: 6px !important;
      flex-wrap: wrap !important;
      margin-bottom: 6px !important;
    }

    .genre-chip {
      font-size: 0.62rem !important;
      font-weight: 800 !important;
      letter-spacing: 0.6px !important;
      text-transform: uppercase !important;
      color: #e50914 !important;
      border: 1px solid rgba(229, 9, 20, 0.5) !important;
      background: rgba(229, 9, 20, 0.1) !important;
      padding: 2px 9px !important;
      border-radius: 20px !important;
      white-space: nowrap !important;
    }

    .synopsis-text {
      font-size: 0.88rem !important;
      color: #cccccc !important;
      line-height: 1.5 !important;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
      transition: all 0.3s ease;
      margin-bottom: 6px !important;
    }

    .synopsis-text.expanded {
      display: block !important;
      overflow: visible !important;
    }

    .read-more-btn {
      background: transparent !important;
      border: none !important;
      color: #e50914 !important;
      font-size: 0.82rem !important;
      font-weight: 700 !important;
      cursor: pointer !important;
      padding: 0 !important;
      margin-bottom: 10px !important;
      display: inline-block !important;
    }

    /* RECOMMENDATION CARD LAYOUT */
    .list-recommendations {
      width: 100% !important;
      box-sizing: border-box !important;
    }

    .recommendation-card {
      background: #181818 !important;
      border: 1px solid #262626 !important;
      border-radius: 8px !important;
      overflow: hidden !important;
      cursor: pointer !important;
      transition: transform 0.2s ease, border-color 0.2s ease !important;
    }

    .recommendation-card:hover {
      transform: translateY(-4px) !important;
      border-color: #e50914 !important;
    }

    .recommendation-card img {
      width: 100% !important;
      object-fit: cover !important;
      display: block !important;
    }

    .rec-info {
      padding: 8px !important;
      display: flex !important;
      flex-direction: column !important;
      gap: 2px !important;
    }

    .rec-title {
      font-size: 0.78rem !important;
      font-weight: 700 !important;
      color: #ffffff !important;
      white-space: nowrap !important;
      overflow: hidden !important;
      text-overflow: ellipsis !important;
    }

    .rec-genre {
      font-size: 0.68rem !important;
      color: #aaaaaa !important;
    }

    /* PC MODE ENLARGED CONTROLS OVERRIDES (min-width: 769px) */
    @media (min-width: 769px) {
      .player-top-bar {
        padding: 24px 30px !important;
        gap: 14px !important;
      }

      .icon-btn-back {
        font-size: 1.8rem !important;
      }

      .overlay-title-text {
        font-size: 1.4rem !important;
        font-weight: 800 !important;
      }

      .center-controls-group {
        gap: 40px !important;
      }

      .center-ctrl-btn {
        width: 48px !important;
        height: 48px !important;
      }

      .center-ctrl-btn.play-btn-large {
        width: 64px !important;
        height: 64px !important;
      }

      .center-ctrl-btn.play-btn-large svg {
        width: 28px !important;
        height: 28px !important;
      }

      .player-bottom-bar {
        padding: 20px 30px !important;
        gap: 12px !important;
      }

      .progress-bar-wrapper input[type="range"] {
        height: 7px !important;
      }

      .btn-bottom-play {
        width: 34px !important;
        height: 34px !important;
      }

      .btn-bottom-play svg,

  <script>
    function destroyAllPlayers() {
      window.onbeforeunload = null;
      const dp = document.getElementById('direct-video-player');
      if (dp) {
        dp.pause();
        dp.removeAttribute('src');
        dp.load();
      }
      const fr = document.getElementById('main-iframe');
      if (fr) {
        fr.src = "about:blank";
        fr.remove();
      }
      const trailerBackBtn = document.getElementById('trailer-back-btn');
      if (trailerBackBtn) {
        trailerBackBtn.remove();
      }
    }

    window.addEventListener('pagehide', destroyAllPlayers);
    window.addEventListener('pageshow', function(event) {
      if (event.persisted) {
        window.location.replace('index.html');
      }
    });

    function forceBackToHome() {
      const isFS = !!(document.fullscreenElement || document.webkitFullscreenElement || document.mozFullScreenElement || document.msFullscreenElement);
      if (isFS) {
        exitFullscreen();
      }
      destroyAllPlayers();
      window.location.replace('index.html');
    }

    function exitFullscreen() {
      if (document.exitFullscreen) {
        document.exitFullscreen();
      } else if (document.webkitExitFullscreen) {
        document.webkitExitFullscreen();
      } else if (document.mozCancelFullScreen) {
        document.mozCancelFullScreen();
      } else if (document.msExitFullscreen) {
        document.msExitFullscreen();
      }
    }

    const urlParams = new URLSearchParams(window.location.search);
    const movieId = urlParams.get('id');
    const playerMode = urlParams.get('mode'); // Optional 'trailer' flag

    // ── OPENSUBTITLES.COM CONFIG (auto subtitles) ──────────────
    // Free API key: https://www.opensubtitles.com/ → Apps & API.
    // Paste your key below; online search stays disabled until set.
    const OPENSUBTITLES_API_KEY = '';
    let subtitleActive = false;

    const safeMoviesList = (typeof movies !== 'undefined' && Array.isArray(movies)) ? movies : [];
    const safeFeaturedList = (typeof featuredMovies !== 'undefined' && Array.isArray(featuredMovies)) ? featuredMovies : [];

    const currentMovie = safeMoviesList.find(m => m.id === movieId) || 
                         safeFeaturedList.find(m => m.id === movieId) || 
                         safeMoviesList[0] || 
                         { 
                           id: movieId || 'fallback', 
                           title: 'The Runner', 
                           tmdbId: 634649, 
                           description: '', 
                           poster: 'https://via.placeholder.com/300x450?text=DEYMFLIX',
                           manualEmbed: '',
                           trailerEmbed: ''
                         };

    document.getElementById('current-title').textContent = currentMovie.title;
    document.getElementById('overlay-movie-title').textContent = currentMovie.title;

    const descElement = document.getElementById('current-description');
    const readMoreBtn = document.getElementById('toggle-synopsis-btn');
    const networkNote = document.getElementById('network-note');
    const adShield = document.getElementById('iframe-ad-shield');
    const loadingSpinner = document.getElementById('video-loading-spinner');
    const centerControlsGroup = document.getElementById('center-controls');

    let absorbedClicks = 0;
    const clickLimit = 3;

    function absorbAdClicks(e) {
      e.stopPropagation();
      e.preventDefault();
      absorbedClicks++;
      
      if (absorbedClicks >= clickLimit) {
        adShield.style.display = 'none';
      }
    }

    function checkSynopsisLength() {
      setTimeout(() => {
        if (descElement.scrollHeight > descElement.clientHeight || descElement.textContent.length > 150) {
          readMoreBtn.style.display = 'inline-block';
        } else {
          readMoreBtn.style.display = 'none';
        }
      }, 50);
    }

    function toggleSynopsis() {
      if (descElement.classList.contains('expanded')) {
        descElement.classList.remove('expanded');
        readMoreBtn.textContent = 'Read More';
      } else {
        descElement.classList.add('expanded');
        readMoreBtn.textContent = 'Show Less';
      }
    }

    // ── SYNOPSIS / DESCRIPTION LOADER ─────────────────────────────
    // Source order (first hit wins):
    //   1. Hardcoded movie.description / movie.synopsis (most accurate when present)
    //   2. TMDB overview (works once TMDB_API_KEY below is a valid key)
    //   3. Wikipedia plot summary (free, no key) with year + film guards for accuracy
    // Results are cached in localStorage so revisits are instant.
    const TMDB_API_KEY = '15d260044e350723365198253b23914f';

    function fetchWithTimeout(url, ms) {
      const ctrl = new AbortController();
      const timer = setTimeout(() => ctrl.abort(), ms);
      return fetch(url, { signal: ctrl.signal }).finally(() => clearTimeout(timer));
    }

    // Release year is usually embedded in the stream URL (e.g. "The.Runner.2026.1080p...").
    // Decode first: "%202026" in an encoded URL would otherwise read as "2020".
    function getMovieYear(movie) {
      let hay = ((movie.manualEmbed || '') + ' ' + (movie.trailerEmbed || ''));
      try { hay = decodeURIComponent(hay); } catch (e) {}
      const m = hay.match(/(19|20)\d{2}/);
      return m ? m[0] : '';
    }

    function synopsisCacheGet(movieId) {
      try {
        const cache = JSON.parse(localStorage.getItem('deymflix_synopsis_cache') || '{}');
        if (cache[movieId] && cache[movieId].text) return cache[movieId].text;
      } catch (e) {}
      return '';
    }

    function synopsisCacheSet(movieId, text) {
      try {
        const cache = JSON.parse(localStorage.getItem('deymflix_synopsis_cache') || '{}');
        cache[movieId] = { text: text, ts: Date.now() };
        localStorage.setItem('deymflix_synopsis_cache', JSON.stringify(cache));
      } catch (e) {}
    }

    async function fetchWikipediaSummary(title) {
      try {
        const res = await fetchWithTimeout(
          'https://en.wikipedia.org/api/rest_v1/page/summary/' + encodeURIComponent(title) + '?origin=*',
          5000
        );
        if (!res.ok) return null;
        const data = await res.json();
        if (!data || data.type !== 'standard' || !data.extract) return null;
        return data;
      } catch (e) {
        return null;
      }
    }

    // Guards against grabbing the wrong page (an older film, the poem "The
    // Odyssey", a TV series, etc.): the page must clearly be about a film and,
    // when the release year is known, the page or its text must mention it.
    function wikipediaExtractPasses(summary, year, titleHasYear) {
      const hay = (summary.description || '') + ' ' + summary.extract;
      if (!/film|movie/i.test(hay)) return false;
      if (year && !titleHasYear && summary.extract.indexOf(year) === -1) return false;
      return true;
    }

    // Search results must still look like OUR movie (e.g. "Almost Us" must not
    // match "Toxic (2026 film)"). Requires a meaningful word of the movie title
    // to appear in the candidate article's title.
    function wikipediaSearchMatches(resultTitle, movieTitle) {
      const stop = new Set(['the', 'a', 'an', 'and', 'of', 'in', 'on', 'to', 'for', 'with', 'vs', 'versus', 'live', 'action']);
      const tokens = movieTitle.toLowerCase().replace(/[^a-z0-9\s]/g, ' ').split(/\s+/)
        .filter(t => t.length >= 4 && !stop.has(t));
      if (tokens.length === 0) return true;
      const lowerResult = resultTitle.toLowerCase();
      return tokens.some(t => lowerResult.indexOf(t) !== -1);
    }

    // Keeps the last Wikipedia extract used for the synopsis so the genre
    // detector can reuse it instead of fetching the page twice.
    let lastWikipediaExtract = '';

    async function loadWikipediaSynopsis(movie) {
      const title = movie.title || '';
      if (!title) return '';
      const year = getMovieYear(movie);

      // 1) Direct article candidates, most specific first.
      const candidates = [];
      if (year) candidates.push(title + ' (' + year + ' film)');
      candidates.push(title + ' (film)');
      candidates.push(title);

      for (const cand of candidates) {
        const summary = await fetchWikipediaSummary(cand);
        if (summary && wikipediaExtractPasses(summary, year, cand.indexOf(year) !== -1)) {
          lastWikipediaExtract = summary.extract.trim();
          return lastWikipediaExtract;
        }
      }

      // 2) Search fallback for titles whose article name differs
      //    (e.g. "Moana: Live Action" -> "Moana (2026 film)").
      const q = (title + ' ' + (year || '') + ' film').trim();
      try {
        const res = await fetchWithTimeout(
          'https://en.wikipedia.org/w/api.php?action=query&list=search&srsearch=' + encodeURIComponent(q) +
          '&srlimit=3&format=json&origin=*',
          5000
        );
        if (res.ok) {
          const data = await res.json();
          const results = (data.query && data.query.search) || [];
          const tried = new Set(candidates);
          for (const r of results) {
            if (tried.has(r.title)) continue;
            tried.add(r.title);
            if (year && r.title.indexOf(year) === -1) continue;
            if (!wikipediaSearchMatches(r.title, title)) continue;
            const summary = await fetchWikipediaSummary(r.title);
            if (summary && wikipediaExtractPasses(summary, year, r.title.indexOf(year) !== -1)) {
              lastWikipediaExtract = summary.extract.trim();
              return lastWikipediaExtract;
            }
          }
        }
      } catch (e) {}

      return '';
    }

    async function loadBroadSynopsis() {
      if (currentMovie.description && currentMovie.description.trim() !== '') {
        descElement.textContent = currentMovie.description;
        checkSynopsisLength();
        return;
      }

      if (currentMovie.synopsis && currentMovie.synopsis.trim() !== '') {
        descElement.textContent = currentMovie.synopsis;
        checkSynopsisLength();
        return;
      }

      // Cached synopsis -> instant, no network.
      const cached = synopsisCacheGet(currentMovie.id);
      if (cached) {
        descElement.textContent = cached;
        checkSynopsisLength();
        return;
      }

      let synopsis = '';

      // TMDB overview (works once TMDB_API_KEY is a valid key).
      if (currentMovie.tmdbId && TMDB_API_KEY) {
        try {
          const tmdbRes = await fetchWithTimeout(
            'https://api.themoviedb.org/3/movie/' + currentMovie.tmdbId + '?api_key=' + TMDB_API_KEY + '&language=en-US',
            5000
          );
          if (tmdbRes.ok) {
            const tmdbData = await tmdbRes.json();
            if (tmdbData.overview && tmdbData.overview.trim() !== '') {
              synopsis = tmdbData.overview.trim();
            }
          }
        } catch (e) {}
      }

      if (!synopsis) {
        synopsis = await loadWikipediaSynopsis(currentMovie);
      }

      if (synopsis) {
        descElement.textContent = synopsis;
        synopsisCacheSet(currentMovie.id, synopsis);
        checkSynopsisLength();
        return;
      }

      const originTag = currentMovie.isFilipino ? "Filipino movie" : "feature movie";
      descElement.textContent = `Watch "${currentMovie.title}", a ${originTag} available in high quality streaming on DEYMFLIX.`;
      checkSynopsisLength();
    }

    // ── AUTO-DETECTED GENRE BADGE ────────────────────────────────
    // Genres are parsed out of the synopsis text ("a 2026 American action
    // thriller film" -> Action · Thriller). Works for hardcoded descriptions,
    // TMDB overviews and Wikipedia extracts alike; results are cached.
    const GENRE_PATTERNS = [
      ['Sci-Fi', /\bsci-?fi\b|\bscience fiction\b/i],
      ['Action', /\baction\b/i],
      ['Adventure', /\badventure\b/i],
      ['Comedy', /\bcomedy\b/i],
      ['Drama', /\bdrama\b/i],
      ['Fantasy', /\bfantasy\b/i],
      ['Horror', /\bhorror\b/i],
      ['Thriller', /\bthriller\b/i],
      ['Romance', /\bromance\b|\bromantic\b/i],
      ['Mystery', /\bmystery\b/i],
      ['Crime', /\bcrime\b/i],
      ['Animation', /\banimat(?:ed|ion)\b/i],
      ['Musical', /\bmusical\b/i],
      ['Western', /\bwestern\b/i],
      ['War', /\bwar (?:film|drama|epic|movie)\b/i],
      ['Biography', /\bbiograph(?:y|ical)\b/i],
      ['Documentary', /\bdocumentary\b/i],
      ['Family', /\bfamily (?:film|adventure|comedy|drama)\b/i],
      ['Superhero', /\bsuperhero\b/i]
    ];

    function detectGenres(text) {
      if (!text) return [];
      // "live-action" would otherwise match "Action".
      const cleaned = text.replace(/live[- ]action/gi, ' ');
      const found = [];
      for (const [label, re] of GENRE_PATTERNS) {
        const m = cleaned.match(re);
        if (m) found.push({ label: label, idx: m.index });
      }
      found.sort((a, b) => a.idx - b.idx);
      const labels = found.map(f => f.label);
      return [...new Set(labels)].slice(0, 3);
    }

    async function loadMovieGenre() {
      const badge = document.getElementById('genre-label');
      if (!badge) return;

      const setGenre = (genres) => {
        if (genres && genres.length > 0) {
          badge.innerHTML = '';
          genres.forEach((g) => {
            const chip = document.createElement('span');
            chip.className = 'genre-chip';
            chip.textContent = g;
            badge.appendChild(chip);
          });
          badge.style.display = 'flex';
        } else {
          badge.style.display = 'none';
        }
      };

      // 1) Cached result.
      try {
        const cache = JSON.parse(localStorage.getItem('deymflix_genre_cache') || '{}');
        if (cache[currentMovie.id]) {
          setGenre(cache[currentMovie.id]);
          return;
        }
      } catch (e) {}

      // 2) Hardcoded description / synopsis.
      let genres = detectGenres(currentMovie.description || currentMovie.synopsis || '');

      // 3) Wikipedia extract already fetched for the synopsis.
      if (genres.length === 0 && lastWikipediaExtract) {
        genres = detectGenres(lastWikipediaExtract);
      }

      // 4) Dedicated Wikipedia lookup (e.g. description without genre words).
      if (genres.length === 0) {
        const extract = await loadWikipediaSynopsis(currentMovie);
        if (extract) genres = detectGenres(extract);
      }

      if (genres.length > 0) {
        try {
          const cache = JSON.parse(localStorage.getItem('deymflix_genre_cache') || '{}');
          cache[currentMovie.id] = genres;
          localStorage.setItem('deymflix_genre_cache', JSON.stringify(cache));
        } catch (e) {}
      }
      setGenre(genres);
    }

    function toggleOverlayControls(e) {
      const now = Date.now();
      if (now - lastTapTime < 300) {
        e.preventDefault();
        return;
      }
      lastTapTime = now;

      if (e.target === playerOverlay || e.target === playerContainer) {
        if (playerOverlay.classList.contains('active')) {

    let touchStartY = 0;

    playerContainer.addEventListener('touchstart', (e) => {
      if (e.touches.length === 1) {
        touchStartY = e.touches[0].clientY;
        const screenWidth = window.innerWidth;
        const clientX = e.touches[0].clientX;
        gestureType = clientX < screenWidth / 2 ? 'brightness' : 'volume';
        isGestureDragging = false;

        isLongPressing = false;
        clearTimeout(longPressTimer);
        longPressTimer = setTimeout(() => {
          if (!isGestureDragging && directPlayer.style.display !== 'none') {
            isLongPressing = true;
            directPlayer.playbackRate = 2.0;
            speedBadge.classList.add('show');
          }
        }, 500);
      }
    }, { passive: true });

    playerContainer.addEventListener('touchmove', (e) => {
      if (e.touches.length !== 1) return;

      const currentY = e.touches[0].clientY;
      const deltaY = touchStartY - currentY;
      
      if (Math.abs(deltaY) > 6) {
        isGestureDragging = true;
        clearTimeout(longPressTimer);
        if (isLongPressing) {
          isLongPressing = false;
          directPlayer.playbackRate = normalPlaybackRate;
          speedBadge.classList.remove('show');
        }
      }

      if (!isGestureDragging) return;

      touchStartY = currentY;
      clearTimeout(sliderHideTimer);

      if (gestureType === 'brightness') {
        currentBrightness = Math.max(20, Math.min(150, currentBrightness + (deltaY * 0.5)));
        directPlayer.style.filter = `brightness(${currentBrightness}%)`;
        brightnessFill.style.height = `${((currentBrightness - 20) / 130) * 100}%`;
        brightnessContainer.style.display = 'flex';
      } else if (gestureType === 'volume') {
        let newVol = Math.max(0, Math.min(1, directPlayer.volume + (deltaY * 0.005)));
        directPlayer.volume = newVol;
        directPlayer.muted = newVol === 0;
        volumeFill.style.height = `${newVol * 100}%`;
        volumeContainer.style.display = 'flex';
      }
    }, { passive: true });

    function formatTime(seconds) {
      if (isNaN(seconds)) return "00:00:00";
      const hrs = Math.floor(seconds / 3600);
      const mins = Math.floor((seconds % 3600) / 60);
      const secs = Math.floor(seconds % 60);

      const hStr = hrs < 10 ? `0${hrs}` : hrs;
      const mStr = mins < 10 ? `0${mins}` : mins;
      const sStr = secs < 10 ? `0${secs}` : secs;

      return `${hStr}:${mStr}:${sStr}`;
    }

    function srtToVtt(srt) {
      return 'WEBVTT\n\n' + srt
        .replace(/\r/g, '')
        .replace(/^\d+:\d+:\d+,\d+\s+-->\s+\d+:\d+:\d+,\d+.*$/gm, (line) => line.replace(/,/g, '.'))
        .trim() + '\n';
    }

    function enableSubtitleTrack(vttText, label) {
      const existing = directPlayer.querySelector('track');
      if (existing) existing.remove();

      const blob = new Blob([vttText], { type: 'text/vtt' });
      const url = URL.createObjectURL(blob);
      const track = document.createElement('track');
      track.kind = 'subtitles';
      track.label = label || 'Subtitles';
      track.srclang = 'en';
      track.src = url;
      track.default = true;
      directPlayer.appendChild(track);

      const forceShow = () => {
        for (let i = 0; i < directPlayer.textTracks.length; i++) {
          directPlayer.textTracks[i].mode = 'showing';
        }
      };
      track.addEventListener('load', forceShow);
      setTimeout(forceShow, 500);

      subtitleActive = true;
      if (btnSubtitleOff) btnSubtitleOff.classList.add('show');
      const settingsBtn = document.getElementById('btn-settings');
      if (settingsBtn) settingsBtn.classList.add('subtitle-active-badge');
    }

    function turnOffSubtitles() {

      if (existing) existing.remove();

      if (settingsBtn) settingsBtn.classList.remove('subtitle-active-badge');
      showToast('Subtitles off');
    }

    async function searchOnlineSubtitles() {
      if (subtitleStatus) subtitleStatus.textContent = '';
      if (subtitleResults) subtitleResults.innerHTML = '';

      if (!OPENSUBTITLES_API_KEY) {
        if (subtitleStatus) {
          subtitleStatus.textContent = 'No API key set. Paste your opensubtitles.com key in OPENSUBTITLES_API_KEY (player.html).';
        }
        return;
      }

      const lang = document.getElementById('subtitle-language') ? document.getElementById('subtitle-language').value : 'en';
      const query = currentMovie.title;

      try {
        if (subtitleStatus) subtitleStatus.textContent = 'Searching "' + query + '" (' + lang + ')…';

        const loginRes = await fetch('https://api.opensubtitles.com/api/v1/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Api-Key': OPENSUBTITLES_API_KEY },
          body: JSON.stringify({ api_key: OPENSUBTITLES_API_KEY })
        });
        if (!loginRes.ok) throw new Error('OpenSubtitles login failed (' + loginRes.status + ')');
        const loginData = await loginRes.json();
        const token = loginData.token;

        const searchRes = await fetch('https://api.opensubtitles.com/api/v1/subtitles?query=' + encodeURIComponent(query) + '&languages=' + encodeURIComponent(lang) + '&type=movie&limit=15', {
          headers: { 'Api-Key': OPENSUBTITLES_API_KEY, 'Authorization': 'Bearer ' + token }
        });
        if (!searchRes.ok) throw new Error('OpenSubtitles search failed (' + searchRes.status + ')');
        const data = await searchRes.json();

        if (!data.data || data.data.length === 0) {
          if (subtitleStatus) subtitleStatus.textContent = 'No subtitles found for "' + query + '" in ' + lang + '.';
          return;
        }

        if (subtitleStatus) subtitleStatus.textContent = data.data.length + ' result(s) — tap one to load:';
        data.data.forEach((item) => {
          const attrs = item.attributes || {};
          const fileId = attrs.files && attrs.files.length > 0 ? attrs.files[0].file_id : null;
          const release = attrs.release_name || attrs.file_name || ('Subtitle #' + item.id);
          const div = document.createElement('div');
          div.className = 'subtitle-result-item';
          div.textContent = release + ' · ' + (attrs.language || lang);
          div.onclick = () => {
            if (!fileId) {
              if (subtitleStatus) subtitleStatus.textContent = 'No downloadable file for this result.';
              return;
            }
            downloadAndEnableSubtitle(fileId, attrs.language || lang);
          };
          if (subtitleResults) subtitleResults.appendChild(div);
        });
      } catch (err) {
        if (subtitleStatus) subtitleStatus.textContent = 'Search error: ' + err.message;
      }
    }

    async function downloadAndEnableSubtitle(fileId, label) {
      try {
        if (subtitleStatus) subtitleStatus.textContent = 'Downloading subtitle…';
        const dlRes = await fetch('https://api.opensubtitles.com/api/v1/download', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Api-Key': OPENSUBTITLES_API_KEY },
          body: JSON.stringify({ file_id: fileId })
        });
        if (!dlRes.ok) throw new Error('Download failed (' + dlRes.status + ')');
        const dlData = await dlRes.json();
        if (!dlData.link) throw new Error('No subtitle link returned');

        const srtRes = await fetch(dlData.link);
        if (!srtRes.ok) throw new Error('Subtitle fetch failed (' + srtRes.status + ')');
        const srtText = await srtRes.text();

        enableSubtitleTrack(srtToVtt(srtText), label);
        if (subtitleStatus) subtitleStatus.textContent = 'Subtitles enabled (' + label + ').';
        showToast('Subtitles on: ' + label);
      } catch (err) {
        if (subtitleStatus) subtitleStatus.textContent = 'Error: ' + err.message;
      }
    }

      };
    }

    // ── VIDEO QUALITY (HD/SD) CONTROL ────────────────────────────
    // The quality button appears automatically for a movie once it has more
    // than one source. Add optional fields to a movie in app.js to enable it:
    //   manualEmbed:  ".../Movie.2026.1080p....mp4"  (default / best source)
    //   manualEmbedHd: ".../Movie.2026.720p....mp4"  (optional, uses less data)
    //   manualEmbedSd: ".../Movie.2026.480p....mp4"  (optional, best for slow internet)
    let qualityOptions = [];
    let activeQualityIndex = 0;
    let previousQualityIndex = 0;
    let isQualitySwitch = false;

    function buildQualityOptions() {
      const opts = [];
      const seen = new Set();
      const push = (label, url, hint) => {
        if (!url || typeof url !== 'string' || url.trim() === '') return;
        if (seen.has(url)) return;
        seen.add(url);
        opts.push({ label: label, url: url, hint: hint });
      };
      push('Auto', currentMovie.manualEmbed, 'Best available quality');
      push('1080p', currentMovie.manualEmbed, 'Full HD');
      push('720p', currentMovie.manualEmbedHd, 'Uses less data');
      push('480p', currentMovie.manualEmbedSd, 'Best for slow internet');
      return opts;
    }

    function renderQualityMenu() {
      const container = document.getElementById('quality-options');
      if (!container) return;
      container.innerHTML = '';
      qualityOptions.forEach((opt, i) => {
        const row = document.createElement('div');
        row.className = 'quality-option' + (i === activeQualityIndex ? ' active' : '');

        const info = document.createElement('div');
        info.className = 'quality-option-info';
        const label = document.createElement('span');
        label.className = 'quality-option-label';
        label.textContent = opt.label;
        const hint = document.createElement('span');
        hint.className = 'quality-option-hint';
        hint.textContent = opt.hint || '';
        info.appendChild(label);
        info.appendChild(hint);

        const check = document.createElement('span');
        check.className = 'quality-option-check';
        check.textContent = i === activeQualityIndex ? '✓' : '';

        row.appendChild(info);
        row.appendChild(check);
        row.onclick = (e) => {
          e.stopPropagation();
          switchQuality(i);
        };
        container.appendChild(row);
      });
    }

    function applyQualitySelection() {
      const opt = qualityOptions[activeQualityIndex];
      if (!opt) return;
      const labelEl = document.getElementById('quality-btn-label');
      const btn = document.getElementById('btn-settings');
      if (labelEl) labelEl.textContent = opt.label;
      if (btn) btn.title = 'Settings — Quality: ' + opt.label;
      localStorage.setItem('deymflix_quality_pref', opt.label);
    }

    function setupQualityControl() {
      qualityOptions = buildQualityOptions();

      // The settings button is always available (captions); only show the
      // quality section when the movie actually has more than one source.
      const qualitySection = document.getElementById('settings-quality-section');
      if (qualitySection) {
        qualitySection.style.display = qualityOptions.length >= 2 ? 'flex' : 'none';
      }
      if (qualityOptions.length < 2) return;

      // Restore the user's saved quality preference (e.g. "480p" for slow internet).
      const pref = localStorage.getItem('deymflix_quality_pref') || 'Auto';
      const prefIdx = qualityOptions.findIndex(o => o.label === pref);

      // Initial selection is the movie's default source (Auto).
      activeQualityIndex = 0;
      applyQualitySelection();
      renderQualityMenu();

      // If the saved preference is a lower quality, apply it right away.
      if (prefIdx > 0) {
        switchQuality(prefIdx);
      }
    }

    function switchQuality(index) {
      if (index === activeQualityIndex) {
        closeSettingsPanel();
        return;
      }
      const opt = qualityOptions[index];
      if (!opt) return;

      const resumeTime = directPlayer.currentTime || 0;
      const wasPlaying = !directPlayer.paused;
      previousQualityIndex = activeQualityIndex;
      activeQualityIndex = index;
      applyQualitySelection();
      renderQualityMenu();

      isQualitySwitch = true;
      showLoadingSpinner();

      const onMetadata = () => {
        directPlayer.removeEventListener('loadedmetadata', onMetadata);
        directPlayer.removeEventListener('error', onError);
        isQualitySwitch = false;
        try { directPlayer.currentTime = resumeTime; } catch (e) {}
        if (subtitleActive) {
          for (let i = 0; i < directPlayer.textTracks.length; i++) {
            directPlayer.textTracks[i].mode = 'showing';
          }
        }
        if (wasPlaying) {
          directPlayer.play().catch(() => {
            hideLoadingSpinner();
            updatePlayStateUI(false);
          });
        } else {
          hideLoadingSpinner();
          updatePlayStateUI(false);
        }
      };

      const onError = () => {
        directPlayer.removeEventListener('loadedmetadata', onMetadata);
        directPlayer.removeEventListener('error', onError);
        isQualitySwitch = false;
        activeQualityIndex = previousQualityIndex;
        applyQualitySelection();
        renderQualityMenu();

        // Restore the previously working source so playback keeps going.
        const prevOpt = qualityOptions[previousQualityIndex];
        if (prevOpt) {
          directPlayer.src = prevOpt.url;
          directPlayer.load();
          const restoreMeta = () => {
            directPlayer.removeEventListener('loadedmetadata', restoreMeta);
            try { directPlayer.currentTime = resumeTime; } catch (e) {}
            if (wasPlaying) {
              directPlayer.play().catch(() => {});
            }
          };
          directPlayer.addEventListener('loadedmetadata', restoreMeta);
        }
        hideLoadingSpinner();
        showToast('This quality failed to load.');
      };

      directPlayer.addEventListener('loadedmetadata', onMetadata);
      directPlayer.addEventListener('error', onError);

      directPlayer.src = opt.url;
      directPlayer.load();
      closeSettingsPanel();
      showToast('Switching to ' + opt.label + '…');
    }

    const btnSettings = document.getElementById('btn-settings');
    if (btnSettings) {
      btnSettings.onclick = (e) => {
        e.stopPropagation();
        toggleSettingsPanel();
      };
    }
    const btnSettingsClose = document.getElementById('btn-settings-close');
    if (btnSettingsClose) {
      btnSettingsClose.onclick = (e) => {
        e.stopPropagation();
        closeSettingsPanel();
      };
    }

    function toggleFullscreen() {
      const isFS = !!(document.fullscreenElement || document.webkitFullscreenElement || document.mozFullScreenElement || document.msFullscreenElement);

      if (!isFS) {
        const requestFS = playerContainer.requestFullscreen || 
                          playerContainer.webkitRequestFullscreen || 
                          playerContainer.mozRequestFullScreen || 
                          playerContainer.msRequestFullscreen;

        if (requestFS) {
          requestFS.call(playerContainer).then(() => {
            if (screen.orientation && screen.orientation.lock) {
              screen.orientation.lock('landscape').catch(err => {
                console.warn('Orientation lock not supported or allowed:', err);
              });
            }
          }).catch(err => {
            console.warn('Fullscreen request failed:', err);
          });
        } else if (directPlayer && directPlayer.webkitEnterFullscreen) {
          directPlayer.webkitEnterFullscreen();
        }
      } else {
        exitFullscreen();
      }
    }

    function triggerRewind() {
      directPlayer.currentTime = Math.max(0, directPlayer.currentTime - 10);
      showSeekBadge(rewindBadge);
    }

    function triggerForward() {
      directPlayer.currentTime = Math.min(directPlayer.duration || 0, directPlayer.currentTime + 10);
      showSeekBadge(forwardBadge);
    }

    function showSeekBadge(badge) {
      badge.classList.add('show');
      setTimeout(() => badge.classList.remove('show'), 600);
    }

    function ensureTrailerBackButton() {
      let backBtn = document.getElementById('trailer-back-btn');
      if (!backBtn) {
        backBtn = document.createElement('button');
        backBtn.id = 'trailer-back-btn';
        backBtn.className = 'trailer-back-btn';
        backBtn.innerHTML = '❮';
        backBtn.title = 'Back to Home';
        backBtn.onclick = (e) => {
          e.stopPropagation();
          forceBackToHome();
        };
        playerContainer.appendChild(backBtn);
      } else {
        backBtn.style.display = 'flex';
      }
    }

    function renderFreshIframe(targetUrl, isYouTube = false) {
      let existingIframe = document.getElementById('main-iframe');
      if (existingIframe) {
        existingIframe.remove();
      }

      absorbedClicks = 0;
      
      const newIframe = document.createElement('iframe');
      newIframe.id = 'main-iframe';
      newIframe.allowFullscreen = true;
      newIframe.setAttribute('width', '100%');
      newIframe.setAttribute('height', '100%');
      newIframe.allow = "autoplay; fullscreen *; picture-in-picture *; encrypted-media; accelerometer; gyroscope; clipboard-write";
      
      if (!isYouTube) {
        newIframe.setAttribute('sandbox', 'allow-scripts allow-same-origin allow-forms allow-presentation');
        showLoadingSpinner();
      } else {
        hideLoadingSpinner();
        // Correct referrer policy helps YouTube authorize the embed request
        newIframe.setAttribute('referrerpolicy', 'origin');
      }

      newIframe.style.position = 'absolute';
      newIframe.style.top = '0';
      newIframe.style.left = '0';
      newIframe.style.width = '100%';
      newIframe.style.height = '100%';
      newIframe.style.border = 'none';
      newIframe.style.display = 'block';

      newIframe.addEventListener('load', () => {
        hideLoadingSpinner();
      });

      // Append first, then assign the source: the frame gets real layout
      // dimensions (never 0x0) before YouTube initializes its player,
      // which avoids invisible / audio-only playback.
      playerContainer.appendChild(newIframe);
      iframe = newIframe;
      newIframe.src = targetUrl;
    }

    // Direct embed & trailer playback initialization
    function loadEmbed() {
      startSlowConnectionCheck();

      let rawUrl = '';
      if (playerMode === 'trailer' && currentMovie.trailerEmbed && currentMovie.trailerEmbed.trim() !== '') {
        rawUrl = currentMovie.trailerEmbed;
      } else if (currentMovie.manualEmbed && currentMovie.manualEmbed.trim() !== '') {
        rawUrl = currentMovie.manualEmbed;
      } else {
        rawUrl = currentMovie.trailerEmbed || '';
      }

      let targetUrl = (typeof cleanDriveLink === 'function') 
        ? cleanDriveLink(rawUrl) 
        : rawUrl;

      if (!targetUrl || targetUrl.trim() === '') {
        showToast("No stream or trailer available.");
        return;
      }

      const lowerUrl = targetUrl.toLowerCase();

      // Direct MP4 / MKV video stream -> Use Custom Player
      if (lowerUrl.includes('.mp4') || lowerUrl.includes('.mkv')) {
        adShield.style.display = 'none';
        const oldIframe = document.getElementById('main-iframe');
        if (oldIframe) oldIframe.remove();

        directPlayer.style.display = 'block';
        playerOverlay.style.display = 'flex';
        directPlayer.src = targetUrl;
        
        attemptAutoUnmute();
        showControls();
        const settingsBtn = document.getElementById('btn-settings');
        if (settingsBtn) settingsBtn.style.display = 'flex';
        setupQualityControl();
        return;
      }

      // --- TRAILER & YOUTUBE EMBED MODE ---
      let videoId = '';

      if (targetUrl.includes('youtube.com/watch?v=')) {
        videoId = targetUrl.split('v=')[1]?.split('&')[0];
      } else if (targetUrl.includes('youtu.be/')) {
        videoId = targetUrl.split('youtu.be/')[1]?.split('?')[0];
      } else if (targetUrl.includes('youtube.com/embed/')) {
        videoId = targetUrl.split('embed/')[1]?.split('?')[0];
      }

      const isYouTube = Boolean(videoId);

      if (isYouTube) {
        // Build embed URL: playsinline + origin help YouTube initialize the
        // visible video track reliably inside the frame (avoids audio-only playback)
        const ytOrigin = encodeURIComponent(window.location.origin || window.location.href);
        const finalEmbedUrl = `https://www.youtube.com/embed/${videoId}?autoplay=1&controls=1&enablejsapi=1&rel=0&modestbranding=1&playsinline=1&origin=${ytOrigin}`;

        directPlayer.pause();
        directPlayer.removeAttribute('src');
        directPlayer.load();
        directPlayer.style.display = 'none';

        playerOverlay.style.setProperty('display', 'none', 'important');
        adShield.style.setProperty('display', 'none', 'important');
        hideLoadingSpinner();

        // Trailer mode hides the player overlay (which holds the back button),
        // so add a dedicated floating back button for this mode
        ensureTrailerBackButton();

        const settingsTrailer = document.getElementById('btn-settings');
        if (settingsTrailer) settingsTrailer.style.display = 'none';

        // Check if user click card exists
        let startCard = document.getElementById('trailer-start-overlay');
        if (!startCard) {
          startCard = document.createElement('div');
          startCard.id = 'trailer-start-overlay';
          startCard.className = 'trailer-start-card';
          startCard.style.backgroundImage = `url(${currentMovie.poster})`;
          startCard.innerHTML = `
            <div class="trailer-play-btn">
              <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
            </div>
            <div class="trailer-play-label">Click to Play Trailer</div>
          `;

          startCard.onclick = () => {
            startCard.remove();
            showToast("Playing Trailer...");
            renderFreshIframe(finalEmbedUrl, true);
          };

          playerContainer.appendChild(startCard);
        }
        return;
      }

      // Default non-YouTube iframe fallback (manualEmbed)
      directPlayer.pause();
      directPlayer.removeAttribute('src');
      directPlayer.load();
      directPlayer.style.display = 'none';

      playerOverlay.style.setProperty('display', 'flex', 'important');
      adShield.style.setProperty('display', 'block', 'important');

      const settingsEmbed = document.getElementById('btn-settings');
      if (settingsEmbed) settingsEmbed.style.display = 'none';

      renderFreshIframe(targetUrl, false);
    }

    loadEmbed();

    const grid = document.getElementById('random-grid');
    const otherMovies = safeMoviesList.filter(m => m.id !== currentMovie.id);
    const shuffled = [...otherMovies].sort(() => 0.5 - Math.random());

    shuffled.slice(0, 10).forEach(movie => {
      const card = document.createElement('div');
      card.className = 'recommendation-card';
      card.onclick = () => window.location.href = `player.html?id=${encodeURIComponent(movie.id)}`;
      card.innerHTML = `
        <img src="${movie.poster}" alt="${movie.title}">
        <div class="rec-info">
          <span class="rec-title">${movie.title}</span>
          <span class="rec-genre">Movie • HD</span>
        </div>
      `;
      grid.appendChild(card);
    });

    function handleFullscreenChange() {
      const isFullscreen = !!(document.fullscreenElement || document.webkitFullscreenElement || document.mozFullScreenElement || document.msFullscreenElement);
      
      if (isFullscreen) {
        playerContainer.classList.add('fullscreen-active');
      } else {
        playerContainer.classList.remove('fullscreen-active');
        if (screen.orientation && screen.orientation.unlock) {
          try {
            screen.orientation.unlock();
          } catch (e) {}
        }
      }
    }

    document.addEventListener('fullscreenchange', handleFullscreenChange);
    document.addEventListener('webkitfullscreenchange', handleFullscreenChange);
    document.addEventListener('mozfullscreenchange', handleFullscreenChange);
    document.addEventListener('MSFullscreenChange', handleFullscreenChange);
  </script>
</body>
