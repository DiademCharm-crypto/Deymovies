<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>DEYMFLIX - Player</title>

  <!-- Favicon Link -->
  <link rel="icon" type="image/svg+xml" href="favicon.svg">

  <!-- Anti-Cache Headers -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">

  <link rel="stylesheet" href="style.css?v=150.0">

  <style>
    /* RESET & BASE BODY FOR PLAYER PAGE ONLY */
    body {
      padding-top: 0 !important;
      background-color: #0f0f0f !important;
      margin: 0 !important;
      color: #ffffff !important;
      width: 100% !important;
      overflow-x: hidden !important;
      -webkit-user-select: none !important;
      user-select: none !important;
    }

    /* VIDEO PLAYER CONTAINER LAYOUT FIXES */
    .video-container {
      position: relative !important;
      width: 100% !important;
      max-width: 100% !important;
      aspect-ratio: 16 / 9 !important;
      background: #000000 !important;
      margin: 0 auto !important;
      overflow: hidden !important;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.9) !important;
      -webkit-user-select: none !important;
      user-select: none !important;
      -webkit-touch-callout: none !important;
    }

    /* FULLSCREEN NATIVE OVERRIDES */
    .video-container:fullscreen,
    .video-container:-webkit-full-screen,
    .video-container:-moz-full-screen,
    .video-container.fullscreen-active {
      width: 100vw !important;
      height: 100vh !important;
      max-width: 100vw !important;
      max-height: 100vh !important;
      aspect-ratio: auto !important;
      margin: 0 !important;
      padding: 0 !important;
      border-radius: 0 !important;
      background-color: #000000 !important;
    }

    #direct-video-player,
    #trailer-iframe-player {
      width: 100% !important;
      height: 100% !important;
      object-fit: contain !important;
      border: none !important;
      display: block !important;
    }

    /* ANIMATED LOADING BUFFER SPINNER */
    .loading-spinner-overlay {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 28;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      pointer-events: none;
    }

    .spinner-ring {
      width: 54px;
      height: 54px;
      border: 4px solid rgba(255, 255, 255, 0.2);
      border-top: 4px solid #e50914;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    .spinner-text {
      color: #fff;
      font-size: 0.85rem;
      margin-top: 10px;
      font-weight: 600;
      letter-spacing: 0.5px;
      text-shadow: 0 2px 4px rgba(0,0,0,0.8);
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    /* VERTICAL SLIDER BARS FOR BRIGHTNESS/VOLUME */
    .vertical-slider-bar {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      width: 36px;
      height: 120px;
      background: rgba(0, 0, 0, 0.75);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 20px;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 10px 0;
      z-index: 35;
      pointer-events: none;
    }
    .vertical-slider-bar.left-bar { left: 20px; }
    .vertical-slider-bar.right-bar { right: 20px; }
    .v-track {
      width: 4px;
      height: 75px;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 2px;
      position: relative;
      overflow: hidden;
    }
    .v-fill {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      background: #e50914;
      height: 50%;
    }

    /* CUSTOM ON-SCREEN SUBTITLE CONTAINER OVERLAY */
    .custom-subtitle-display {
      position: absolute;
      bottom: 80px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 15;
      text-align: center;
      width: 90%;
      max-width: 800px;
      pointer-events: none;
    }

    .subtitle-line {
      display: inline-block;
      background: rgba(0, 0, 0, 0.82);
      color: #ffffff;
      font-size: 1.15rem;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 4px;
      line-height: 1.4;
      text-shadow: 0 1px 3px rgba(0,0,0,0.9);
      margin-top: 2px;
    }

    /* SUBTITLE SELECTION MENU MODAL */
    .subtitle-menu-modal {
      position: absolute;
      bottom: 65px;
      right: 20px;
      background: rgba(12, 12, 12, 0.95);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 8px;
      padding: 8px 0;
      z-index: 1000 !important;
      width: 180px;
      display: flex;
      flex-direction: column;
      box-shadow: 0 10px 30px rgba(0,0,0,0.9);
      backdrop-filter: blur(12px);
      pointer-events: auto !important;
    }

    .subtitle-menu-title {
      font-size: 0.75rem;
      font-weight: 800;
      color: #888;
      text-transform: uppercase;
      padding: 6px 16px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      margin-bottom: 4px;
      letter-spacing: 0.5px;
    }

    .subtitle-option {
      padding: 10px 16px;
      color: #ddd;
      font-size: 0.88rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: background 0.2s, color 0.2s;
    }

    .subtitle-option:hover {
      background: rgba(229, 9, 20, 0.25);
      color: #fff;
    }

    .subtitle-option.selected {
      color: #e50914;
      font-weight: 700;
    }

    .subtitle-option.disabled-option {
      color: #666;
      cursor: default;
    }

    .subtitle-option.disabled-option:hover {
      background: transparent;
      color: #666;
    }

    .subtitle-active-btn {
      color: #e50914 !important;
      border-bottom: 2px solid #e50914;
    }

    /* PLAYER OVERLAY CONTROLS */
    .player-overlay {
      position: absolute !important;
      inset: 0 !important;
      width: 100% !important;
      height: 100% !important;
      background: linear-gradient(180deg, rgba(0,0,0,0.6) 0%, transparent 25%, transparent 75%, rgba(0,0,0,0.8) 100%) !important;
      display: flex !important;
      flex-direction: column !important;
      justify-content: space-between !important;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
      z-index: 20 !important;
      box-sizing: border-box !important;
      -webkit-user-select: none !important;
      user-select: none !important;
    }

    .player-overlay.active {
      opacity: 1 !important;
      pointer-events: auto !important;
    }

    /* TOP-LEFT BACK HEADER (< Title) */
    .player-top-bar {
      display: flex !important;
      align-items: center !important;
      gap: 8px !important;
      padding: 16px 20px !important;
      color: #ffffff !important;
      width: auto !important;
      box-sizing: border-box !important;
      z-index: 30 !important;
      cursor: pointer !important;
      -webkit-user-select: none !important;
      user-select: none !important;
    }

    .icon-btn-back {
      background: transparent !important;
      border: none !important;
      color: #ffffff !important;
      font-size: 1.1rem !important;
      font-weight: 700 !important;
      cursor: pointer !important;
      padding: 0 !important;
      display: inline-block !important;
    }

    .overlay-title-text {
      font-weight: 700 !important;
      font-size: 1rem !important;
      color: #ffffff !important;
      cursor: pointer !important;
      text-shadow: 0 2px 4px rgba(0, 0, 0, 0.8) !important;
      -webkit-user-select: none !important;
      user-select: none !important;
    }

    /* CENTER CONTROL ICONS */
    .center-controls-group {
      position: absolute !important;
      top: 50% !important;
      left: 50% !important;
      transform: translate(-50%, -50%) !important;
      display: flex !important;
      align-items: center !important;
      gap: 22px !important;
      z-index: 25 !important;
    }

    .center-ctrl-btn {
      background: transparent !important;
      border: none !important;
      color: #ffffff !important;
      width: 36px !important;
      height: 36px !important;
      display: flex !important;
      align-items: center !important;
      justify-content: center !important;
      cursor: pointer !important;
      padding: 0 !important;
    }

    .center-ctrl-btn.play-btn-large {
      width: 44px !important;
      height: 44px !important;
      background: #e50914 !important;
      border-radius: 50% !important;
      box-shadow: 0 4px 15px rgba(229, 9, 20, 0.5) !important;
    }

    /* SPEED UP FLOATING BADGE */
    .loklok-speed-badge {
      position: absolute;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.75);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #ffffff;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 700;
      display: none;
      z-index: 40;
      letter-spacing: 0.5px;
      -webkit-user-select: none;
      user-select: none;
    }
    .loklok-speed-badge.show {
      display: block;
    }

    /* SEEK BADGES */
    .loklok-seek-badge {
      position: absolute !important;
      top: 50% !important;
      transform: translateY(-50%) !important;
      background: rgba(0, 0, 0, 0.8) !important;
      color: #ffffff !important;
      padding: 8px 16px !important;
      border-radius: 20px !important;
      font-size: 0.85rem !important;
      font-weight: bold !important;
      display: none !important;
      opacity: 0 !important;
      transition: opacity 0.2s ease !important;
      pointer-events: none !important;
      z-index: 30 !important;
      border: 1px solid rgba(255, 255, 255, 0.15) !important;
    }

    #rewind-badge { left: 15% !important; }
    #forward-badge { right: 15% !important; }

    .loklok-seek-badge.show {
      display: flex !important;
      align-items: center !important;
      gap: 6px !important;
      opacity: 1 !important;
    }

    .player-bottom-bar {
      padding: 10px 14px !important;
      display: flex !important;
      flex-direction: column !important;
      gap: 4px !important;
      width: 100% !important;
      box-sizing: border-box !important;
    }

    .progress-bar-wrapper {
      width: 100% !important;
    }

    .progress-bar-wrapper input[type="range"] {
      width: 100% !important;
      height: 4px !important;
      accent-color: #e50914 !important;
      cursor: pointer !important;
    }

    .bottom-bar-controls {
      display: flex !important;
      align-items: center !important;
      justify-content: space-between !important;
      color: #ffffff !important;
      width: 100% !important;
    }

    .left-controls-group {
      display: flex !important;
      align-items: center !important;
      gap: 6px !important;
    }

    .btn-bottom-play {
      background: transparent !important;
      border: none !important;
      color: #ffffff !important;
      cursor: pointer !important;
      display: flex !important;
      align-items: center !important;
      justify-content: center !important;
      padding: 0 !important;
      width: 22px !important;
      height: 22px !important;
    }

    .right-utility-btns {
      display: flex !important;
      align-items: center !important;
      gap: 10px !important;
    }

    .ctrl-btn-small {
      background: transparent !important;
      border: none !important;
      color: #ffffff !important;
      cursor: pointer !important;
      padding: 0 !important;
      display: flex !important;
      align-items: center !important;
      justify-content: center !important;
    }

    .ctrl-btn-small svg,
    .btn-bottom-play svg,
    .center-ctrl-btn svg {
      width: 18px !important;
      height: 18px !important;
      display: block !important;
    }

    .center-ctrl-btn.play-btn-large svg {
      width: 20px !important;
      height: 20px !important;
    }

    .network-warning-note {
      width: calc(100% - 40px) !important;
      margin: 14px auto 0 auto !important;
      padding: 10px 16px !important;
      background: rgba(229, 9, 20, 0.12) !important;
      border: 1px solid rgba(229, 9, 20, 0.4) !important;
      border-radius: 8px !important;
      color: #ffffff !important;
      font-size: 0.82rem !important;
      font-weight: 600 !important;
      box-sizing: border-box !important;
    }

    .video-info-box {
      width: 100% !important;
      padding: 16px 20px 0 20px !important;
      box-sizing: border-box !important;
    }

    .media-title {
      font-size: 1.35rem !important;
      font-weight: 800 !important;
      margin-bottom: 6px !important;
      color: #ffffff !important;
    }

    .synopsis-text {
      font-size: 0.88rem !important;
      color: #cccccc !important;
      line-height: 1.5 !important;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
      transition: all 0.3s ease;
      margin-bottom: 6px !important;
    }

    .synopsis-text.expanded {
      display: block !important;
      overflow: visible !important;
    }

    .read-more-btn {
      background: transparent !important;
      border: none !important;
      color: #e50914 !important;
      font-size: 0.82rem !important;
      font-weight: 700 !important;
      cursor: pointer !important;
      padding: 0 !important;
      margin-bottom: 10px !important;
      display: inline-block !important;
    }

    .list-recommendations {
      width: 100% !important;
      box-sizing: border-box !important;
    }

    .recommendation-card {
      background: #181818 !important;
      border: 1px solid #262626 !important;
      border-radius: 8px !important;
      overflow: hidden !important;
      cursor: pointer !important;
      transition: transform 0.2s ease, border-color 0.2s ease !important;
    }

    .recommendation-card:hover {
      transform: translateY(-4px) !important;
      border-color: #e50914 !important;
    }

    .recommendation-card img {
      width: 100% !important;
      object-fit: cover !important;
      display: block !important;
    }

    .rec-info {
      padding: 8px !important;
      display: flex !important;
      flex-direction: column !important;
      gap: 2px !important;
    }

    .rec-title {
      font-size: 0.78rem !important;
      font-weight: 700 !important;
      color: #ffffff !important;
      white-space: nowrap !important;
      overflow: hidden !important;
      text-overflow: ellipsis !important;
    }

    .rec-genre {
      font-size: 0.68rem !important;
      color: #aaaaaa !important;
    }

    /* PC MODE ENLARGED CONTROLS OVERRIDES (min-width: 769px) */
    @media (min-width: 769px) {
      .player-top-bar {
        padding: 24px 30px !important;
        gap: 14px !important;
      }

      .icon-btn-back {
        font-size: 1.8rem !important;
      }

      .overlay-title-text {
        font-size: 1.4rem !important;
        font-weight: 800 !important;
      }

      .center-controls-group {
        gap: 40px !important;
      }

      .center-ctrl-btn {
        width: 48px !important;
        height: 48px !important;
      }

      .center-ctrl-btn.play-btn-large {
        width: 64px !important;
        height: 64px !important;
      }

      .center-ctrl-btn.play-btn-large svg {
        width: 28px !important;
        height: 28px !important;
      }

      .player-bottom-bar {
        padding: 20px 30px !important;
        gap: 12px !important;
      }

      .progress-bar-wrapper input[type="range"] {
        height: 7px !important;
      }

      .btn-bottom-play {
        width: 34px !important;
        height: 34px !important;
      }

      .btn-bottom-play svg,
      .ctrl-btn-small svg {
        width: 28px !important;
        height: 28px !important;
      }

      .time-display {
        font-size: 1.05rem !important;
        font-weight: 700 !important;
      }

      .right-utility-btns {
        gap: 22px !important;
      }

      .media-title {
        font-size: 1.8rem !important;
      }

      .synopsis-text {
        font-size: 1.02rem !important;
      }

      .read-more-btn {
        font-size: 0.95rem !important;
      }

      .section-header-title {
        font-size: 1.15rem !important;
      }

      .list-recommendations {
        display: flex !important;
        gap: 16px !important;
        overflow-x: auto !important;
        scrollbar-width: none;
        padding-bottom: 10px;
      }

      .list-recommendations::-webkit-scrollbar {
        display: none;
      }

      .recommendation-card {
        flex: 0 0 160px !important;
        width: 160px !important;
      }

      .recommendation-card img {
        height: 230px !important;
      }
    }

    /* MOBILE MODE LAYOUT & FULLSCREEN FIX */
    @media (max-width: 768px) {
      .video-info-box,
      .content-section {
        padding-left: 14px !important;
        padding-right: 14px !important;
      }

      .network-warning-note {
        width: calc(100% - 28px) !important;
        font-size: 0.78rem !important;
      }

      .list-recommendations {
        display: grid !important;
        grid-template-columns: repeat(2, 1fr) !important;
        gap: 10px !important;
      }

      .recommendation-card {
        width: 100% !important;
      }

      .recommendation-card img {
        height: 180px !important;
      }

      .player-bottom-bar {
        padding: 8px 10px !important;
      }

      .time-display {
        font-size: 0.68rem !important;
      }

      .right-utility-btns {
        gap: 8px !important;
      }

      #btn-fullscreen {
        display: flex !important;
        visibility: visible !important;
        opacity: 1 !important;
      }
    }
  </style>

  <!-- SHIELD SCRIPT -->
  <script>
    (function () {
      'use strict';
      document.addEventListener('contextmenu', function (e) { e.preventDefault(); });
      document.addEventListener('keydown', function (e) {
        if (
          e.keyCode === 123 || 
          (e.ctrlKey && e.shiftKey && (e.keyCode === 73 || e.keyCode === 74 || e.keyCode === 67)) || 
          (e.ctrlKey && e.keyCode === 85) || 
          (e.metaKey && e.altKey && (e.keyCode === 73 || e.keyCode === 74 || e.keyCode === 67)) || 
          (e.metaKey && e.keyCode === 85)
        ) {
          e.preventDefault();
          return false;
        }
      });
    })();
  </script>
</head>
<body>

  <!-- Video Player Section Container -->
  <div class="video-container" id="playerContainer">
    <!-- HTML5 Video Player (Used for direct video files / HD manual embeds) -->
    <video id="direct-video-player" playsinline crossorigin="anonymous" style="display: none;"></video>

    <!-- YouTube Iframe Player with zero-cookie origin bypass -->
    <iframe id="trailer-iframe-player" 
            style="display: none;" 
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" 
            allowfullscreen>
    </iframe>

    <!-- Custom On-Screen Subtitle Container Overlay -->
    <div id="subtitle-display" class="custom-subtitle-display"></div>

    <!-- Animated Loading Buffer Overlay -->
    <div id="video-loading-spinner" class="loading-spinner-overlay" style="display: none;">
      <div class="spinner-ring"></div>
      <div class="spinner-text">Buffering...</div>
    </div>

    <!-- Speed Up Floating Badge -->
    <div id="speed-badge" class="loklok-speed-badge">2.0x Speed</div>

    <div id="player-gesture-overlay" class="player-overlay active">
      <!-- TOP-LEFT BACK HEADER -->
      <div class="player-top-bar" onclick="forceBackToHome()">
        <button id="btn-back-nav" class="icon-btn-back">❮</button>
        <span id="overlay-movie-title" class="overlay-title-text">Loading...</span>
      </div>

      <div id="brightness-slider-container" class="vertical-slider-bar left-bar">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M12 7c-2.76 0-5 2.24-5 5s2.24 5 5 5 5-2.24 5-5-2.24-5-5-5zM2 13h2c.55 0 1-.45 1-1s-.45-1-1-1H2c-.55 0-1 .45-1 1s.45 1 1 1zm18 0h2c.55 0 1-.45 1-1s-.45-1-1-1h-2c-.55 0-1 .45-1 1s.45 1 1 1zM11 2v2c0 .55.45 1 1 1s1-.45 1-1V2c0-.55-.45-1-1-1s-1 .45-1 1zm0 18v2c0 .55.45 1 1 1s1-.45 1-1v-2c0-.55-.45-1-1-1s-1 .45-1 1z"/></svg>
        <div class="v-track"><div id="brightness-fill" class="v-fill"></div></div>
      </div>

      <div id="volume-slider-container" class="vertical-slider-bar right-bar">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z"/></svg>
        <div class="v-track"><div id="volume-fill" class="v-fill"></div></div>
      </div>

      <!-- CENTER ICONS -->
      <div id="center-controls" class="center-controls-group">
        <button id="btn-rewind-center" class="center-ctrl-btn" title="Rewind 10s">
          <svg viewBox="0 0 24 24" fill="#ffffff">
            <path d="M12 5V1L7 6l5 5V7c3.31 0 6 2.69 6 6s-2.69 6-6 6-6-2.69-6-6H4c0 4.42 3.58 8 8 8s8-3.58 8-8-3.58-8-8-8z"/>
            <text x="12" y="14.5" font-size="7" font-weight="800" font-family="sans-serif" text-anchor="middle" fill="#ffffff">10</text>
          </svg>
        </button>

        <button id="btn-play-pause-center" class="center-ctrl-btn play-btn-large" title="Play/Pause">
          <svg viewBox="0 0 24 24" fill="#ffffff">
            <path id="svg-center-path" d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>
          </svg>
        </button>

        <button id="btn-forward-center" class="center-ctrl-btn" title="Forward 10s">
          <svg viewBox="0 0 24 24" fill="#ffffff">
            <path d="M12 5V1l5 5-5 5V7c-3.31 0-6 2.69-6 6s2.69 6 6 6 6-2.69-6-6h2c0 4.42-3.58 8-8 8s-8-3.58-8-8 3.58-8 8-8z"/>
            <text x="12" y="14.5" font-size="7" font-weight="800" font-family="sans-serif" text-anchor="middle" fill="#ffffff">10</text>
          </svg>
        </button>
      </div>

      <div id="rewind-badge" class="loklok-seek-badge">-10 <span class="ring-icon">⟲</span></div>
      <div id="forward-badge" class="loklok-seek-badge"><span class="ring-icon">⟳</span> +10</div>

      <!-- Dynamically Rendered Subtitle Menu -->
      <div id="subtitle-menu" class="subtitle-menu-modal" style="display: none;">
        <div class="subtitle-menu-title">Subtitles</div>
        <div id="subtitle-options-container">
          <div class="subtitle-option disabled-option">Searching subtitles...</div>
        </div>
      </div>

      <div class="player-bottom-bar">
        <div class="progress-bar-wrapper">
          <input type="range" id="video-seekbar" min="0" max="100" value="0" step="0.1">
        </div>
        <div class="bottom-bar-controls">
          <div class="left-controls-group">
            <button id="btn-bottom-play-pause" class="btn-bottom-play" title="Play/Pause">
              <svg viewBox="0 0 24 24" fill="#ffffff">
                <path id="svg-bottom-path" d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>
              </svg>
            </button>
            <div class="time-display" style="font-size: 0.8rem; font-weight: 600; color: #ffffff;">
              <span id="current-time-text">00:00:00</span> / <span id="total-duration-text">00:00:00</span>
            </div>
          </div>
          <div class="right-utility-btns">
            <!-- SUBTITLE CC BUTTON -->
            <button id="btn-subtitles" class="ctrl-btn-small" title="Subtitles Menu">
              <svg viewBox="0 0 24 24" fill="currentColor">
                <path d="M19 4H5c-1.11 0-2 .9-2 2v12c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm-8 7H9.5v-.5h-2v3h2V13H11v1c0 .55-.45 1-1 1H7c-.55 0-1-.45-1-1v-4c0-.55.45-1 1-1h3c.55 0 1 .45 1 1v1zm7 0h-1.5v-.5h-2v3h2V13H18v1c0 .55-.45 1-1 1h-3c-.55 0-1-.45-1-1v-4c0-.55.45-1 1-1h3c.55 0 1 .45 1 1v1z"/>
              </svg>
            </button>

            <!-- MUTE/UNMUTE BUTTON -->
            <button id="btn-unmute" class="ctrl-btn-small" title="Mute/Unmute">
              <svg viewBox="0 0 24 24" fill="currentColor">
                <path id="svg-volume-path" d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>
              </svg>
            </button>

            <!-- FULLSCREEN BUTTON -->
            <button id="btn-fullscreen" class="ctrl-btn-small" title="Fullscreen">
              <svg viewBox="0 0 24 24" fill="currentColor">
                <path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/>
              </svg>
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div id="network-note" class="network-warning-note" style="display: none;">
    ⚠️ Slow connection? Reload the page to retry playback.
  </div>

  <div class="video-info-box">
    <h1 id="current-title" class="media-title">Loading...</h1>
    <p id="current-description" class="synopsis-text">Loading synopsis...</p>
    <button id="toggle-synopsis-btn" class="read-more-btn" onclick="toggleSynopsis()" style="display: none;">Read More</button>
  </div>

  <section class="content-section" style="padding-bottom: 30px;">
    <h3 class="section-header-title" style="margin-bottom: 12px; color: #ffffff;">More Like This</h3>
    <div class="list-recommendations" id="random-grid"></div>
  </section>

  <div id="loading-toast" class="toast-notification">Loading...</div>

  <script src="app.js?v=150.0"></script>
  <script>
    function destroyAllPlayers() {
      window.onbeforeunload = null;
      const dp = document.getElementById('direct-video-player');
      const tp = document.getElementById('trailer-iframe-player');
      if (dp) {
        dp.pause();
        dp.removeAttribute('src');
        dp.load();
      }
      if (tp) {
        tp.removeAttribute('src');
      }
    }

    window.addEventListener('pagehide', destroyAllPlayers);
    window.addEventListener('pageshow', function(event) {
      if (event.persisted) {
        window.location.replace('index.html');
      }
    });

    function forceBackToHome() {
      const isFS = !!(document.fullscreenElement || document.webkitFullscreenElement || document.mozFullScreenElement || document.msFullscreenElement);
      if (isFS) {
        exitFullscreen();
      }
      destroyAllPlayers();
      window.location.replace('index.html');
    }

    function exitFullscreen() {
      if (document.exitFullscreen) {
        document.exitFullscreen();
      } else if (document.webkitExitFullscreen) {
        document.webkitExitFullscreen();
      } else if (document.mozCancelFullScreen) {
        document.mozCancelFullScreen();
      } else if (document.msExitFullscreen) {
        document.msExitFullscreen();
      }
    }

    const urlParams = new URLSearchParams(window.location.search);
    const movieId = urlParams.get('id');

    const safeMoviesList = (typeof movies !== 'undefined' && Array.isArray(movies)) ? movies : [];
    const safeFeaturedList = (typeof featuredMovies !== 'undefined' && Array.isArray(featuredMovies)) ? featuredMovies : [];

    const currentMovie = safeMoviesList.find(m => m.id === movieId) || 
                         safeFeaturedList.find(m => m.id === movieId) || 
                         safeMoviesList[0] || 
                         { 
                           id: movieId || 'fallback', 
                           title: 'The Runner', 
                           tmdbId: 634649, 
                           description: '', 
                           poster: 'https://via.placeholder.com/300x450?text=DEYMFLIX',
                           manualEmbed: '',
                           trailerEmbed: ''
                         };

    document.getElementById('current-title').textContent = currentMovie.title;
    document.getElementById('overlay-movie-title').textContent = currentMovie.title;

    const descElement = document.getElementById('current-description');
    const readMoreBtn = document.getElementById('toggle-synopsis-btn');
    const networkNote = document.getElementById('network-note');
    const loadingSpinner = document.getElementById('video-loading-spinner');
    const centerControlsGroup = document.getElementById('center-controls');
    const btnSubtitles = document.getElementById('btn-subtitles');
    const subtitleMenu = document.getElementById('subtitle-menu');
    const subtitleOptionsContainer = document.getElementById('subtitle-options-container');
    const subtitleDisplay = document.getElementById('subtitle-display');

    let availableSubtitles = {}; 
    let parsedSubtitleCues = [];

    const languageNames = {
      'en': 'English',
      'es': 'Spanish',
      'fr': 'French',
      'de': 'German',
      'tl': 'Tagalog'
    };

    function checkSynopsisLength() {
      setTimeout(() => {
        if (descElement.scrollHeight > descElement.clientHeight || descElement.textContent.length > 150) {
          readMoreBtn.style.display = 'inline-block';
        } else {
          readMoreBtn.style.display = 'none';
        }
      }, 50);
    }

    function toggleSynopsis() {
      if (descElement.classList.contains('expanded')) {
        descElement.classList.remove('expanded');
        readMoreBtn.textContent = 'Read More';
      } else {
        descElement.classList.add('expanded');
        readMoreBtn.textContent = 'Show Less';
      }
    }

    async function loadBroadSynopsis() {
      if (currentMovie.description && currentMovie.description.trim() !== '') {
        descElement.textContent = currentMovie.description;
        checkSynopsisLength();
        return;
      }

      if (currentMovie.synopsis && currentMovie.synopsis.trim() !== '') {
        descElement.textContent = currentMovie.synopsis;
        checkSynopsisLength();
        return;
      }

      const apiKey = '15d260044e350723365198253b23914f';

      if (currentMovie.tmdbId) {
        try {
          const tmdbRes = await fetch(`https://api.themoviedb.org/3/movie/${currentMovie.tmdbId}?api_key=${apiKey}&language=en-US`);
          if (tmdbRes.ok) {
            const tmdbData = await tmdbRes.json();
            if (tmdbData.overview && tmdbData.overview.trim() !== '') {
              descElement.textContent = tmdbData.overview;
              checkSynopsisLength();
              return;
            }
          }
        } catch (e) {}
      }

      const originTag = currentMovie.isFilipino ? "Filipino movie" : "feature movie";
      descElement.textContent = `Watch "${currentMovie.title}", a ${originTag} available in high quality streaming on DEYMFLIX.`;
      checkSynopsisLength();
    }

    loadBroadSynopsis();

    function timeToSeconds(timeStr) {
      if (!timeStr) return 0;
      const parts = timeStr.trim().replace(',', '.').split(':');
      if (parts.length < 3) return 0;
      return parseFloat(parts[0]) * 3600 + parseFloat(parts[1]) * 60 + parseFloat(parts[2]);
    }

    function parseSrtCues(srtText) {
      const cues = [];
      const blocks = srtText.trim().replace(/\r\n|\r/g, '\n').split('\n\n');

      blocks.forEach(block => {
        const lines = block.split('\n');
        if (lines.length >= 2) {
          let timeLine = lines[0].includes('-->') ? lines[0] : lines[1];
          let textLines = lines[0].includes('-->') ? lines.slice(1) : lines.slice(2);

          if (timeLine && timeLine.includes('-->')) {
            const times = timeLine.split('-->');
            const start = timeToSeconds(times[0]);
            const end = timeToSeconds(times[1]);
            const text = textLines.join('<br>').replace(/<[^>]*>/g, '');

            if (text.trim() !== '') {
              cues.push({ start, end, text });
            }
          }
        }
      });
      return cues;
    }

    async function scanOnlineSubtitles() {
      availableSubtitles = {};
      const targetLangs = ['en', 'es', 'fr', 'de', 'tl'];
      const apiKey = '15d260044e350723365198253b23914f';

      let imdbId = null;

      if (currentMovie.tmdbId) {
        try {
          const tmdbRes = await fetch(`https://api.themoviedb.org/3/movie/${currentMovie.tmdbId}/external_ids?api_key=${apiKey}`);
          if (tmdbRes.ok) {
            const tmdbData = await tmdbRes.json();
            imdbId = tmdbData.imdb_id;
          }
        } catch (e) {}
      }

      if (!imdbId) {
        renderSubtitleMenu();
        return;
      }

      const scanPromises = targetLangs.map(async (lang) => {
        try {
          const subUrl = `https://sub.vyndev.workers.dev/?imdb=${imdbId}&lang=${lang}`;
          const res = await fetch(subUrl);
          if (res.ok) {
            const srtText = await res.text();
            if (srtText && srtText.includes('-->')) {
              availableSubtitles[lang] = srtText;
            }
          }
        } catch (err) {}
      });

      await Promise.all(scanPromises);
      renderSubtitleMenu();
    }

    function renderSubtitleMenu() {
      subtitleOptionsContainer.innerHTML = '';
      const foundLangs = Object.keys(availableSubtitles);

      if (foundLangs.length === 0) {
        subtitleOptionsContainer.innerHTML = `<div class="subtitle-option disabled-option">No subtitles found</div>`;
        btnSubtitles.style.opacity = '0.5';
        return;
      }

      btnSubtitles.style.opacity = '1';

      let menuHtml = `<div id="sub-opt-off" class="subtitle-option selected" onclick="selectSubtitleLanguage('off', event)">Off</div>`;

      foundLangs.forEach(lang => {
        const name = languageNames[lang] || lang.toUpperCase();
        menuHtml += `<div id="sub-opt-${lang}" class="subtitle-option" onclick="selectSubtitleLanguage('${lang}', event)">${name}</div>`;
      });

      subtitleOptionsContainer.innerHTML = menuHtml;
    }

    function selectSubtitleLanguage(langCode, e) {
      if (e) e.stopPropagation();

      subtitleMenu.style.display = 'none';
      parsedSubtitleCues = [];
      subtitleDisplay.innerHTML = '';

      document.querySelectorAll('.subtitle-option').forEach(opt => opt.classList.remove('selected'));

      if (langCode === 'off') {
        const offOpt = document.getElementById('sub-opt-off');
        if (offOpt) offOpt.classList.add('selected');
        btnSubtitles.classList.remove('subtitle-active-btn');
        showToast("Subtitles: Off");
        return;
      }

      const targetOpt = document.getElementById(`sub-opt-${langCode}`);
      if (targetOpt) targetOpt.classList.add('selected');

      const rawSrt = availableSubtitles[langCode];
      if (rawSrt) {
        parsedSubtitleCues = parseSrtCues(rawSrt);
        btnSubtitles.classList.add('subtitle-active-btn');
        showToast(`Subtitles: ${languageNames[langCode] || langCode.toUpperCase()}`);
      }
    }

    scanOnlineSubtitles();

    btnSubtitles.onclick = (e) => {
      e.stopPropagation();
      if (subtitleMenu.style.display === 'none' || subtitleMenu.style.display === '') {
        subtitleMenu.style.display = 'flex';
        showControls();
      } else {
        subtitleMenu.style.display = 'none';
      }
    };

    const directPlayer = document.getElementById('direct-video-player');
    const trailerPlayer = document.getElementById('trailer-iframe-player');
    const playerContainer = document.getElementById('playerContainer');
    const playerOverlay = document.getElementById('player-gesture-overlay');

    const btnPlayPauseCenter = document.getElementById('btn-play-pause-center');
    const btnBottomPlayPause = document.getElementById('btn-bottom-play-pause');

    const btnRewind = document.getElementById('btn-rewind-center');
    const btnForward = document.getElementById('btn-forward-center');
    const btnUnmute = document.getElementById('btn-unmute');
    const btnFullscreen = document.getElementById('btn-fullscreen');

    const seekbar = document.getElementById('video-seekbar');
    const currentTimeText = document.getElementById('current-time-text');
    const totalDurationText = document.getElementById('total-duration-text');

    const rewindBadge = document.getElementById('rewind-badge');
    const forwardBadge = document.getElementById('forward-badge');
    const speedBadge = document.getElementById('speed-badge');

    const brightnessContainer = document.getElementById('brightness-slider-container');
    const brightnessFill = document.getElementById('brightness-fill');
    const volumeContainer = document.getElementById('volume-slider-container');
    const volumeFill = document.getElementById('volume-fill');

    let toastTimeout;
    let slowConnectionTimer = null;
    let autoHideTimer = null;
    let currentBrightness = 100;
    let lastTapTime = 0;

    const playPathData = "M8 5v14l11-7z";
    const pausePathData = "M6 19h4V5H6v14zm8-14v14h4V5h-4z";

    function updatePlayStateUI(isPlaying) {
      const centerPath = document.getElementById('svg-center-path');
      const bottomPath = document.getElementById('svg-bottom-path');
      const targetData = isPlaying ? pausePathData : playPathData;
      
      if (centerPath) centerPath.setAttribute('d', targetData);
      if (bottomPath) bottomPath.setAttribute('d', targetData);
    }

    function updateSeekbarBackground(val) {
      seekbar.style.background = `linear-gradient(to right, #e50914 0%, #e50914 ${val}%, rgba(255, 255, 255, 0.3) ${val}%, rgba(255, 255, 255, 0.3) 100%)`;
    }

    function showControls() {
      playerOverlay.classList.add('active');
      clearTimeout(autoHideTimer);

      autoHideTimer = setTimeout(() => {
        if (subtitleMenu.style.display !== 'flex') {
          hideControls();
        }
      }, 2500);
    }

    function hideControls() {
      playerOverlay.classList.remove('active');
      subtitleMenu.style.display = 'none';
    }

    function toggleOverlayControls(e) {
      if (subtitleMenu.contains(e.target) || e.target === btnSubtitles) return;

      const now = Date.now();
      if (now - lastTapTime < 300) {
        e.preventDefault();
        return;
      }
      lastTapTime = now;

      if (e.target === playerOverlay || e.target === playerContainer) {
        if (playerOverlay.classList.contains('active')) {
          hideControls();
          clearTimeout(autoHideTimer);
        } else {
          showControls();
        }
      } else {
        showControls();
      }
    }

    let touchStartY = 0;
    let isGestureDragging = false;
    let gestureType = null;
    let sliderHideTimer = null;

    playerContainer.addEventListener('touchstart', (e) => {
      if (e.touches.length === 1) {
        touchStartY = e.touches[0].clientY;
        const screenWidth = window.innerWidth;
        const clientX = e.touches[0].clientX;
        gestureType = clientX < screenWidth / 2 ? 'brightness' : 'volume';
        isGestureDragging = false;
      }
    }, { passive: true });

    playerContainer.addEventListener('touchmove', (e) => {
      if (e.touches.length !== 1) return;

      const currentY = e.touches[0].clientY;
      const deltaY = touchStartY - currentY;
      
      if (Math.abs(deltaY) > 6) {
        isGestureDragging = true;
      }

      if (!isGestureDragging) return;

      touchStartY = currentY;
      clearTimeout(sliderHideTimer);

      if (gestureType === 'brightness') {
        currentBrightness = Math.max(20, Math.min(150, currentBrightness + (deltaY * 0.5)));
        playerContainer.style.filter = `brightness(${currentBrightness}%)`;
        brightnessFill.style.height = `${((currentBrightness - 20) / 130) * 100}%`;
        brightnessContainer.style.display = 'flex';
      }
    }, { passive: true });

    playerContainer.addEventListener('touchend', (e) => {
      if (!isGestureDragging) {
        toggleOverlayControls(e);
      }

      sliderHideTimer = setTimeout(() => {
        brightnessContainer.style.display = 'none';
        volumeContainer.style.display = 'none';
        isGestureDragging = false;
      }, 1000);
    });

    playerContainer.addEventListener('mousemove', () => showControls());

    function hideLoadingSpinner() {
      loadingSpinner.style.display = 'none';
      networkNote.style.display = 'none';
      clearTimeout(slowConnectionTimer);
      centerControlsGroup.style.setProperty('display', 'flex', 'important');
    }

    function showToast(message) {
      const toast = document.getElementById('loading-toast');
      if (toast) {
        toast.textContent = message;
        toast.classList.add('show');

        clearTimeout(toastTimeout);
        toastTimeout = setTimeout(() => {
          toast.classList.remove('show');
        }, 1500);
      }
    }

    function formatTime(seconds) {
      if (isNaN(seconds)) return "00:00:00";
      const hrs = Math.floor(seconds / 3600);
      const mins = Math.floor((seconds % 3600) / 60);
      const secs = Math.floor(seconds % 60);

      return `${hrs < 10 ? '0' + hrs : hrs}:${mins < 10 ? '0' + mins : mins}:${secs < 10 ? '0' + secs : secs}`;
    }

    // Determine playback source: manualEmbed (HD) vs trailerEmbed (YouTube/Iframe) vs fallback sample video
    const hasManualEmbed = currentMovie.manualEmbed && currentMovie.manualEmbed.trim() !== '';
    const hasTrailerEmbed = currentMovie.trailerEmbed && currentMovie.trailerEmbed.trim() !== '';

    if (hasManualEmbed) {
      directPlayer.style.display = 'block';
      trailerPlayer.style.display = 'none';

      const playSource = (typeof cleanDriveLink === 'function') ? cleanDriveLink(currentMovie.manualEmbed) : currentMovie.manualEmbed;
      directPlayer.src = playSource;

      directPlayer.addEventListener('loadedmetadata', () => {
        hideLoadingSpinner();
        totalDurationText.textContent = formatTime(directPlayer.duration);
      });

      directPlayer.addEventListener('timeupdate', () => {
        if (!isNaN(directPlayer.duration)) {
          const pct = (directPlayer.currentTime / directPlayer.duration) * 100;
          seekbar.value = pct;
          updateSeekbarBackground(pct);
          currentTimeText.textContent = formatTime(directPlayer.currentTime);
        }
      });

      seekbar.addEventListener('input', () => {
        if (!isNaN(directPlayer.duration)) {
          directPlayer.currentTime = (seekbar.value / 100) * directPlayer.duration;
        }
      });

      btnPlayPauseCenter.onclick = (e) => {
        e.stopPropagation();
        if (directPlayer.paused) {
          directPlayer.play();
          updatePlayStateUI(true);
        } else {
          directPlayer.pause();
          updatePlayStateUI(false);
        }
      };

      directPlayer.play().catch(() => {});

    } else if (hasTrailerEmbed) {
      directPlayer.style.display = 'none';
      trailerPlayer.style.display = 'block';

      // Extract Youtube Video ID cleanly
      let rawUrl = currentMovie.trailerEmbed.trim();
      let videoId = rawUrl;

      if (rawUrl.includes('v=')) {
        videoId = rawUrl.split('v=')[1].split('&')[0];
      } else if (rawUrl.includes('youtu.be/')) {
        videoId = rawUrl.split('youtu.be/')[1].split('?')[0];
      } else if (rawUrl.includes('/embed/')) {
        videoId = rawUrl.split('/embed/')[1].split('?')[0];
      }

      // Bypass cookie and third-party domain restrictions
      trailerPlayer.src = `https://www.youtube-nocookie.com/embed/${videoId}?autoplay=1&mute=1&enablejsapi=1&rel=0`;

      hideLoadingSpinner();
      totalDurationText.textContent = "TRAILER";
      updatePlayStateUI(true);

    } else {
      directPlayer.style.display = 'block';
      trailerPlayer.style.display = 'none';
      directPlayer.src = "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/TearsOfSteel.mp4";
      
      directPlayer.addEventListener('loadedmetadata', () => {
        hideLoadingSpinner();
        totalDurationText.textContent = formatTime(directPlayer.duration);
      });

      directPlayer.play().catch(() => {});
    }

    function toggleFullscreen() {
      const isFS = !!(document.fullscreenElement || document.webkitFullscreenElement || document.mozFullScreenElement || document.msFullscreenElement);

      if (!isFS) {
        const requestFS = playerContainer.requestFullscreen || 
                          playerContainer.webkitRequestFullscreen || 
                          playerContainer.mozRequestFullScreen || 
                          playerContainer.msRequestFullscreen;

        if (requestFS) {
          requestFS.call(playerContainer).catch(() => {});
        }
      } else {
        exitFullscreen();
      }
    }

    btnFullscreen.onclick = (e) => {
      e.stopPropagation();
      toggleFullscreen();
    };

    // Render Recommendations
    const grid = document.getElementById('random-grid');
    const otherMovies = safeMoviesList.filter(m => m.id !== currentMovie.id);
    const shuffled = [...otherMovies].sort(() => 0.5 - Math.random());

    shuffled.slice(0, 10).forEach(movie => {
      const card = document.createElement('div');
      card.className = 'recommendation-card';
      card.onclick = () => window.location.href = `player.html?id=${encodeURIComponent(movie.id)}`;
      
      const recLabel = (movie.manualEmbed && movie.manualEmbed.trim() !== '') ? 'HD' : 'TRAILER';

      card.innerHTML = `
        <img src="${movie.poster}" alt="${movie.title}">
        <div class="rec-info">
          <span class="rec-title">${movie.title}</span>
          <span class="rec-genre">Movie • ${recLabel}</span>
        </div>
      `;
      grid.appendChild(card);
    });
  </script>
