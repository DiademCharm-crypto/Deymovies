<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>DEYMFLIX - Player</title>

  <!-- Favicon Link -->
  <link rel="icon" type="image/svg+xml" href="favicon.svg">

  <!-- Anti-Cache Headers -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">

  <link rel="stylesheet" href="style.css?v=120.0">

  <style>
    /* RESET & BASE BODY FOR PLAYER PAGE ONLY */
    body {
      padding-top: 0 !important;
      background-color: #0f0f0f !important;
      margin: 0 !important;
      color: #ffffff !important;
      width: 100% !important;
      overflow-x: hidden !important;
    }

    /* VIDEO PLAYER CONTAINER LAYOUT FIXES */
    .video-container {
      position: relative !important;
      width: 100% !important;
      max-width: 100% !important;
      aspect-ratio: 16 / 9 !important;
      background: #000000 !important;
      margin: 0 auto !important;
      overflow: hidden !important;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.9) !important;
      user-select: none !important;
    }

    #direct-video-player,
    #main-iframe {
      width: 100% !important;
      height: 100% !important;
      object-fit: contain !important;
      border: none !important;
      display: block !important;
    }

    /* FULL-SCREEN CLICK ABSORBER OVERLAY */
    .ultimate-ad-shield {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 10;
      background: rgba(0, 0, 0, 0.001);
      cursor: pointer;
    }

    /* ANIMATED LOADING BUFFER SPINNER */
    .loading-spinner-overlay {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 28;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      pointer-events: none;
    }

    .spinner-ring {
      width: 54px;
      height: 54px;
      border: 4px solid rgba(255, 255, 255, 0.2);
      border-top: 4px solid #e50914;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    .spinner-text {
      color: #fff;
      font-size: 0.85rem;
      margin-top: 10px;
      font-weight: 600;
      letter-spacing: 0.5px;
      text-shadow: 0 2px 4px rgba(0,0,0,0.8);
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    /* NATIVE WEBVTT CUE STYLING OVERRIDE */
    ::cue {
      background: rgba(0, 0, 0, 0.85) !important;
      color: #ffffff !important;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif !important;
      font-size: 1.15rem !important;
      font-weight: 600 !important;
      border-radius: 4px !important;
      padding: 4px 8px !important;
      text-shadow: 0 2px 4px rgba(0, 0, 0, 0.9) !important;
    }

    /* CUSTOM ON-SCREEN SUBTITLE CONTAINER OVERLAY */
    .custom-subtitle-display {
      position: absolute;
      bottom: 80px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 15;
      text-align: center;
      width: 90%;
      max-width: 800px;
      pointer-events: none;
    }

    .subtitle-line {
      display: inline-block;
      background: rgba(0, 0, 0, 0.82);
      color: #ffffff;
      font-size: 1.15rem;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 4px;
      line-height: 1.4;
      text-shadow: 0 1px 3px rgba(0,0,0,0.9);
      margin-top: 2px;
    }

    /* SUBTITLE SELECTION MENU MODAL */
    .subtitle-menu-modal {
      position: absolute;
      bottom: 65px;
      right: 20px;
      background: rgba(12, 12, 12, 0.95);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 8px;
      padding: 8px 0;
      z-index: 1000 !important;
      width: 180px;
      display: flex;
      flex-direction: column;
      box-shadow: 0 10px 30px rgba(0,0,0,0.9);
      backdrop-filter: blur(12px);
      pointer-events: auto !important;
    }

    .subtitle-menu-title {
      font-size: 0.75rem;
      font-weight: 800;
      color: #888;
      text-transform: uppercase;
      padding: 6px 16px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      margin-bottom: 4px;
      letter-spacing: 0.5px;
    }

    .subtitle-option {
      padding: 10px 16px;
      color: #ddd;
      font-size: 0.88rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: background 0.2s, color 0.2s;
    }

    .subtitle-option:hover {
      background: rgba(229, 9, 20, 0.25);
      color: #fff;
    }

    .subtitle-option.selected {
      color: #e50914;
      font-weight: 700;
    }

    .subtitle-option.disabled-option {
      color: #666;
      cursor: default;
    }

    .subtitle-option.disabled-option:hover {
      background: transparent;
      color: #666;
    }

    .subtitle-active-btn {
      color: #e50914 !important;
      border-bottom: 2px solid #e50914;
    }

    /* PLAYER OVERLAY CONTROLS */
    .player-overlay {
      position: absolute !important;
      inset: 0 !important;
      width: 100% !important;
      height: 100% !important;
      background: linear-gradient(180deg, rgba(0,0,0,0.6) 0%, transparent 25%, transparent 75%, rgba(0,0,0,0.8) 100%) !important;
      display: flex !important;
      flex-direction: column !important;
      justify-content: space-between !important;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
      z-index: 20 !important;
      box-sizing: border-box !important;
    }

    .player-overlay.active {
      opacity: 1 !important;
      pointer-events: auto !important;
    }

    /* TOP-LEFT BACK HEADER (< Title) */
    .player-top-bar {
      display: flex !important;
      align-items: center !important;
      gap: 8px !important;
      padding: 16px 20px !important;
      color: #ffffff !important;
      width: auto !important;
      box-sizing: border-box !important;
      z-index: 30 !important;
      cursor: pointer !important;
    }

    .icon-btn-back {
      background: transparent !important;
      border: none !important;
      color: #ffffff !important;
      font-size: 1.1rem !important;
      font-weight: 700 !important;
      cursor: pointer !important;
      padding: 0 !important;
      display: inline-block !important;
    }

    .overlay-title-text {
      font-weight: 700 !important;
      font-size: 1rem !important;
      color: #ffffff !important;
      cursor: pointer !important;
      text-shadow: 0 2px 4px rgba(0, 0, 0, 0.8) !important;
    }

    /* CENTER CONTROL ICONS */
    .center-controls-group {
      position: absolute !important;
      top: 50% !important;
      left: 50% !important;
      transform: translate(-50%, -50%) !important;
      display: flex !important;
      align-items: center !important;
      gap: 22px !important;
      z-index: 25 !important;
    }

    .center-ctrl-btn {
      background: transparent !important;
      border: none !important;
      color: #ffffff !important;
      width: 44px !important;
      height: 44px !important;
      display: flex !important;
      align-items: center !important;
      justify-content: center !important;
      cursor: pointer !important;
      padding: 0 !important;
    }

    .center-ctrl-btn.play-btn-large {
      width: 58px !important;
      height: 58px !important;
      background: #e50914 !important;
      border-radius: 50% !important;
      box-shadow: 0 4px 15px rgba(229, 9, 20, 0.5) !important;
    }

    /* LOKLOK SEEK BADGES */
    .loklok-seek-badge {
      position: absolute !important;
      top: 50% !important;
      transform: translateY(-50%) !important;
      background: rgba(0, 0, 0, 0.8) !important;
      color: #ffffff !important;
      padding: 8px 16px !important;
      border-radius: 20px !important;
      font-size: 0.85rem !important;
      font-weight: bold !important;
      display: none !important;
      opacity: 0 !important;
      transition: opacity 0.2s ease !important;
      pointer-events: none !important;
      z-index: 30 !important;
      border: 1px solid rgba(255, 255, 255, 0.15) !important;
    }

    #rewind-badge { left: 15% !important; }
    #forward-badge { right: 15% !important; }

    .loklok-seek-badge.show {
      display: flex !important;
      align-items: center !important;
      gap: 6px !important;
      opacity: 1 !important;
    }

    .player-bottom-bar {
      padding: 12px 18px !important;
      display: flex !important;
      flex-direction: column !important;
      gap: 6px !important;
      width: 100% !important;
      box-sizing: border-box !important;
    }

    .progress-bar-wrapper {
      width: 100% !important;
    }

    .progress-bar-wrapper input[type="range"] {
      width: 100% !important;
      height: 4px !important;
      accent-color: #e50914 !important;
      cursor: pointer !important;
    }

    .bottom-bar-controls {
      display: flex !important;
      align-items: center !important;
      justify-content: space-between !important;
      color: #ffffff !important;
      width: 100% !important;
    }

    .left-controls-group {
      display: flex !important;
      align-items: center !important;
      gap: 12px !important;
    }

    .btn-bottom-play {
      background: transparent !important;
      border: none !important;
      color: #ffffff !important;
      cursor: pointer !important;
      display: flex !important;
      align-items: center !important;
      justify-content: center !important;
      padding: 0 !important;
      width: 24px !important;
      height: 24px !important;
    }

    .right-utility-btns {
      display: flex !important;
      align-items: center !important;
      gap: 14px !important;
    }

    .ctrl-btn-small {
      background: transparent !important;
      border: none !important;
      color: #ffffff !important;
      cursor: pointer !important;
      padding: 0 !important;
      display: flex !important;
      align-items: center !important;
      justify-content: center !important;
    }

    /* WARNING NOTE AND DETAILS BOX */
    .network-warning-note {
      width: calc(100% - 40px) !important;
      margin: 14px auto 0 auto !important;
      padding: 10px 16px !important;
      background: rgba(229, 9, 20, 0.12) !important;
      border: 1px solid rgba(229, 9, 20, 0.4) !important;
      border-radius: 8px !important;
      color: #ffffff !important;
      font-size: 0.82rem !important;
      font-weight: 600 !important;
      box-sizing: border-box !important;
    }

    /* ENHANCED SYNOPSIS & DESCRIPTION BOX FIX */
    .video-info-box {
      width: 100% !important;
      padding: 16px 20px 0 20px !important;
      box-sizing: border-box !important;
    }

    .media-title {
      font-size: 1.35rem !important;
      font-weight: 800 !important;
      margin-bottom: 6px !important;
      color: #ffffff !important;
    }

    .synopsis-text {
      font-size: 0.88rem !important;
      color: #cccccc !important;
      line-height: 1.5 !important;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
      transition: all 0.3s ease;
      margin-bottom: 6px !important;
    }

    .synopsis-text.expanded {
      display: block !important;
      overflow: visible !important;
    }

    .read-more-btn {
      background: transparent !important;
      border: none !important;
      color: #e50914 !important;
      font-size: 0.82rem !important;
      font-weight: 700 !important;
      cursor: pointer !important;
      padding: 0 !important;
      margin-bottom: 10px !important;
      display: inline-block !important;
    }

    /* SERVER SELECTION BADGES FIX */
    .episodes-section {
      width: 100% !important;
      padding: 16px 20px !important;
      box-sizing: border-box !important;
    }

    .episode-badges-grid {
      display: flex !important;
      flex-direction: row !important;
      align-items: center !important;
      gap: 10px !important;
      margin-top: 10px !important;
    }

    .ep-badge {
      background: #181818 !important;
      border: 1px solid #262626 !important;
      color: #ffffff !important;
      width: 38px !important;
      height: 38px !important;
      border-radius: 8px !important;
      display: flex !important;
      align-items: center !important;
      justify-content: center !important;
      cursor: pointer !important;
      font-weight: 800 !important;
      font-size: 0.9rem !important;
      transition: all 0.2s ease !important;
    }

    .ep-badge.active,
    .ep-badge:hover {
      background: #e50914 !important;
      border-color: #e50914 !important;
    }

    /* RECOMMENDATION CARD LAYOUT */
    .list-recommendations {
      width: 100% !important;
      box-sizing: border-box !important;
    }

    .recommendation-card {
      background: #181818 !important;
      border: 1px solid #262626 !important;
      border-radius: 8px !important;
      overflow: hidden !important;
      cursor: pointer !important;
      transition: transform 0.2s ease, border-color 0.2s ease !important;
    }

    .recommendation-card:hover {
      transform: translateY(-4px) !important;
      border-color: #e50914 !important;
    }

    .recommendation-card img {
      width: 100% !important;
      object-fit: cover !important;
      display: block !important;
    }

    .rec-info {
      padding: 8px !important;
      display: flex !important;
      flex-direction: column !important;
      gap: 2px !important;
    }

    .rec-title {
      font-size: 0.78rem !important;
      font-weight: 700 !important;
      color: #ffffff !important;
      white-space: nowrap !important;
      overflow: hidden !important;
      text-overflow: ellipsis !important;
    }

    .rec-genre {
      font-size: 0.68rem !important;
      color: #aaaaaa !important;
    }

    /* PC MODE ENLARGED CONTROLS OVERRIDES (min-width: 769px) */
    @media (min-width: 769px) {
      .player-top-bar {
        padding: 24px 30px !important;
        gap: 14px !important;
      }

      .icon-btn-back {
        font-size: 1.8rem !important;
      }

      .overlay-title-text {
        font-size: 1.4rem !important;
        font-weight: 800 !important;
      }

      .center-controls-group {
        gap: 40px !important;
      }

      .center-ctrl-btn {
        width: 64px !important;
        height: 64px !important;
      }

      .center-ctrl-btn svg {
        width: 48px !important;
        height: 48px !important;
      }

      .center-ctrl-btn.play-btn-large {
        width: 86px !important;
        height: 86px !important;
      }

      .center-ctrl-btn.play-btn-large svg {
        width: 44px !important;
        height: 44px !important;
      }

      .player-bottom-bar {
        padding: 20px 30px !important;
        gap: 12px !important;
      }

      .progress-bar-wrapper input[type="range"] {
        height: 7px !important;
      }

      .btn-bottom-play {
        width: 34px !important;
        height: 34px !important;
      }

      .btn-bottom-play svg {
        width: 28px !important;
        height: 28px !important;
      }

      .time-display {
        font-size: 1.05rem !important;
        font-weight: 700 !important;
      }

      .right-utility-btns {
        gap: 22px !important;
      }

      .ctrl-btn-small svg {
        width: 28px !important;
        height: 28px !important;
      }

      .media-title {
        font-size: 1.8rem !important;
      }

      .synopsis-text {
        font-size: 1.02rem !important;
      }

      .read-more-btn {
        font-size: 0.95rem !important;
      }

      .episodes-section h3,
      .section-header-title {
        font-size: 1.15rem !important;
      }

      .ep-badge {
        width: 48px !important;
        height: 48px !important;
        font-size: 1.1rem !important;
      }

      .list-recommendations {
        display: flex !important;
        gap: 16px !important;
        overflow-x: auto !important;
        scrollbar-width: none;
        padding-bottom: 10px;
      }

      .list-recommendations::-webkit-scrollbar {
        display: none;
      }

      .recommendation-card {
        flex: 0 0 160px !important;
        width: 160px !important;
      }

      .recommendation-card img {
        height: 230px !important;
      }
    }

    /* MOBILE MODE LAYOUT */
    @media (max-width: 768px) {
      .video-info-box,
      .episodes-section,
      .content-section {
        padding-left: 14px !important;
        padding-right: 14px !important;
      }

      .network-warning-note {
        width: calc(100% - 28px) !important;
        font-size: 0.78rem !important;
      }

      .list-recommendations {
        display: grid !important;
        grid-template-columns: repeat(2, 1fr) !important;
        gap: 10px !important;
      }

      .recommendation-card {
        width: 100% !important;
      }

      .recommendation-card img {
        height: 180px !important;
      }
    }
  </style>

  <!-- ANTI-POPUP & REDIRECT SHIELD -->
  <script>
    (function () {
      'use strict';

      const voidWindow = {
        focus: function () {},
        blur: function () {},
        close: function () {},
        postMessage: function () {},
        closed: true
      };

      try {
        Object.defineProperty(window, 'open', {
          configurable: false,
          writable: false,
          value: function () {
            console.warn('[DEYMFLIX Shield] Blocked window.open popup execution.');
            return voidWindow;
          }
        });
      } catch (e) {
        window.open = function () { return voidWindow; };
      }

      try {
        const origAnchorClick = HTMLAnchorElement.prototype.click;
        HTMLAnchorElement.prototype.click = function () {
          if (this.target === '_blank' || (this.href && !this.href.includes(window.location.hostname))) {
            console.warn('[DEYMFLIX Shield] Blocked anchor programmatic ad click.');
            return false;
          }
          return origAnchorClick.apply(this, arguments);
        };
      } catch (e) {}

      window.onbeforeunload = function (e) {
        if (document.activeElement && document.activeElement.tagName === 'IFRAME') {
          console.warn('[DEYMFLIX Shield] Blocked top-level frame navigation hijack.');
          e.preventDefault();
          return (e.returnValue = 'Ad redirect blocked.');
        }
      };

      document.addEventListener('click', function (e) {
        const a = e.target.closest('a');
        if (a) {
          const href = a.getAttribute('href');
          if (a.target === '_blank' || (href && href.startsWith('http') && !href.includes(window.location.hostname))) {
            e.preventDefault();
            e.stopPropagation();
            console.warn('[DEYMFLIX Shield] Neutralized external link click.');
            return false;
          }
        }
      }, true);

      document.addEventListener('contextmenu', function (e) { e.preventDefault(); });
      document.addEventListener('keydown', function (e) {
        if (
          e.keyCode === 123 || 
          (e.ctrlKey && e.shiftKey && (e.keyCode === 73 || e.keyCode === 74 || e.keyCode === 67)) || 
          (e.ctrlKey && e.keyCode === 85) || 
          (e.metaKey && e.altKey && (e.keyCode === 73 || e.keyCode === 74 || e.keyCode === 67)) || 
          (e.metaKey && e.keyCode === 85)
        ) {
          e.preventDefault();
          return false;
        }
      });
    })();
  </script>
</head>
<body>

  <!-- Video Player Section Container -->
  <div class="video-container" id="playerContainer">
    <video id="direct-video-player" playsinline crossorigin="anonymous" style="display: none;"></video>

    <!-- Custom On-Screen Subtitle Container Overlay -->
    <div id="subtitle-display" class="custom-subtitle-display"></div>

    <!-- Animated Loading Buffer Overlay -->
    <div id="video-loading-spinner" class="loading-spinner-overlay" style="display: none;">
      <div class="spinner-ring"></div>
      <div class="spinner-text">Buffering...</div>
    </div>

    <!-- Ad Shield Overlay -->
    <div id="iframe-ad-shield" class="ultimate-ad-shield" onclick="absorbAdClicks(event)" style="display: none;"></div>

    <div id="player-gesture-overlay" class="player-overlay active">
      <!-- TOP-LEFT BACK HEADER -->
      <div class="player-top-bar" onclick="forceBackToHome()">
        <button id="btn-back-nav" class="icon-btn-back">❮</button>
        <span id="overlay-movie-title" class="overlay-title-text">Loading...</span>
      </div>

      <div id="brightness-slider-container" class="vertical-slider-bar left-bar" style="display: none;">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M12 7c-2.76 0-5 2.24-5 5s2.24 5 5 5 5-2.24 5-5-2.24-5-5-5zM2 13h2c.55 0 1-.45 1-1s-.45-1-1-1H2c-.55 0-1 .45-1 1s.45 1 1 1zm18 0h2c.55 0 1-.45 1-1s-.45-1-1-1h-2c-.55 0-1 .45-1 1s.45 1 1 1zM11 2v2c0 .55.45 1 1 1s1-.45 1-1V2c0-.55-.45-1-1-1s-1 .45-1 1zm0 18v2c0 .55.45 1 1 1s1-.45 1-1v-2c0-.55-.45-1-1-1s-1 .45-1 1z"/></svg>
        <div class="v-track"><div id="brightness-fill" class="v-fill"></div></div>
      </div>

      <div id="volume-slider-container" class="vertical-slider-bar right-bar" style="display: none;">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z"/></svg>
        <div class="v-track"><div id="volume-fill" class="v-fill"></div></div>
      </div>

      <!-- CENTER ICONS -->
      <div id="center-controls" class="center-controls-group">
        <button id="btn-rewind-center" class="center-ctrl-btn" title="Rewind 10s">
          <svg viewBox="0 0 24 24" fill="#ffffff">
            <path d="M12 5V1L7 6l5 5V7c3.31 0 6 2.69 6 6s-2.69 6-6 6-6-2.69-6-6H4c0 4.42 3.58 8 8 8s8-3.58 8-8-3.58-8-8-8z"/>
            <text x="12" y="14.5" font-size="7" font-weight="800" font-family="sans-serif" text-anchor="middle" fill="#ffffff">10</text>
          </svg>
        </button>

        <button id="btn-play-pause-center" class="center-ctrl-btn play-btn-large" title="Play/Pause">
          <svg id="svg-center-play" viewBox="0 0 24 24" fill="#ffffff" style="display:none;"><path d="M8 5v14l11-7z"/></svg>
          <svg id="svg-center-pause" viewBox="0 0 24 24" fill="#ffffff"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
        </button>

        <button id="btn-forward-center" class="center-ctrl-btn" title="Forward 10s">
          <svg viewBox="0 0 24 24" fill="#ffffff">

              <svg id="svg-volume-off" viewBox="0 0 24 24" fill="currentColor" style="display:none;"><path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/></svg>
            </button>

            <!-- FULLSCREEN BUTTON -->
            <button id="btn-fullscreen" class="ctrl-btn-small" title="Fullscreen (F)">
              <svg viewBox="0 0 24 24" fill="currentColor">
                <path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/>

    ⚠️ Slow connection? Reload the page or try another server.
  </div>

  <div class="video-info-box">
    <h1 id="current-title" class="media-title">Loading...</h1>
    <p id="current-description" class="synopsis-text">Loading synopsis...</p>
    <button id="toggle-synopsis-btn" class="read-more-btn" onclick="toggleSynopsis()" style="display: none;">Read More</button>

    <h3 style="font-weight: 700; color: #ffffff; margin-bottom: 8px;">Select Server</h3>

      <div id="server1-btn" class="ep-badge" onclick="switchServer(1)">1</div>
      <div id="server2-btn" class="ep-badge" onclick="switchServer(2)">2</div>
      <div id="server3-btn" class="ep-badge" onclick="switchServer(3)">3</div>
      <div id="server4-btn" class="ep-badge" onclick="switchServer(4)">4</div>
      <div id="server5-btn" class="ep-badge" onclick="switchServer(5)">5</div>
    </div>

  <section class="content-section" style="padding-bottom: 30px;">
    <h3 class="section-header-title" style="margin-bottom: 12px; color: #ffffff;">More Like This</h3>
    <div class="list-recommendations" id="random-grid"></div>
  </section>

  <div id="loading-toast" class="toast-notification">Loading...</div>

  <script src="app.js?v=120.0"></script>
  <script>
    function destroyAllPlayers() {
      window.onbeforeunload = null;
      const dp = document.getElementById('direct-video-player');
      if (dp) {
        dp.pause();
        dp.removeAttribute('src');
        dp.load();
      }
      const fr = document.getElementById('main-iframe');
      if (fr) {
        fr.src = "about:blank";
        fr.remove();
      }
    }

    window.addEventListener('pagehide', destroyAllPlayers);
    window.addEventListener('pageshow', function(event) {
      if (event.persisted) {
        window.location.replace('index.html');
      }
    });

    function forceBackToHome() {
      const isFS = document.fullscreenElement || document.webkitFullscreenElement || document.mozFullScreenElement || document.msFullscreenElement;
      if (isFS) {
        exitFullscreen();
      }
      destroyAllPlayers();
      window.location.replace('index.html');
    }

    function exitFullscreen() {
      if (document.exitFullscreen) {
        document.exitFullscreen();
      } else if (document.webkitExitFullscreen) {
        document.webkitExitFullscreen();
      } else if (document.msExitFullscreen) {
        document.msExitFullscreen();
      }
    }

    const urlParams = new URLSearchParams(window.location.search);
    const movieId = urlParams.get('id');
    const currentMovie = movies.find(m => m.id === movieId) || featuredMovies.find(m => m.id === movieId) || movies[0];

    document.getElementById('current-title').textContent = currentMovie.title;
    document.getElementById('overlay-movie-title').textContent = currentMovie.title;

    const descElement = document.getElementById('current-description');
    const readMoreBtn = document.getElementById('toggle-synopsis-btn');
    const networkNote = document.getElementById('network-note');
    const adShield = document.getElementById('iframe-ad-shield');
    const loadingSpinner = document.getElementById('video-loading-spinner');
    const centerControlsGroup = document.getElementById('center-controls');
    const btnSubtitles = document.getElementById('btn-subtitles');
    const subtitleMenu = document.getElementById('subtitle-menu');
    const subtitleOptionsContainer = document.getElementById('subtitle-options-container');
    const subtitleDisplay = document.getElementById('subtitle-display');

    let absorbedClicks = 0;
    const clickLimit = 3;
    let availableSubtitles = {}; 
    let parsedSubtitleCues = [];

    const languageNames = {
      'en': 'English',
      'es': 'Spanish',
      'fr': 'French',
      'de': 'German',
      'tl': 'Tagalog'
    };

    function absorbAdClicks(e) {
      e.stopPropagation();
      e.preventDefault();
      absorbedClicks++;
      
      if (absorbedClicks >= clickLimit) {
        adShield.style.display = 'none';
      }
    }

    /* ENHANCED SYNOPSIS TOGGLE LOGIC */
    function checkSynopsisLength() {
      setTimeout(() => {
        if (descElement.scrollHeight > descElement.clientHeight || descElement.textContent.length > 150) {
          readMoreBtn.style.display = 'inline-block';
        } else {
          readMoreBtn.style.display = 'none';
        }
      }, 50);
    }

    function toggleSynopsis() {
      if (descElement.classList.contains('expanded')) {
        descElement.classList.remove('expanded');
        readMoreBtn.textContent = 'Read More';
      } else {
        descElement.classList.add('expanded');
        readMoreBtn.textContent = 'Show Less';
      }
    }

    async function loadBroadSynopsis() {
      if (currentMovie.description && currentMovie.description.trim() !== '') {
        descElement.textContent = currentMovie.description;
        checkSynopsisLength();
        return;
      }

      if (currentMovie.synopsis && currentMovie.synopsis.trim() !== '') {
        descElement.textContent = currentMovie.synopsis;
        checkSynopsisLength();
        return;
      }

      const apiKey = '15d260044e350723365198253b23914f';

      if (currentMovie.tmdbId) {
        try {
          const tmdbRes = await fetch(`https://api.themoviedb.org/3/movie/${currentMovie.tmdbId}?api_key=${apiKey}&language=en-US`);
          if (tmdbRes.ok) {
            const tmdbData = await tmdbRes.json();
            if (tmdbData.overview && tmdbData.overview.trim() !== '') {
              descElement.textContent = tmdbData.overview;
              checkSynopsisLength();
              return;
            }
          }
        } catch (e) {}
      }

      try {
        const cleanTitle = currentMovie.title.replace(/[\(\)\[\]]/g, '').trim();
        const searchRes = await fetch(`https://api.themoviedb.org/3/search/movie?api_key=${apiKey}&query=${encodeURIComponent(cleanTitle)}`);
        if (searchRes.ok) {
          const searchData = await searchRes.json();
          const match = searchData.results && searchData.results.find(r => r.overview && r.overview.trim() !== '');
          if (match) {
            descElement.textContent = match.overview;
            checkSynopsisLength();
            return;
          }
        }
      } catch (e) {}

      const originTag = currentMovie.isFilipino ? "Filipino movie" : "feature movie";
      descElement.textContent = `Watch "${currentMovie.title}", a ${originTag} available in high quality streaming on DEYMFLIX.`;
      checkSynopsisLength();
    }

    loadBroadSynopsis();

    function timeToSeconds(timeStr) {
      if (!timeStr) return 0;
      const parts = timeStr.trim().replace(',', '.').split(':');
      if (parts.length < 3) return 0;
      return parseFloat(parts[0]) * 3600 + parseFloat(parts[1]) * 60 + parseFloat(parts[2]);
    }

    function parseSrtCues(srtText) {
      const cues = [];
      const blocks = srtText.trim().replace(/\r\n|\r/g, '\n').split('\n\n');

      blocks.forEach(block => {
        const lines = block.split('\n');
        if (lines.length >= 2) {
          let timeLine = lines[0].includes('-->') ? lines[0] : lines[1];
          let textLines = lines[0].includes('-->') ? lines.slice(1) : lines.slice(2);

          if (timeLine && timeLine.includes('-->')) {
            const times = timeLine.split('-->');
            const start = timeToSeconds(times[0]);
            const end = timeToSeconds(times[1]);
            const text = textLines.join('<br>').replace(/<[^>]*>/g, '');

            if (text.trim() !== '') {
              cues.push({ start, end, text });
            }
          }
        }
      });
      return cues;
    }

    async function scanOnlineSubtitles() {
      availableSubtitles = {};
      const targetLangs = ['en', 'es', 'fr', 'de', 'tl'];
      const apiKey = '15d260044e350723365198253b23914f';

      let imdbId = null;

      if (currentMovie.tmdbId) {
        try {
          const tmdbRes = await fetch(`https://api.themoviedb.org/3/movie/${currentMovie.tmdbId}/external_ids?api_key=${apiKey}`);
          if (tmdbRes.ok) {
            const tmdbData = await tmdbRes.json();
            imdbId = tmdbData.imdb_id;
          }
        } catch (e) {}
      }

      if (!imdbId) {
        try {
          const cleanTitle = currentMovie.title.replace(/[\(\)\[\]]/g, '').trim();
          const searchRes = await fetch(`https://api.themoviedb.org/3/search/movie?api_key=${apiKey}&query=${encodeURIComponent(cleanTitle)}`);
          if (searchRes.ok) {
            const searchData = await searchRes.json();
            if (searchData.results && searchData.results.length > 0) {
              const matchedTmdbId = searchData.results[0].id;
              const idRes = await fetch(`https://api.themoviedb.org/3/movie/${matchedTmdbId}/external_ids?api_key=${apiKey}`);
              if (idRes.ok) {
                const idData = await idRes.json();
                imdbId = idData.imdb_id;
              }
            }
          }
        } catch (e) {}
      }

      if (!imdbId) {
        renderSubtitleMenu();
        return;
      }

      const scanPromises = targetLangs.map(async (lang) => {
        try {
          const subUrl = `https://sub.vyndev.workers.dev/?imdb=${imdbId}&lang=${lang}`;
          const res = await fetch(subUrl);
          if (res.ok) {
            const srtText = await res.text();
            if (srtText && srtText.includes('-->')) {
              availableSubtitles[lang] = srtText;
            }
          }
        } catch (err) {}
      });

      await Promise.all(scanPromises);
      renderSubtitleMenu();
    }

    function renderSubtitleMenu() {
      subtitleOptionsContainer.innerHTML = '';
      const foundLangs = Object.keys(availableSubtitles);

      if (foundLangs.length === 0) {
        subtitleOptionsContainer.innerHTML = `<div class="subtitle-option disabled-option">No subtitles found</div>`;
        btnSubtitles.style.opacity = '0.5';
        return;
      }

      btnSubtitles.style.opacity = '1';

      let menuHtml = `<div id="sub-opt-off" class="subtitle-option selected" onclick="selectSubtitleLanguage('off', event)">Off</div>`;

      foundLangs.forEach(lang => {
        const name = languageNames[lang] || lang.toUpperCase();
        menuHtml += `<div id="sub-opt-${lang}" class="subtitle-option" onclick="selectSubtitleLanguage('${lang}', event)">${name}</div>`;
      });

      subtitleOptionsContainer.innerHTML = menuHtml;
    }

    function selectSubtitleLanguage(langCode, e) {
      if (e) e.stopPropagation();

      subtitleMenu.style.display = 'none';
      parsedSubtitleCues = [];
      subtitleDisplay.innerHTML = '';

      document.querySelectorAll('.subtitle-option').forEach(opt => opt.classList.remove('selected'));

      if (langCode === 'off') {
        const offOpt = document.getElementById('sub-opt-off');
        if (offOpt) offOpt.classList.add('selected');
        btnSubtitles.classList.remove('subtitle-active-btn');
        showToast("Subtitles: Off");
        return;
      }

      const targetOpt = document.getElementById(`sub-opt-${langCode}`);
      if (targetOpt) targetOpt.classList.add('selected');

      const rawSrt = availableSubtitles[langCode];
      if (rawSrt) {
        parsedSubtitleCues = parseSrtCues(rawSrt);
        btnSubtitles.classList.add('subtitle-active-btn');
        showToast(`Subtitles: ${languageNames[langCode] || langCode.toUpperCase()}`);
      } else {
        showToast(`No subtitles found`);
      }
    }

    scanOnlineSubtitles();

    btnSubtitles.onclick = (e) => {
      e.stopPropagation();
      if (subtitleMenu.style.display === 'none' || subtitleMenu.style.display === '') {
        subtitleMenu.style.display = 'flex';
        showControls();
      } else {
        subtitleMenu.style.display = 'none';
      }
    };

    let iframe = null;
    const directPlayer = document.getElementById('direct-video-player');
    const playerContainer = document.getElementById('playerContainer');
    const playerOverlay = document.getElementById('player-gesture-overlay');

    const btnPlayPauseCenter = document.getElementById('btn-play-pause-center');
    const btnBottomPlayPause = document.getElementById('btn-bottom-play-pause');

    const svgCenterPlay = document.getElementById('svg-center-play');
    const svgCenterPause = document.getElementById('svg-center-pause');

    const svgBottomPlay = document.getElementById('svg-bottom-play');
    const svgBottomPause = document.getElementById('svg-bottom-pause');

    const btnRewind = document.getElementById('btn-rewind-center');
    const btnForward = document.getElementById('btn-forward-center');
    const btnUnmute = document.getElementById('btn-unmute');
    const btnFullscreen = document.getElementById('btn-fullscreen');

    const seekbar = document.getElementById('video-seekbar');
    const currentTimeText = document.getElementById('current-time-text');
    const totalDurationText = document.getElementById('total-duration-text');

    const svgVolumeOn = document.getElementById('svg-volume-on');
    const svgVolumeOff = document.getElementById('svg-volume-off');

    const rewindBadge = document.getElementById('rewind-badge');
    const forwardBadge = document.getElementById('forward-badge');

    const brightnessContainer = document.getElementById('brightness-slider-container');
    const brightnessFill = document.getElementById('brightness-fill');
    const volumeContainer = document.getElementById('volume-slider-container');
    const volumeFill = document.getElementById('volume-fill');

    const s1Btn = document.getElementById('server1-btn');
    const s2Btn = document.getElementById('server2-btn');
    const s3Btn = document.getElementById('server3-btn');
    const s4Btn = document.getElementById('server4-btn');
    const s5Btn = document.getElementById('server5-btn');

    let toastTimeout;
    let slowConnectionTimer = null;
    let autoHideTimer = null;
    let currentBrightness = 100;
    let activeServer = 1;
    let lastTapTime = 0;

    function updateSeekbarBackground(val) {
      seekbar.style.background = `linear-gradient(to right, #e50914 0%, #e50914 ${val}%, rgba(255, 255, 255, 0.3) ${val}%, rgba(255, 255, 255, 0.3) 100%)`;
    }

    function showControls() {
      if (activeServer !== 1) return;

      playerOverlay.classList.add('active');
      clearTimeout(autoHideTimer);

      autoHideTimer = setTimeout(() => {
        if (subtitleMenu.style.display !== 'flex') {
          hideControls();
        }
      }, 2500);
    }

    function hideControls() {
      playerOverlay.classList.remove('active');
      subtitleMenu.style.display = 'none';
    }

    function toggleOverlayControls(e) {
      if (activeServer !== 1) return;
      if (subtitleMenu.contains(e.target) || e.target === btnSubtitles) return;

      const now = Date.now();
      if (now - lastTapTime < 300) {
        e.preventDefault();
        return;
      }
      lastTapTime = now;

      if (e.target === playerOverlay) {
        if (playerOverlay.classList.contains('active')) {
          hideControls();
          clearTimeout(autoHideTimer);
        } else {
          showControls();
        }
      } else {
        showControls();
      }
    }

    playerOverlay.addEventListener('touchend', (e) => {
      if (!isGestureDragging) {
        toggleOverlayControls(e);
      }
    });

    playerOverlay.addEventListener('click', (e) => {
      if (!('ontouchstart' in window)) {
        toggleOverlayControls(e);
      }
    });

    playerContainer.addEventListener('mousemove', () => { if (activeServer === 1) showControls(); });

    let touchStartY = 0;
    let isGestureDragging = false;
    let gestureType = null;
    let sliderHideTimer = null;

    playerOverlay.addEventListener('touchstart', (e) => {
      if (activeServer !== 1) return;
      const isFS = document.fullscreenElement || document.webkitFullscreenElement || document.mozFullScreenElement || document.msFullscreenElement;
      if (e.touches.length === 1 && isFS) {
        touchStartY = e.touches[0].clientY;
        const screenWidth = window.innerWidth;
        gestureType = e.touches[0].clientX < screenWidth / 2 ? 'brightness' : 'volume';
        isGestureDragging = false;
      }
    }, { passive: true });

    playerOverlay.addEventListener('touchmove', (e) => {
      if (activeServer !== 1 || e.touches.length !== 1) return;

      const currentY = e.touches[0].clientY;
      const deltaY = touchStartY - currentY;
      
      if (Math.abs(deltaY) > 8) {
        isGestureDragging = true;
      }

      if (!isGestureDragging) return;

      touchStartY = currentY;
      clearTimeout(sliderHideTimer);

      if (gestureType === 'brightness') {
        currentBrightness = Math.max(20, Math.min(150, currentBrightness + (deltaY * 0.5)));
        directPlayer.style.filter = `brightness(${currentBrightness}%)`;
        brightnessFill.style.height = `${((currentBrightness - 20) / 130) * 100}%`;
        brightnessContainer.style.display = 'flex';
      } else if (gestureType === 'volume') {
        let newVol = Math.max(0, Math.min(1, directPlayer.volume + (deltaY * 0.005)));
        directPlayer.volume = newVol;
        directPlayer.muted = newVol === 0;
        volumeFill.style.height = `${newVol * 100}%`;
        volumeContainer.style.display = 'flex';
      }
    }, { passive: true });

    playerOverlay.addEventListener('touchend', () => {
      if (activeServer !== 1) return;
      sliderHideTimer = setTimeout(() => {
        brightnessContainer.style.display = 'none';
        volumeContainer.style.display = 'none';
        isGestureDragging = false;
      }, 1000);
    });

    /* HIDE CENTER PLAY/PAUSE WHILE BUFFERING */
    function showLoadingSpinner() {
      loadingSpinner.style.display = 'flex';
      centerControlsGroup.style.setProperty('display', 'none', 'important');
    }

    function hideLoadingSpinner() {
      loadingSpinner.style.display = 'none';
      networkNote.style.display = 'none';
      clearTimeout(slowConnectionTimer);
      centerControlsGroup.style.setProperty('display', 'flex', 'important');
    }

    function startSlowConnectionCheck() {
      clearTimeout(slowConnectionTimer);
      showLoadingSpinner();

      slowConnectionTimer = setTimeout(() => {
        if (directPlayer.paused || directPlayer.readyState < 3) {
          networkNote.style.display = 'block';
        }
      }, 3500);
    }

    function showToast(message) {
      const toast = document.getElementById('loading-toast');
      if (toast) {
        toast.textContent = message;
        toast.classList.add('show');

        clearTimeout(toastTimeout);
        toastTimeout = setTimeout(() => {
          toast.classList.remove('show');
        }, 1500);
      }
    }

    function formatTime(seconds) {
      if (isNaN(seconds)) return "00:00:00";
      const hrs = Math.floor(seconds / 3600);
      const mins = Math.floor((seconds % 3600) / 60);
      const secs = Math.floor(seconds % 60);

      const hStr = hrs < 10 ? `0${hrs}` : hrs;
      const mStr = mins < 10 ? `0${mins}` : mins;
      const sStr = secs < 10 ? `0${secs}` : secs;

      return `${hStr}:${mStr}:${sStr}`;
    }

    directPlayer.addEventListener('loadstart', showLoadingSpinner);
    directPlayer.addEventListener('waiting', startSlowConnectionCheck);
    directPlayer.addEventListener('stalled', startSlowConnectionCheck);
    directPlayer.addEventListener('seeking', showLoadingSpinner);
    directPlayer.addEventListener('canplay', hideLoadingSpinner);
    directPlayer.addEventListener('playing', () => {
      hideLoadingSpinner();
      svgCenterPlay.style.display = 'none';
      svgCenterPause.style.display = 'block';
      svgBottomPlay.style.display = 'none';
      svgBottomPause.style.display = 'block';
      if (activeServer === 1) showControls();
    });

    directPlayer.addEventListener('loadedmetadata', () => {
      totalDurationText.textContent = formatTime(directPlayer.duration);
    });

    directPlayer.addEventListener('timeupdate', () => {
      if (!isNaN(directPlayer.duration)) {
        const currentTime = directPlayer.currentTime;
        const pct = (currentTime / directPlayer.duration) * 100;
        seekbar.value = pct;
        updateSeekbarBackground(pct);
        currentTimeText.textContent = formatTime(currentTime);

        if (parsedSubtitleCues.length > 0) {
          const activeCue = parsedSubtitleCues.find(cue => currentTime >= cue.start && currentTime <= cue.end);
          if (activeCue) {
            subtitleDisplay.innerHTML = `<span class="subtitle-line">${activeCue.text}</span>`;
          } else {
            subtitleDisplay.innerHTML = '';
          }
        } else {
          subtitleDisplay.innerHTML = '';
        }
      }
    });

    seekbar.addEventListener('input', () => {
      if (!isNaN(directPlayer.duration)) {
        directPlayer.currentTime = (seekbar.value / 100) * directPlayer.duration;
        updateSeekbarBackground(seekbar.value);
      }
    });

    directPlayer.addEventListener('pause', () => {
      hideLoadingSpinner();
      svgCenterPlay.style.display = 'block';
      svgCenterPause.style.display = 'none';
      svgBottomPlay.style.display = 'block';
      svgBottomPause.style.display = 'none';
      if (activeServer === 1) {
        playerOverlay.classList.add('active');
        clearTimeout(autoHideTimer);
      }
    });

    function togglePlayPause() {
      if (directPlayer.paused) {
        directPlayer.play();
      } else {
        directPlayer.pause();
      }
    }

    function toggleMute() {
      directPlayer.muted = !directPlayer.muted;
      svgVolumeOn.style.display = directPlayer.muted ? 'none' : 'block';
      svgVolumeOff.style.display = directPlayer.muted ? 'block' : 'none';
    }

    function attemptAutoUnmute() {
      directPlayer.muted = false;
      directPlayer.play().then(() => {
        svgVolumeOn.style.display = 'block';
        svgVolumeOff.style.display = 'none';
      }).catch(() => {
        directPlayer.muted = true;
        svgVolumeOn.style.display = 'none';
        svgVolumeOff.style.display = 'block';
        directPlayer.play();

        const unlockAudio = () => {
          directPlayer.muted = false;
          svgVolumeOn.style.display = 'block';
          svgVolumeOff.style.display = 'none';
          document.removeEventListener('click', unlockAudio);
          document.removeEventListener('touchstart', unlockAudio);
        };
        document.addEventListener('click', unlockAudio, { once: true });
        document.addEventListener('touchstart', unlockAudio, { once: true });
      });
    }

    btnPlayPauseCenter.onclick = (e) => {
      e.stopPropagation();
      togglePlayPause();
    };

    btnBottomPlayPause.onclick = (e) => {
      e.stopPropagation();
      togglePlayPause();
    };

    btnRewind.onclick = (e) => {
      e.stopPropagation();
      triggerRewind();
    };

    btnForward.onclick = (e) => {
      e.stopPropagation();
      triggerForward();
    };

    btnUnmute.onclick = (e) => {
      e.stopPropagation();
      toggleMute();
    };

    btnFullscreen.onclick = (e) => {
      e.stopPropagation();
      toggleFullscreen();
    };

    function toggleFullscreen() {
      const isFS = document.fullscreenElement || document.webkitFullscreenElement || document.mozFullScreenElement || document.msFullscreenElement;

      if (!isFS) {
        if (playerContainer.requestFullscreen) {
          playerContainer.requestFullscreen();
        } else if (playerContainer.webkitRequestFullscreen) {
          playerContainer.webkitRequestFullscreen();
        } else if (playerContainer.msRequestFullscreen) {
          playerContainer.msRequestFullscreen();
        } else if (directPlayer.webkitEnterFullscreen) {
          directPlayer.webkitEnterFullscreen();
        }
      } else {
        exitFullscreen();
      }
    }

    function triggerRewind() {
      directPlayer.currentTime = Math.max(0, directPlayer.currentTime - 10);
      showSeekBadge(rewindBadge);
    }

    function triggerForward() {
      directPlayer.currentTime = Math.min(directPlayer.duration || 0, directPlayer.currentTime + 10);
      showSeekBadge(forwardBadge);
    }

    function showSeekBadge(badge) {
      badge.classList.add('show');
      setTimeout(() => badge.classList.remove('show'), 600);
    }

    function renderFreshIframe(targetUrl) {
      let existingIframe = document.getElementById('main-iframe');
      if (existingIframe) {
        existingIframe.remove();
      }

      absorbedClicks = 0;
      adShield.style.display = 'block';
      showLoadingSpinner();

      const newIframe = document.createElement('iframe');
      newIframe.id = 'main-iframe';
      newIframe.allowFullscreen = true;
      newIframe.allow = "autoplay; fullscreen *; picture-in-picture *";
      
      newIframe.setAttribute('sandbox', 'allow-scripts allow-same-origin allow-forms allow-presentation');

      newIframe.style.width = '100%';
      newIframe.style.height = '100%';
      newIframe.style.border = 'none';
      newIframe.style.display = 'block';
      newIframe.src = targetUrl;

      newIframe.addEventListener('load', () => {
        hideLoadingSpinner();
      });

      playerContainer.appendChild(newIframe);
      iframe = newIframe;
    }

    function switchServer(serverNum) {
      activeServer = serverNum;
      [s1Btn, s2Btn, s3Btn, s4Btn, s5Btn].forEach(btn => btn.classList.remove('active'));

      startSlowConnectionCheck();

      let targetUrl = "";

      if (serverNum === 1) {
        adShield.style.display = 'none';
        targetUrl = cleanDriveLink(currentMovie.manualEmbed);
        s1Btn.classList.add('active');

        const lowerUrl = targetUrl.toLowerCase();
        if (lowerUrl.includes('.mp4') || lowerUrl.includes('.mkv')) {
          const oldIframe = document.getElementById('main-iframe');
          if (oldIframe) oldIframe.remove();

          directPlayer.style.display = 'block';
          playerOverlay.style.display = 'flex';
          directPlayer.src = targetUrl;
          
          attemptAutoUnmute();
          showControls();
          showToast(`Server 1 loading...`);
          return;
        }
      } 
      
      directPlayer.pause();
      directPlayer.removeAttribute('src');
      directPlayer.load();
      directPlayer.style.display = 'none';
      playerOverlay.style.display = 'none';
      playerOverlay.classList.remove('active');
      subtitleDisplay.innerHTML = '';
      clearTimeout(autoHideTimer);

      if (serverNum === 2) {
        targetUrl = `https://vidsrc.me/embed/movie?tmdb=${currentMovie.tmdbId}`;
        s2Btn.classList.add('active');
      } else if (serverNum === 3) {
        targetUrl = `https://vidsrc.pm/embed/movie/${currentMovie.tmdbId}`;
        s3Btn.classList.add('active');
      } else if (serverNum === 4) {
        targetUrl = `https://vidbinge.dev/embed/movie/${currentMovie.tmdbId}`;
        s4Btn.classList.add('active');
      } else if (serverNum === 5) {
        targetUrl = `https://www.2embed.cc/embed/${currentMovie.tmdbId}`;
        s5Btn.classList.add('active');
      }

      showToast(`Server ${serverNum} loading...`);
      renderFreshIframe(targetUrl);
    }

    if (currentMovie.manualEmbed && currentMovie.manualEmbed.trim() !== '') {
      s1Btn.style.display = 'flex';
      switchServer(1);
    } else {
      s1Btn.style.display = 'none';
      switchServer(2);
    }

    const grid = document.getElementById('random-grid');
    const otherMovies = movies.filter(m => m.id !== currentMovie.id);
    const shuffled = [...otherMovies].sort(() => 0.5 - Math.random());

    shuffled.slice(0, 10).forEach(movie => {
      const card = document.createElement('div');
      card.className = 'recommendation-card';
      card.onclick = () => window.location.href = `player.html?id=${encodeURIComponent(movie.id)}`;
      card.innerHTML = `
        <img src="${movie.poster}" alt="${movie.title}">
        <div class="rec-info">
          <span class="rec-title">${movie.title}</span>
          <span class="rec-genre">Movie • HD</span>
        </div>
      `;
      grid.appendChild(card);
    });

    function handleFullscreenChange() {
      const isFullscreen = document.fullscreenElement || document.webkitFullscreenElement || document.mozFullScreenElement || document.msFullscreenElement;
      
      if (isFullscreen) {
        if (screen.orientation && screen.orientation.lock) {
          screen.orientation.lock('landscape').catch(() => {});
        }
      } else {
        if (screen.orientation && screen.orientation.unlock) {
          screen.orientation.unlock();
        }
      }
    }

    document.addEventListener('fullscreenchange', handleFullscreenChange);
    document.addEventListener('webkitfullscreenchange', handleFullscreenChange);
    document.addEventListener('mozfullscreenchange', handleFullscreenChange);
    document.addEventListener('MSFullscreenChange', handleFullscreenChange);
  </script>
</body>
</html>
