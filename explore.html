    body { padding-top: 80px !important; padding-bottom: calc(100px + env(safe-area-inset-bottom, 0px)) !important; }

    .explore-search-wrapper {
      padding: 0 16px 12px;
    }

    .explore-search-bar {
      display: flex;
      align-items: center;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.1);

      border: none;
      outline: none;
      color: #fff;
      font-size: 0.92rem;
      font-weight: 500;
    }
    .explore-search-bar input::placeholder {
      color: rgba(255,255,255,0.35);
    }
    .explore-search-clear {
      background: none;
      border: none;
      color: rgba(255,255,255,0.5);
      font-size: 1.1rem;
      cursor: pointer;
      display: none;
      padding: 0 4px;

    .explore-search-clear.visible { display: block; }

    .explore-tabs {
      display: flex;
      gap: 0;
      overflow-x: auto;

      position: sticky;
      top: 0;
      left: 0;
      right: 0;
      z-index: 900;
    }
    .explore-tabs::-webkit-scrollbar { display: none; }

    .explore-tab {
      flex: 1 1 auto;
      /* labels can never clip — if five tabs outgrow the screen, the row
         scrolls horizontally instead of squashing the text */
      min-width: max-content;
      padding: 14px 8px;
      text-align: center;
      font-size: 0.78rem;
      font-weight: 700;
      color: rgba(255,255,255,0.5);
      cursor: pointer;
      border: none;
      background: transparent;
      border-bottom: 3px solid transparent;
      transition: all 0.25s ease;
      white-space: nowrap;
    }
    .explore-tab.active {
      color: #e50914;
      border-bottom-color: #e50914;
    }
    .explore-tab:hover { color: rgba(255,255,255,0.8); }
    .explore-tab .tab-count {
      font-size: 0.65rem;
      opacity: 0.5;
      margin-left: 4px;
    }
    /* phones: tighten the five tabs so Movies/Tagalog/K-Drama/Chinese/Reels
       all breathe on a narrow screen */
    @media (max-width: 480px) {
      .explore-tab { padding: 13px 6px; font-size: 0.72rem; }
    }

    .explore-content { padding: 16px; }
    .explore-section { display: none; }
    .explore-section.active { display: block; }

    .explore-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
      gap: 14px;
    }
    @media (min-width: 768px) { .explore-grid { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 14px; } }
    @media (min-width: 1024px) { .explore-grid { grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 22px; } }

    .explore-card {
      position: relative;
      border-radius: 8px;
      overflow: hidden;
      cursor: pointer;
      aspect-ratio: 2/3;
      background: #1a1a1a;
      transition: transform 0.2s;
    }
    .explore-card:active { transform: scale(0.96); }
    .explore-card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .explore-card-overlay {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 8px;
      background: linear-gradient(transparent, rgba(0,0,0,0.85));
    }
    .explore-card-title {
      font-size: 0.72rem;
      font-weight: 700;
      color: #fff;
      line-height: 1.2;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .explore-card-badge {
      position: absolute;
      top: 6px;
      left: 6px;
      background: #e50914;
      color: #fff;
      font-size: 0.6rem;
      font-weight: 800;
      padding: 2px 6px;
      border-radius: 4px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .explore-card-badge.series { background: #1a73e8; }
    .explore-card-badge.trailer { background: #ff9800; }
    .explore-card-badge.reel { background: #9c27b0; }
    /* the series gained episodes since your last visit */
    .explore-card-badge.new-ep {
      background: linear-gradient(135deg, var(--primary-red, #e50914), #7a0409);
      border: 1px solid rgba(255, 255, 255, 0.35);
    }

    .explore-empty {

    .explore-empty-icon { font-size: 3rem; margin-bottom: 12px; }
    .explore-empty p { font-size: 0.9rem; line-height: 1.5; }

      font-size: 1.1rem;
      margin-bottom: 14px;

  <script>
    let exploreActiveTab = 'movies';
    let exploreSearchQuery = '';

    // ── CATEGORIZE CONTENT ──
    function getCategorizedContent() {
      const movieList = typeof movies !== 'undefined' ? movies : [];
      const reelsList = typeof aiReelsData !== 'undefined' ? aiReelsData : [];

      const allMovies = movieList.filter(m => !m.isSeries && !m.isFilipino && !m.isKdrama && !m.isChinese);
      const tagalogMovies = movieList.filter(m => m.isFilipino);
      const kdramaSeries = movieList.filter(m => m.isKdrama);
      const chineseTitles = movieList.filter(m => m.isChinese);
      const reels = reelsList;

      return { allMovies, tagalogMovies, kdramaSeries, chineseTitles, reels };
    }

    // ── SEARCH ──
    function filterBySearch(items, query) {
      if (!query) return items;
      const q = query.toLowerCase();
      return items.filter(item => {
        const title = (item.title || '').toLowerCase();
        const author = (item.author || '').toLowerCase();
        return title.includes(q) || author.includes(q);
      });
    }

    function handleExploreSearch(value) {
      exploreSearchQuery = value.trim();
      const clearBtn = document.getElementById('searchClearBtn');
      if (clearBtn) clearBtn.classList.toggle('visible', exploreSearchQuery.length > 0);
      renderExploreContent();
    }

    function clearExploreSearch() {
      const input = document.getElementById('exploreSearchInput');
      if (input) input.value = '';
      exploreSearchQuery = '';
      document.getElementById('searchClearBtn').classList.remove('visible');
      renderExploreContent();
    }

    // ── TABS ──
    function switchExploreTab(tab) {
      exploreActiveTab = tab;
      document.querySelectorAll('.explore-tab').forEach(t => t.classList.remove('active'));
      document.querySelector(`[data-tab="${tab}"]`).classList.add('active');
      renderExploreContent();
    }

    // ── RENDER ──
    function renderExploreContent() {
      const container = document.getElementById('explore-content');
      const { allMovies, tagalogMovies, kdramaSeries, chineseTitles, reels } = getCategorizedContent();

      // When searching, search across ALL categories and show combined results
      if (exploreSearchQuery) {
        const allItems = [
          ...allMovies.map(m => ({ ...m, _type: 'movie' })),
          ...tagalogMovies.map(m => ({ ...m, _type: 'tagalog' })),
          ...kdramaSeries.map(m => ({ ...m, _type: 'kdrama' })),
          ...chineseTitles.map(m => ({ ...m, _type: 'chinese' })),
          ...reels.map(r => ({ ...r, _type: 'reel' }))
        ];
        const results = filterBySearch(allItems, exploreSearchQuery);

        if (results.length === 0) {
          container.innerHTML = `<div class="explore-empty"><div class="explore-empty-icon">🔍</div><p>No results for "${sanitizeHTML(exploreSearchQuery)}"<br>Try a different search term.</p></div>`;
          return;
        }

        container.innerHTML = `<div class="explore-grid">${results.map(item => renderExploreCard(item, item._type)).join('')}</div>`;
        return;
      }

      // Tab-based view
      let items, badgeType, emptyIcon, emptyText;

      switch (exploreActiveTab) {
        case 'movies':
          items = allMovies;
          badgeType = '';
          emptyIcon = '🎬';
          emptyText = 'No movies yet.<br>Add movies to app.js to see them here.';
          break;
        case 'tagalog':
          items = tagalogMovies;
          badgeType = '🇵🇭';
          emptyIcon = '🇵🇭';
          emptyText = 'No Tagalog movies yet.<br>Add Filipino movies with isFilipino: true.';
          break;
        case 'kdrama':
          items = kdramaSeries;
          badgeType = '🇰🇷';
          emptyIcon = '🇰🇷';
          emptyText = 'No K-Dramas yet.<br>Add Korean series to kdramas.js with isKdrama: true.';
          break;
        case 'chinese':
          items = chineseTitles;
          badgeType = '🇨🇳';
          emptyIcon = '🇨🇳';
          emptyText = 'No Chinese titles yet.<br>Add Chinese movies/series to chinese-movies.js with isChinese: true.';
          break;
        case 'reels':
          items = reels;
          badgeType = '';
          emptyIcon = '🎞️';
          emptyText = 'No reels yet.<br>Add reels to reels-data.js to see them here.';
          break;
      }

      if (!items || items.length === 0) {
        container.innerHTML = `<div class="explore-empty"><div class="explore-empty-icon">${emptyIcon}</div><p>${emptyText}</p></div>`;
        return;
      }

      const type = exploreActiveTab === 'reels' ? 'reel' : (exploreActiveTab === 'tagalog' ? 'tagalog' : (exploreActiveTab === 'kdrama' ? 'kdrama' : (exploreActiveTab === 'chinese' ? 'chinese' : 'movie')));
      container.innerHTML = `<div class="explore-grid">${items.map(item => renderExploreCard(item, type)).join('')}</div>`;
    }

    function renderExploreCard(item, type) {
      const poster = item.poster || '';
      const title = item.title || '';
      const id = item.id || '';
      const isSeries = item.isSeries === true;
      // cos: links are CinemaOS embeds — playable like any manualEmbed
      const hasEmbed = !!(item.manualEmbed && (item.manualEmbed.startsWith('http') || item.manualEmbed.startsWith('cos:')));
      const hasTrailer = !!(item.trailerEmbed && (item.trailerEmbed.startsWith('http') || item.trailerEmbed.startsWith('cos:')));

      let href, badge = '';

      if (type === 'reel') {
        href = `reels.html?id=${encodeURIComponent(id)}`;
        badge = '<span class="explore-card-badge reel">Reel</span>';
      } else if (isSeries) {
        href = `player.html?id=${encodeURIComponent(id)}`;
        badge = '<span class="explore-card-badge series">Series</span>';
      } else if (hasEmbed) {
        href = `player.html?id=${encodeURIComponent(id)}`;
        badge = '<span class="explore-card-badge">HD</span>';
      } else if (hasTrailer) {
        href = `player.html?id=${encodeURIComponent(id)}`;
        badge = '<span class="explore-card-badge trailer">Trailer</span>';
      } else {
        href = `player.html?id=${encodeURIComponent(id)}`;
      }

      // NEW EP outranks the status chip: the series gained episodes since the
      // viewer's last visit (needs episode data on the page — skipped safely
      // when episodes.js is not loaded).
      if (typeof dfxIsNewEpisodes === 'function' && dfxIsNewEpisodes(item)) {
        badge = '<span class="explore-card-badge new-ep">NEW EP</span>';
      }

      return `
        <div class="explore-card" onclick="window.location.href='${href}'">
          <img src="${sanitizeHTML(poster)}" srcset="${typeof posterSrcset === 'function' ? posterSrcset(poster) : ''}" sizes="(min-width: 1024px) 190px, 140px" alt="${sanitizeHTML(title)}" loading="lazy" decoding="async">
          ${badge}
          <div class="explore-card-overlay">
            <div class="explore-card-title">${sanitizeHTML(title)}</div>
          </div>
        </div>
      `;
    }

    // ── UPDATE TAB COUNTS ──
    function updateTabCounts() {
      // Counts removed by design — tabs show labels only
      const tabs = document.querySelectorAll('.explore-tab');
      tabs.forEach(tab => {
        const existing = tab.querySelector('.tab-count');
        if (existing) existing.remove();
      });
    }

    // ── INIT ──
    document.addEventListener('DOMContentLoaded', () => {
      updateTabCounts();
      renderExploreContent();
    });

    // Hover previews on the explore grid (same panel as the home rows). The
    // cards are .explore-card, so app.js's binder is told to re-scan after
    // every (re)render, including tab switches.
    function dfxBindPreviews() {
      if (typeof HOVER_PREVIEW !== 'undefined' && HOVER_PREVIEW.refresh) HOVER_PREVIEW.refresh();
    }
    if (typeof HOVER_PREVIEW !== 'undefined' && HOVER_PREVIEW.refresh) {
      setTimeout(dfxBindPreviews, 250);
    }
    document.addEventListener('click', function (e) {
      if (e.target.closest && e.target.closest('.explore-tab')) {
        setTimeout(function () {
          if (typeof HOVER_PREVIEW !== 'undefined' && HOVER_PREVIEW.refresh) HOVER_PREVIEW.refresh();
        }, 250);
      }
    }, true);
  </script>
