<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>DEYMFLIX - Reels</title>

  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="stylesheet" href="style.css?v=130.0">

  <!-- FIREBASE COMPAT SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

  <style>
    * {
      -webkit-touch-callout: none !important;
      -webkit-user-select: none !important;
      user-select: none !important;
      -webkit-tap-highlight-color: transparent !important;
      box-sizing: border-box;
    }

    html, body {
      background-color: #050505;
      margin: 0;
      padding: 0;
      overflow: hidden;
      height: 100vh;
      height: 100dvh;
      width: 100vw;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    .reels-feed-container {
      width: 100%;
      height: 100vh;
      height: 100dvh;
      overflow-y: scroll;
      scroll-snap-type: y mandatory;
      scrollbar-width: none;
      -webkit-overflow-scrolling: touch;
    }

    .reels-feed-container::-webkit-scrollbar {
      display: none;
    }

    .reel-card {
      position: relative;
      width: 100%;
      height: 100vh;
      height: 100dvh;
      scroll-snap-align: start;
      scroll-snap-stop: always;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .reel-frame {
      position: relative;
      width: 100%;
      height: 100%;
      max-width: calc(100dvh * (9 / 16));
      background: #000;
      overflow: hidden;
      box-shadow: 0 0 50px rgba(0, 0, 0, 0.9);
      touch-action: pan-y;
    }

    .reel-video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      pointer-events: none !important;
    }

    .reels-top-nav {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      padding: max(16px, env(safe-area-inset-top)) 20px 16px 20px;
      display: flex;
      align-items: center;
      gap: 12px;
      z-index: 150;
      background: linear-gradient(180deg, rgba(0,0,0,0.85) 0%, transparent 100%);
      pointer-events: auto !important;
    }

    .reels-back-btn {
      background: transparent;
      border: none;
      color: #fff;
      font-size: 1.5rem;
      font-weight: 800;
      cursor: pointer;
      padding: 6px 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-shadow: 0 2px 4px rgba(0,0,0,0.8);
      pointer-events: auto !important;
      z-index: 160;
    }

    .reels-header-title {
      font-weight: 700;
      font-size: 0.95rem;
      color: rgba(255, 255, 255, 0.9);
      letter-spacing: 0.3px;
      text-shadow: 0 2px 4px rgba(0,0,0,0.8);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 80%;
      pointer-events: none;
    }

    .reels-actions-side {
      position: absolute;
      right: 16px;
      bottom: calc(90px + env(safe-area-inset-bottom));
      display: flex;
      flex-direction: column;
      gap: 20px;
      align-items: center;
      z-index: 150;
      pointer-events: auto !important;
      transition: opacity 0.5s ease;
    }

    .reel-action-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      color: #fff;
      cursor: pointer;
      background: transparent;
      border: none;
      outline: none;
      pointer-events: auto !important;
    }

    .reel-action-btn {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: rgba(0, 0, 0, 0.4);
      backdrop-filter: blur(8px);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 4px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      transition: transform 0.2s ease, background 0.2s ease;
      pointer-events: auto !important;
    }

    .reel-action-btn.liked svg {
      fill: #e50914;
      stroke: #e50914;
    }

    .reel-action-count {
      font-size: 0.75rem;
      font-weight: 700;
      text-shadow: 0 1px 4px rgba(0,0,0,0.8);
      pointer-events: none;
    }

    .reel-info-bottom {
      position: absolute;
      bottom: calc(30px + env(safe-area-inset-bottom));
      left: 16px;
      right: 80px;
      z-index: 110;
      color: #fff;
      text-shadow: 0 2px 6px rgba(0,0,0,0.8);
      display: flex;
      flex-direction: column;
      gap: 4px;
      pointer-events: none;
      transition: opacity 0.5s ease;
    }

    .reel-title {
      font-size: 1.05rem;
      font-weight: 800;
      line-height: 1.3;
      color: #ffffff;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .reel-timestamp {
      font-size: 0.8rem;
      font-weight: 700;
      color: #e50914;
      text-shadow: 0 1px 3px rgba(0,0,0,0.9);
    }

    .reel-progress-track {
      position: absolute;
      bottom: calc(10px + env(safe-area-inset-bottom, 0px));
      left: 16px;
      right: 16px;
      height: 8px;
      background: rgba(255, 255, 255, 0.25);
      border-radius: 4px;
      z-index: 120;
      cursor: pointer;
      pointer-events: auto !important;
      touch-action: none;
    }

    .reel-progress-fill {
      height: 100%;
      width: 0%;
      background: #e50914;
      border-radius: 4px;
      transition: width 0.1s linear;
      pointer-events: none;
    }

    .fade-clear-mode {
      opacity: 1;
      transition: opacity 0.5s ease;
    }

    .clear-active .fade-clear-mode {
      opacity: 0 !important;
      pointer-events: none !important;
    }

    .speed-badge-overlay {
      position: absolute;
      top: 75px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.75);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #ffffff;
      font-size: 0.85rem;
      font-weight: 800;
      padding: 6px 16px;
      border-radius: 20px;
      z-index: 95;
      display: none;
      align-items: center;
      gap: 6px;
      backdrop-filter: blur(6px);
      pointer-events: none;
    }

    .reel-circular-spinner {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 50px;
      height: 50px;
      border: 4px solid rgba(255, 255, 255, 0.2);
      border-top: 4px solid #e50914;
      border-radius: 50%;
      z-index: 85;
      display: none;
      animation: spinCircle 0.8s linear infinite;
      pointer-events: none;
    }

    @keyframes spinCircle {
      0% { transform: translate(-50%, -50%) rotate(0deg); }
      100% { transform: translate(-50%, -50%) rotate(360deg); }
    }

    .play-pause-indicator {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0.6);
      width: 75px;
      height: 75px;
      border-radius: 50%;
      background: rgba(0, 0, 0, 0.65);
      border: 1px solid rgba(255, 255, 255, 0.2);
      backdrop-filter: blur(8px);
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      z-index: 95;
    }

    .play-pause-indicator.show {
      opacity: 1;
      transform: translate(-50%, -50%) scale(1);
    }

    .floating-heart {
      position: absolute;
      width: 80px;
      height: 80px;
      pointer-events: none;
      z-index: 180;
      transform: translate(-50%, -50%) scale(0);
      animation: heartPop 0.8s ease-out forwards;
    }

    @keyframes heartPop {
      0% { transform: translate(-50%, -50%) scale(0); opacity: 1; }
      50% { transform: translate(-50%, -50%) scale(1.3); opacity: 0.9; }
      100% { transform: translate(-50%, -50%) scale(1) translateY(-60px); opacity: 0; }
    }

    /* COMMENTS DRAWER MODAL */
    .comments-drawer-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.6);
      z-index: 200;
      display: none;
    }

    .comments-drawer-container {
      position: fixed;
      bottom: -100%;
      left: 0;
      right: 0;
      height: 60vh;
      max-height: 520px;
      background: #121212;
      border-top-left-radius: 20px;
      border-top-right-radius: 20px;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      z-index: 210;
      display: flex;
      flex-direction: column;
      transition: bottom 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      box-shadow: 0 -10px 30px rgba(0,0,0,0.9);
      padding: 16px;
    }

    .comments-drawer-container.open {
      bottom: 0;
    }

    .comments-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-bottom: 12px;
      border-bottom: 1px solid #262626;
      color: #fff;
      font-weight: 800;
    }

    .comments-close-btn {
      background: transparent;
      border: none;
      color: #aaa;
      font-size: 1.5rem;
      cursor: pointer;
    }

    .comments-body-list {
      flex: 1;
      overflow-y: auto;
      padding: 12px 0;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .comment-card-item {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 10px;
      font-size: 0.85rem;
      background: rgba(255, 255, 255, 0.03);
      padding: 8px 12px;
      border-radius: 8px;
    }

    .comment-content {
      display: flex;
      flex-direction: column;
      gap: 2px;
      flex: 1;
    }

    .comment-author {
      color: #e50914;
      font-weight: 800;
    }

    .comment-text-body {
      color: #ffffff;
      line-height: 1.3;
      word-break: break-word;
    }

    .comment-actions-group {
      display: flex;
      gap: 8px;
    }

    .comment-action-btn {
      background: transparent;
      border: none;
      color: #888;
      font-size: 0.72rem;
      font-weight: bold;
      cursor: pointer;
      padding: 2px 4px;
    }

    .comment-action-btn:hover {
      color: #fff;
    }

    .comment-action-btn.delete:hover {
      color: #e50914;
    }

    .comments-footer-input {
      display: flex;
      gap: 10px;
      padding-top: 10px;
      border-top: 1px solid #262626;
    }

    .comments-footer-input input {
      flex: 1;
      background: #1f1f1f;
      border: 1px solid #333;
      border-radius: 20px;
      padding: 10px 16px;
      color: #fff;
      outline: none;
      font-size: 0.88rem;
    }

    .comments-footer-input button {
      background: #e50914;
      color: #fff;
      border: none;
      border-radius: 20px;
      padding: 10px 18px;
      font-weight: 800;
      cursor: pointer;
    }
  </style>
</head>
<body oncontextmenu="return false;">

  <div class="reels-feed-container" id="reelsContainer"></div>

  <!-- COMMENTS DRAWER MODAL -->
  <div class="comments-drawer-backdrop" id="commentsBackdrop" onclick="closeCommentsModal()"></div>
  <div class="comments-drawer-container" id="commentsContainer">
    <div class="comments-header">
      <span id="commentsHeaderCount">Comments (0)</span>
      <button class="comments-close-btn" onclick="closeCommentsModal()">&times;</button>
    </div>
    <div class="comments-body-list" id="commentsList"></div>
    <div class="comments-footer-input">
      <input type="text" id="newCommentInput" placeholder="Add a comment...">
      <button onclick="submitNewComment()">Post</button>
    </div>
  </div>

  <script src="reels-data.js?v=130.0"></script>
  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyCSejdiwh4Y6N6Pwl6QyLXPNYdUqz8vc1M",
      authDomain: "deymflix.firebaseapp.com",
      projectId: "deymflix",
      storageBucket: "deymflix.firebasestorage.app",
      messagingSenderId: "333198075783",
      appId: "1:333198075783:web:91765cf2f3c09e3c119522",
      measurementId: "G-H8KMTM5YYH"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    let currentUserId = localStorage.getItem('deymflix_user_id');
    if (!currentUserId) {
      currentUserId = 'user_' + Math.random().toString(36).substr(2, 9);
      localStorage.setItem('deymflix_user_id', currentUserId);
    }

    const reelsContainer = document.getElementById('reelsContainer');
    let historySequence = [];
    let activeCardIndex = 0;
    let clearModeTimer = null;
    let speedHoldTimer = null;
    let isLongPressing = false;
    let currentActiveReelId = null;
    let unsubscribeComments = null;

    document.addEventListener('contextmenu', (e) => e.preventDefault());

    function goBackToHome(e) {
      if (e) e.stopPropagation();
      window.location.href = 'index.html';
    }

    function initReelHistory() {
      const list = typeof aiReelsData !== 'undefined' ? aiReelsData : [];
      if (list.length === 0) return;

      const urlParams = new URLSearchParams(window.location.search);
      const targetId = urlParams.get('id');

      let firstReel = list[0];
      if (targetId) {
        const found = list.find(r => r.id === targetId);
        if (found) firstReel = found;
      }

      historySequence.push(firstReel);

      for (let i = 0; i < 5; i++) {
        appendRandomReelToSequence();
      }

      renderHistoryCards();
    }

    function appendRandomReelToSequence() {
      const list = typeof aiReelsData !== 'undefined' ? aiReelsData : [];
      if (list.length === 0) return;

      const lastItem = historySequence[historySequence.length - 1];
      const available = list.filter(r => !lastItem || r.id !== lastItem.id);

      const randomItem = available[Math.floor(Math.random() * available.length)];
      historySequence.push(randomItem);
    }

    function renderHistoryCards() {
      reelsContainer.innerHTML = '';
      historySequence.forEach((reel, index) => {
        reelsContainer.appendChild(createReelCardElement(reel, index));
      });
      observeReelCards();
    }

    function formatLikesValue(num) {
      if (!num && num !== 0) return "0";
      return num >= 1000 ? `${(num / 1000).toFixed(1)}K` : num.toString();
    }

    function createReelCardElement(reel, index) {
      const reelCard = document.createElement('div');
      reelCard.className = 'reel-card';
      reelCard.dataset.id = reel.id;
      reelCard.dataset.index = index;

      const userLikedKey = `liked_${reel.id}_${currentUserId}`;
      const isUserLiked = localStorage.getItem(userLikedKey) === "true";

      reelCard.innerHTML = `
        <div class="reel-frame" id="frame-${index}">
          <video class="reel-video" id="video-${index}" src="${reel.videoUrl}" loop playsinline crossorigin="anonymous"></video>

          <div class="speed-badge-overlay" id="speed-badge-${index}">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="#ffffff"><path d="M4 18l8.5-6L4 6v12zm9-12v12l8.5-6L13 6z"/></svg>
            2x Speed
          </div>

          <div class="reel-circular-spinner" id="circle-spinner-${index}"></div>

          <header class="reels-top-nav">
            <button class="reels-back-btn" onclick="goBackToHome(event)" ontouchstart="goBackToHome(event)">❮</button>
            <span class="reels-header-title">${reel.title}</span>
          </header>

          <div class="play-pause-indicator" id="indicator-${index}">
            <svg viewBox="0 0 24 24" width="36" height="36" fill="#fff"><path d="M8 5v14l11-7z"/></svg>
          </div>

          <div class="reels-actions-side fade-clear-mode">
            <button class="reel-action-item" onclick="toggleLike(this, event)">
              <div class="reel-action-btn ${isUserLiked ? 'liked' : ''}" id="like-btn-${index}">
                <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="#fff" stroke-width="2">
                  <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
                </svg>
              </div>
              <span class="reel-action-count" id="like-count-${index}">0</span>
            </button>

            <button class="reel-action-item" onclick="openCommentsModal('${reel.id}', event)">
              <div class="reel-action-btn">
                <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="#fff" stroke-width="2">
                  <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
                </svg>
              </div>
              <span class="reel-action-count" id="comment-count-${reel.id}">0</span>
            </button>

            <button class="reel-action-item" onclick="shareReel('${reel.title}', event)">
              <div class="reel-action-btn">
                <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="#fff" stroke-width="2">
                  <path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8M16 6l-4-4-4 4M12 2v13"/>
                </svg>
              </div>
              <span class="reel-action-count">Share</span>
            </button>
          </div>

          <div class="reel-info-bottom fade-clear-mode">
            <div class="reel-title">${reel.title}</div>
            <div class="reel-timestamp" id="time-${index}">00:00:00 / 00:00:00</div>
          </div>

          <div class="reel-progress-track" id="track-${index}">
            <div class="reel-progress-fill" id="progress-${index}"></div>
          </div>
        </div>
      `;

      setupReelCardListeners(reelCard, index);
      listenToReelStats(reel.id, index);
      return reelCard;
    }

    function formatTime(seconds) {
      if (isNaN(seconds)) return "00:00:00";
      const hrs = Math.floor(seconds / 3600);
      const mins = Math.floor((seconds % 3600) / 60);
      const secs = Math.floor(seconds % 60);

      const hStr = hrs < 10 ? `0${hrs}` : hrs;
      const mStr = mins < 10 ? `0${mins}` : mins;
      const sStr = secs < 10 ? `0${secs}` : secs;

      return `${hStr}:${mStr}:${sStr}`;
    }

    function setupReelCardListeners(card, index) {
      const video = card.querySelector('.reel-video');
      const frame = card.querySelector('.reel-frame');
      const indicator = card.querySelector(`#indicator-${index}`);
      const circleSpinner = card.querySelector(`#circle-spinner-${index}`);
      const progressBar = card.querySelector(`#progress-${index}`);
      const progressTrack = card.querySelector(`#track-${index}`);
      const timeDisplay = card.querySelector(`#time-${index}`);
      const speedBadge = card.querySelector(`#speed-badge-${index}`);

      let lastTap = 0;

      video.addEventListener('waiting', () => {
        if (circleSpinner) circleSpinner.style.display = 'block';
      });

      video.addEventListener('playing', () => {
        if (circleSpinner) circleSpinner.style.display = 'none';
      });

      video.addEventListener('timeupdate', () => {
        if (!isNaN(video.duration)) {
          const pct = (video.currentTime / video.duration) * 100;
          if (progressBar) progressBar.style.width = `${pct}%`;
          if (timeDisplay) timeDisplay.textContent = `${formatTime(video.currentTime)} / ${formatTime(video.duration)}`;
        }
      });

      function seekVideoToPosition(e) {
        e.stopPropagation();
        if (isNaN(video.duration)) return;
        const rect = progressTrack.getBoundingClientRect();
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clickX = Math.max(0, Math.min(clientX - rect.left, rect.width));
        const pct = clickX / rect.width;
        video.currentTime = pct * video.duration;
      }

      progressTrack.addEventListener('click', seekVideoToPosition);
      progressTrack.addEventListener('touchmove', seekVideoToPosition, { passive: true });

      function startSpeedUp(e) {
        if (e.target.closest('.reels-actions-side') || e.target.closest('.reels-top-nav') || e.target.closest('.reel-progress-track')) return;
        speedHoldTimer = setTimeout(() => {
          isLongPressing = true;
          video.playbackRate = 2.0;
          if (speedBadge) speedBadge.style.display = 'flex';
        }, 220);
      }

      function stopSpeedUp() {
        clearTimeout(speedHoldTimer);
        if (isLongPressing) {
          isLongPressing = false;
          video.playbackRate = 1.0;
          if (speedBadge) speedBadge.style.display = 'none';
        }
      }

      frame.addEventListener('mousedown', startSpeedUp);
      frame.addEventListener('mouseup', stopSpeedUp);
      frame.addEventListener('mouseleave', stopSpeedUp);

      frame.addEventListener('touchstart', startSpeedUp, { passive: true });
      frame.addEventListener('touchend', stopSpeedUp);
      frame.addEventListener('touchcancel', stopSpeedUp);

      frame.addEventListener('mousemove', resetClearModeTimer);
      frame.addEventListener('touchstart', resetClearModeTimer, { passive: true });

      card.addEventListener('click', (e) => {
        if (e.target.closest('.reels-actions-side') || e.target.closest('.reels-top-nav') || e.target.closest('.comments-drawer-container') || e.target.closest('.reel-progress-track')) return;

        const now = Date.now();
        const tapGap = now - lastTap;

        if (tapGap < 300 && tapGap > 0) {
          triggerHeartAnimation(card, e.clientX, e.clientY);
          const likeActionItem = card.querySelector('.reel-action-item');
          const btn = card.querySelector(`#like-btn-${index}`);
          if (!btn.classList.contains('liked')) {
            toggleLike(likeActionItem, e);
          }
        } else {
          setTimeout(() => {
            if (Date.now() - lastTap >= 300 && !isLongPressing) {
              if (video.paused) {
                video.play().catch(() => {});
                showIndicator(indicator, false);
              } else {
                video.pause();
                showIndicator(indicator, true);
              }
            }
          }, 300);
        }
        lastTap = now;
      });
    }

    function resetClearModeTimer() {
      const activeFrame = document.getElementById(`frame-${activeCardIndex}`);
      if (!activeFrame) return;

      activeFrame.classList.remove('clear-active');
      clearTimeout(clearModeTimer);

      clearModeTimer = setTimeout(() => {
        activeFrame.classList.add('clear-active');
      }, 2000);
    }

    function showIndicator(indicator, isPaused) {
      if (!indicator) return;
      indicator.innerHTML = isPaused ? 
        `<svg viewBox="0 0 24 24" width="36" height="36" fill="#fff"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>` : 
        `<svg viewBox="0 0 24 24" width="36" height="36" fill="#fff"><path d="M8 5v14l11-7z"/></svg>`;
      
      indicator.classList.add('show');
      setTimeout(() => indicator.classList.remove('show'), 600);
    }

    function triggerHeartAnimation(card, x, y) {
      const rect = card.getBoundingClientRect();
      const heart = document.createElement('div');
      heart.className = 'floating-heart';
      heart.style.left = `${x - rect.left}px`;
      heart.style.top = `${y - rect.top}px`;
      heart.innerHTML = `<svg viewBox="0 0 24 24" width="80" height="80" fill="#e50914"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>`;
      
      card.appendChild(heart);
      setTimeout(() => heart.remove(), 800);
    }

    function listenToReelStats(reelId, index) {
      db.collection('reels').doc(reelId).onSnapshot((doc) => {
        const countLabel = document.getElementById(`like-count-${index}`);
        if (doc.exists) {
          const data = doc.data();
          if (countLabel) countLabel.textContent = formatLikesValue(data.likes || 0);
        } else {
          if (countLabel) countLabel.textContent = "0";
        }
      });
    }

    function toggleLike(button, e) {
      if (e) e.stopPropagation();
      const card = button.closest('.reel-card');
      const reelId = card.dataset.id;
      const index = card.dataset.index;
      const btn = card.querySelector(`#like-btn-${index}`);

      const userLikedKey = `liked_${reelId}_${currentUserId}`;
      const isCurrentlyLiked = btn.classList.contains('liked');

      if (!isCurrentlyLiked) {
        btn.classList.add('liked');
        localStorage.setItem(userLikedKey, "true");
      } else {
        btn.classList.remove('liked');
        localStorage.setItem(userLikedKey, "false");
      }

      const reelRef = db.collection('reels').doc(reelId);
      db.runTransaction((transaction) => {
        return transaction.get(reelRef).then((doc) => {
          if (!doc.exists) {
            transaction.set(reelRef, { likes: isCurrentlyLiked ? 0 : 1 });
          } else {
            const currentLikes = doc.data().likes || 0;
            const newLikes = !isCurrentlyLiked ? currentLikes + 1 : Math.max(0, currentLikes - 1);
            transaction.update(reelRef, { likes: newLikes });
          }
        });
      });
    }

    function openCommentsModal(reelId, e) {
      if (e) e.stopPropagation();
      currentActiveReelId = reelId;

      document.getElementById('commentsBackdrop').style.display = 'block';
      document.getElementById('commentsContainer').classList.add('open');

      if (unsubscribeComments) unsubscribeComments();

      unsubscribeComments = db.collection('reels')
        .doc(reelId)
        .collection('comments')
        .orderBy('createdAt', 'desc')
        .onSnapshot((snapshot) => {
          const container = document.getElementById('commentsList');
          const headerCount = document.getElementById('commentsHeaderCount');
          container.innerHTML = '';

          headerCount.textContent = `Comments (${snapshot.size})`;

          const commentBtnCount = document.getElementById(`comment-count-${reelId}`);
          if (commentBtnCount) commentBtnCount.textContent = snapshot.size;

          snapshot.forEach((doc) => {
            const c = doc.data();
            const commentId = doc.id;
            const isOwner = c.userId === currentUserId;

            const item = document.createElement('div');
            item.className = 'comment-card-item';
            item.innerHTML = `
              <div class="comment-content">
                <span class="comment-author">${c.user || 'User'} ${isOwner ? '(You)' : ''}</span>
                <span class="comment-text-body" id="text-${commentId}">${c.text || ''}</span>
              </div>
              ${isOwner ? `
                <div class="comment-actions-group">
                  <button class="comment-action-btn" onclick="editComment('${commentId}', '${(c.text || '').replace(/'/g, "\\'")}')">Edit</button>
                  <button class="comment-action-btn delete" onclick="deleteComment('${commentId}')">Delete</button>
                </div>
              ` : ''}
            `;
            container.appendChild(item);
          });
        });
    }

    function closeCommentsModal() {
      document.getElementById('commentsBackdrop').style.display = 'none';
      document.getElementById('commentsContainer').classList.remove('open');
      if (unsubscribeComments) unsubscribeComments();
    }

    function submitNewComment() {
      const input = document.getElementById('newCommentInput');
      const text = input.value.trim();
      if (!text || !currentActiveReelId) return;

      db.collection('reels').doc(currentActiveReelId).collection('comments').add({
        userId: currentUserId,
        user: 'User_' + currentUserId.substr(-4),
        text: text,
        createdAt: firebase.firestore.FieldValue.serverTimestamp()
      }).then(() => {
        input.value = '';
      });
    }

    function editComment(commentId, oldText) {
      const updatedText = prompt("Edit your comment:", oldText);
      if (updatedText && updatedText.trim() !== "" && updatedText !== oldText) {
        db.collection('reels')
          .doc(currentActiveReelId)
          .collection('comments')
          .doc(commentId)
          .update({
            text: updatedText.trim(),
            updatedAt: firebase.firestore.FieldValue.serverTimestamp()
          });
      }
    }

    function deleteComment(commentId) {
      if (confirm("Are you sure you want to delete this comment?")) {
        db.collection('reels')
          .doc(currentActiveReelId)
          .collection('comments')
          .doc(commentId)
          .delete();
      }
    }

    function shareReel(title, e) {
      if (e) e.stopPropagation();
      if (navigator.share) {
        navigator.share({ title: title, url: window.location.href }).catch(() => {});
      } else {
        navigator.clipboard.writeText(window.location.href);
        alert('Reel link copied!');
      }
    }

    let observer = null;

    function observeReelCards() {
      if (observer) observer.disconnect();

      observer = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
          const video = entry.target.querySelector('.reel-video');
          const index = parseInt(entry.target.dataset.index);

          if (entry.isIntersecting) {
            activeCardIndex = index;
            if (video) {
              video.currentTime = 0;
              video.play().catch(() => {});
            }
            resetClearModeTimer();

            if (index >= historySequence.length - 2) {
              appendRandomReelToSequence();
              const nextIndex = historySequence.length - 1;
              const newCard = createReelCardElement(historySequence[nextIndex], nextIndex);
              reelsContainer.appendChild(newCard);
              observer.observe(newCard);
            }
          } else {
            if (video) video.pause();
          }
        });
      }, { threshold: 0.6 });

      document.querySelectorAll('.reel-card').forEach(card => observer.observe(card));
    }

    document.addEventListener('DOMContentLoaded', () => {
      initReelHistory();
    });
  </script>
</body>
</html>
