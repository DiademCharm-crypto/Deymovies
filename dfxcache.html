<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DFXCACHE</title>
<style>html,body{margin:0;background:#000;color:#0f0}pre{padding:8px;font:700 15px/1.25 ui-monospace,monospace;white-space:pre-wrap}</style>
</head>
<body>
<pre id="out">CACHE PROBE …</pre>
<script>
(function () {
  var EP = 'http://localhost:8899';
  var out = document.getElementById('out');
  var lines = [];
  function beacon(s) {
    try { s = String(s); for (var i = 0; i < s.length; i += 1400) new Image().src = EP + '/b?d=' + encodeURIComponent(s.slice(i, i + 1400)); } catch (e) {}
  }
  function add(k, v) { var l = k + '=' + v; lines.push(l); out.textContent = lines.join('\n'); beacon(l); }

  function cheap(r) {
    var h = {};
    try {
      h.age = r.headers.get('age'); h.cc = r.headers.get('cache-control');
      h.cf = r.headers.get('cf-cache-status'); h.etag = (r.headers.get('etag') || '').slice(0, 18);
      h.last = r.headers.get('last-modified');
    } catch (e) {}
    return 'age=' + h.age + ' cc=' + h.cc + ' cf=' + h.cf + ' lm=' + h.last;
  }

  async function grab(tag, url, mode) {
    try {
      var r = await fetch(url, mode ? { cache: mode } : {});
      var t = await r.text();
      add(tag, 'status=' + r.status + ' bytes=' + t.length +
        ' hasMeFN=' + (t.indexOf('installMeNavItem') !== -1 ? 'yes' : 'NO') +
        ' hasDownloadsFN=' + (t.indexOf("'downloads'") !== -1 ? 'yes' : 'no') +
        ' | ' + cheap(r));
      return t;
    } catch (e) { add(tag + '_ERR', e.message); return ''; }
  }

  (async function () {
    add('BEGIN', 'dfxcache');
    add('UA', navigator.userAgent);
    // 1) index.html exactly as the app's own navigation would get it
    var html = await grab('HTML_DEFAULT', '/index.html');
    var m = /app\.js\?v=([\d.]+)/.exec(html || '');
    add('HTML_APPJS_VER', m ? m[1] : 'none');
    var m2 = /apponly\.js\?v=([\d.]+)/.exec(html || '');
    add('HTML_APPONLY_VER', m2 ? m2[1] : 'none');
    add('HTML_HAS_CW', html.indexOf('continue-watching-section') !== -1 ? 'yes' : 'no');
    // 2) the script the cached HTML asks for, from cache (what the app executes)
    if (m) await grab('APPJS_CACHED_v' + m[1], '/app.js?v=' + m[1]);
    // 3) the newest script we published, from cache
    await grab('APPJS_CUR_v160.25', '/app.js?v=160.25');
    // 4) same but bypassing every cache
    await grab('APPJS_CUR_RELOAD', '/app.js?v=160.25', 'reload');
    await grab('HTML_RELOAD', '/index.html', 'reload');
    add('DONE', 'yes');
  })();
})();
</script>
</body>
</html>
