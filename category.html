<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>DEYMFLIX - Category</title>

  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">

  <link rel="stylesheet" href="style.css?v=153.0">
</head>
<body>

  <!-- Top Navigation Header -->
  <header class="top-nav">
    <!-- 1. LEFT: Brand Logo & Title -->
    <a href="index.html" class="brand-logo-link">
      <img src="favicon.svg" alt="DEYMFLIX Icon" class="brand-logo-img">
      <span class="brand-title-text">DEYM<span class="highlight-red">FLIX</span></span>
    </a>

    <!-- 2. RIGHT: Request Button (Unwrapped for CSS Order targeting) -->
    <button class="header-request-btn" onclick="openRequestModal()">Request a Movie</button>

    <!-- 3. BOTTOM / CENTER: Search Bar -->
    <div class="search-overlay-bar">
      <form id="search-form" onsubmit="event.preventDefault();">
        <div class="search-input-wrapper">
          <input type="search" id="search-input" placeholder="Search movies..." autocomplete="off">
        </div>
      </form>
      <div id="search-suggestions-box" class="search-suggestions-box" style="display: none;"></div>
    </div>
  </header>

  <!-- Category View Main Section -->
  <main class="content-section category-main-wrapper">
    <div class="section-header-flex">
      <div class="section-header-left">
        <h2 id="category-title" class="section-header-title">Loading Category...</h2>
        <button id="btn-reel-history" class="reel-history-btn" onclick="openReelHistory()" style="display: none;">
          <span>🕘</span> Watch History
          <span id="reel-history-count" class="reel-history-count" style="display: none;"></span>
        </button>
      </div>
    </div>

    <!-- Responsive Grid Container -->
    <div class="category-grid" id="category-grid-container"></div>

    <!-- Pagination Navigation Controls -->
    <div class="pagination-wrapper" id="pagination-wrapper"></div>
  </main>

  <!-- REEL WATCH HISTORY MODAL -->
  <div id="reel-history-modal" class="reel-history-modal" onclick="if (event.target === this) closeReelHistory()">
    <div class="reel-history-card">
      <div class="reel-history-header">
        <h3>🕘 Continue Watching Reels</h3>
        <button class="reel-history-close" onclick="closeReelHistory()" title="Close">&times;</button>
      </div>
      <div class="reel-history-list" id="reel-history-list"></div>
    </div>
  </div>

  <!-- Request Modal -->
  <div id="request-modal" class="request-modal-backdrop" style="display: none;">
    <div class="request-modal-content">
      <span class="close-modal-btn" onclick="closeRequestModal()">&times;</span>
      <h3>Request a Movie</h3>
      <p>Can't find what you're looking for? Let us know!</p>
      <div class="request-input-group">
        <input type="text" id="modal-request-input" placeholder="Enter movie title...">
        <button onclick="submitMovieRequest()">Submit</button>
      </div>
    </div>
  </div>

  <div id="loading-toast" class="toast-notification">Loading...</div>

  <script src="reels-data.js?v=151.0"></script>
  <script src="app.js?v=153.0"></script>
  <script>
    let currentPage = 1;
    const itemsPerPage = 18; // 18 items per page

    document.addEventListener('DOMContentLoaded', () => {
      loadCategoryPage(1);
    });

    function loadCategoryPage(page) {
      currentPage = page;
      const urlParams = new URLSearchParams(window.location.search);
      const categoryType = urlParams.get('type') || 'all';
      const gridContainer = document.getElementById('category-grid-container');
      const titleElement = document.getElementById('category-title');
      const paginationWrapper = document.getElementById('pagination-wrapper');

      if (!gridContainer) return;
      gridContainer.innerHTML = '';

      let itemsList = [];

      if (categoryType === 'reels') {
        titleElement.textContent = 'AI Reels & Shorts';
        gridContainer.classList.add('reels-grid-mode');
        itemsList = typeof aiReelsData !== 'undefined' ? aiReelsData : [];
        renderReelHistoryCount();
      } else if (categoryType === 'tagalog') {
        titleElement.textContent = 'Tagalog Movies PH';
        itemsList = typeof movies !== 'undefined' ? movies.filter(m => m.isFilipino || m.genre?.includes('Filipino') || m.country === 'PH') : [];
        const historyBtn = document.getElementById('btn-reel-history');
        if (historyBtn) historyBtn.style.display = 'none';
      } else {
        titleElement.textContent = 'All Movies';
        itemsList = typeof movies !== 'undefined' ? movies : [];
        const historyBtn = document.getElementById('btn-reel-history');
        if (historyBtn) historyBtn.style.display = 'none';
      }

      // Calculate total pages & slice array
      const totalPages = Math.ceil(itemsList.length / itemsPerPage);
      const startIndex = (currentPage - 1) * itemsPerPage;
      const paginatedItems = itemsList.slice(startIndex, startIndex + itemsPerPage);

      if (categoryType === 'reels') {
        paginatedItems.forEach(reel => {
          const card = document.createElement('div');
          card.className = 'reel-thumb-card';
          card.onclick = () => window.location.href = `reels.html?id=${encodeURIComponent(reel.id)}`;
          card.innerHTML = `
            <img src="${reel.poster || reel.thumbnail}" alt="${reel.title}" class="reel-thumb-img" loading="lazy">
            <div class="reel-overlay-info">
              <span class="reel-badge-tag">AI REEL</span>
              <span class="reel-thumb-title">${reel.title}</span>
            </div>
          `;
          gridContainer.appendChild(card);
        });
      } else {
        paginatedItems.forEach(movie => {
          if (typeof createMovieCard === 'function') {
            gridContainer.appendChild(createMovieCard(movie));
          }
        });
      }

      renderPaginationControls(totalPages, paginationWrapper);
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    // ── REEL WATCH HISTORY (AI Reels mode only) ──────────────────
    function getReelHistory() {
      try { return JSON.parse(localStorage.getItem('deymflix_reel_history') || '{}'); } catch (e) { return {}; }
    }

    function getUnfinishedReels() {
      const history = getReelHistory();
      const reelIds = new Set((typeof aiReelsData !== 'undefined' ? aiReelsData : []).map(r => r.id));
      return Object.values(history)
        .filter(h => h && reelIds.has(h.id) && h.progress < 95 && h.currentTime > 3)
        .sort((a, b) => (b.updatedAt || 0) - (a.updatedAt || 0));
    }

    function renderReelHistoryCount() {
      const btn = document.getElementById('btn-reel-history');
      const countEl = document.getElementById('reel-history-count');
      if (!btn) return;
      const unfinished = getUnfinishedReels();
      btn.style.display = unfinished.length > 0 ? 'inline-flex' : 'none';
      if (countEl) {
        countEl.textContent = unfinished.length;
        countEl.style.display = unfinished.length > 0 ? 'inline-flex' : 'none';
      }
    }

    function openReelHistory() {
      const modal = document.getElementById('reel-history-modal');
      const list = document.getElementById('reel-history-list');
      if (!modal || !list) return;

      const unfinished = getUnfinishedReels();

      if (unfinished.length === 0) {
        list.innerHTML = '<div class="reel-history-empty">No watch history yet.<br>Watch a reel and it will show up here so you can continue where you left off.</div>';
      } else {
        list.innerHTML = '';
        unfinished.forEach(item => {
          const row = document.createElement('div');
          row.className = 'reel-history-item';
          row.innerHTML = `
            <img src="${item.poster}" alt="${item.title}" class="reel-history-thumb" loading="lazy">
            <div class="reel-history-info">
              <div class="reel-history-title">${item.title}</div>
              <div class="reel-history-progress-track"><div class="reel-history-progress-fill" style="width:${Math.max(2, Math.min(100, item.progress))}%"></div></div>
              <div class="reel-history-pct">${Math.round(item.progress)}% watched</div>
            </div>
            <button class="reel-history-remove" title="Remove from history" onclick="removeReelHistory('${item.id.replace(/'/g, "\\'")}', event)">&times;</button>
          `;
          row.onclick = () => { window.location.href = 'reels.html?id=' + encodeURIComponent(item.id); };
          list.appendChild(row);
        });
      }
      modal.classList.add('open');
    }

    function closeReelHistory() {
      const modal = document.getElementById('reel-history-modal');
      if (modal) modal.classList.remove('open');
    }

    function removeReelHistory(id, event) {
      event.stopPropagation();
      const history = getReelHistory();
      delete history[id];
      try { localStorage.setItem('deymflix_reel_history', JSON.stringify(history)); } catch (e) {}
      renderReelHistoryCount();
      openReelHistory();
    }

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') closeReelHistory();
    });

    function renderPaginationControls(totalPages, container) {
      if (!container) return;
      if (totalPages <= 1) {
        container.innerHTML = '';
        return;
      }

      let paginationHTML = '';

      // Prev Button
      paginationHTML += `<button class="page-nav-btn ${currentPage === 1 ? 'disabled' : ''}" 
        onclick="${currentPage > 1 ? `loadCategoryPage(${currentPage - 1})` : ''}">❮ Prev</button>`;

      // Calculate Sliding Window for Maximum 3 Numeric Buttons
      let startPage = Math.max(1, currentPage - 1);
      let endPage = startPage + 2;

      if (endPage > totalPages) {
        endPage = totalPages;
        startPage = Math.max(1, endPage - 2);
      }

      // First page shortcut
      if (startPage > 1) {
        paginationHTML += `<button class="page-num-btn" onclick="loadCategoryPage(1)">1</button>`;
        if (startPage > 2) {
          paginationHTML += `<span style="color:#666; font-weight:bold; padding: 0 4px;">...</span>`;
        }
      }

      // Render 3 numeric buttons
      for (let i = startPage; i <= endPage; i++) {
        paginationHTML += `<button class="page-num-btn ${i === currentPage ? 'active' : ''}" 
          onclick="loadCategoryPage(${i})">${i}</button>`;
      }

      // Last page shortcut
      if (endPage < totalPages) {
        if (endPage < totalPages - 1) {
          paginationHTML += `<span style="color:#666; font-weight:bold; padding: 0 4px;">...</span>`;
        }
        paginationHTML += `<button class="page-num-btn" onclick="loadCategoryPage(${totalPages})">${totalPages}</button>`;
      }

      // Next Button
      paginationHTML += `<button class="page-nav-btn ${currentPage === totalPages ? 'disabled' : ''}" 
        onclick="${currentPage < totalPages ? `loadCategoryPage(${currentPage + 1})` : ''}">Next ❯</button>`;

      container.innerHTML = paginationHTML;
    }
  </script>
</body>
</html>
