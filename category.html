<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>DEYMFLIX - Category</title>

  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">

  <link rel="stylesheet" href="style.css?v=138.0">
</head>
<body>

  <!-- Top Navigation Header -->
  <header class="top-nav">
    <a href="index.html" class="brand-logo-link">
      <img src="favicon.svg" alt="DEYMFLIX Icon" class="brand-logo-img">
      <span class="brand-title-text" id="nav-brand-title">DEYM<span class="highlight-red">FLIX</span></span>
    </a>

    <!-- Integrated Search Input Bar -->
    <div class="search-overlay-bar">
      <form id="search-form" onsubmit="event.preventDefault();">
        <div class="search-input-wrapper">
          <input type="search" id="search-input" placeholder="Search..." autocomplete="off">
        </div>
      </form>
      <div id="search-suggestions-box" class="search-suggestions-box" style="display: none;"></div>
    </div>

    <div style="display: flex; gap: 8px; align-items: center;">
      <button class="header-request-btn" id="category-request-btn" onclick="openRequestModal()">Request a Movie</button>
    </div>
  </header>

  <!-- Category Wrapper -->
  <div class="category-page-wrapper">
    <div class="category-header-flow">
      <h1 class="category-main-title" id="category-page-title">All Movies</h1>
    </div>

    <!-- Movie / Reel Content Grid -->
    <div class="main-grid" id="category-movies-grid"></div>

    <!-- Pagination Controls -->
    <div class="pagination-container" id="category-pagination" style="display: none;"></div>
  </div>

  <!-- Request Modal Dialog -->
  <div id="request-modal" class="request-modal-backdrop" style="display: none;">
    <div class="request-modal-content">
      <span class="close-modal-btn" onclick="closeRequestModal()">&times;</span>
      <h3 id="modal-title-text">Request a Movie</h3>
      <p id="modal-desc-text">Can't find what you're looking for? Let us know!</p>
      <div class="request-input-group">
        <input type="text" id="modal-request-input" placeholder="Enter title...">
        <button onclick="submitMovieRequest()">Submit</button>
      </div>
    </div>
  </div>

  <div id="loading-toast" class="toast-notification">Loading...</div>

  <script src="reels-data.js?v=138.0"></script>
  <script src="app.js?v=138.0"></script>
  <script>
    let currentPage = 1;
    // Updated to 24 items per page so desktop 6-column rows fill out completely
    const itemsPerPage = 24; 
    let currentCategoryType = 'all';

    document.addEventListener('DOMContentLoaded', () => {
      const urlParams = new URLSearchParams(window.location.search);
      currentCategoryType = urlParams.get('type') || 'all';

      setupCategoryHeader(currentCategoryType);
      renderCategoryContent();
    });

    function setupCategoryHeader(type) {
      const pageTitle = document.getElementById('category-page-title');
      const brandTitle = document.getElementById('nav-brand-title');
      const reqBtn = document.getElementById('category-request-btn');
      const modalTitle = document.getElementById('modal-title-text');
      const searchInput = document.getElementById('search-input');

      if (type === 'reels') {
        if (pageTitle) pageTitle.textContent = 'DEYMREELS';
        if (brandTitle) brandTitle.innerHTML = 'DEYM<span class="highlight-red">REELS</span>';
        if (reqBtn) reqBtn.textContent = 'Request a Reel';
        if (modalTitle) modalTitle.textContent = 'Request a Reel';
        if (searchInput) searchInput.placeholder = 'Search reels...';
      } else if (type === 'tagalog') {
        if (pageTitle) pageTitle.textContent = 'Tagalog Movies PH';
      } else {
        if (pageTitle) pageTitle.textContent = 'All Movies';
      }
    }

    function renderCategoryContent() {
      const gridContainer = document.getElementById('category-movies-grid');
      if (!gridContainer) return;

      gridContainer.innerHTML = '';
      let dataset = [];

      if (currentCategoryType === 'reels') {
        dataset = typeof aiReelsData !== 'undefined' ? aiReelsData : [];
        gridContainer.className = 'reels-grid-container';
      } else if (currentCategoryType === 'tagalog') {
        dataset = movies.filter(m => m.isFilipino || m.genre?.includes('Filipino') || m.country === 'PH');
        gridContainer.className = 'main-grid';
      } else {
        dataset = movies;
        gridContainer.className = 'main-grid';
      }

      const totalPages = Math.ceil(dataset.length / itemsPerPage);
      if (currentPage > totalPages) currentPage = 1;

      const startIndex = (currentPage - 1) * itemsPerPage;
      const paginatedItems = dataset.slice(startIndex, startIndex + itemsPerPage);

      if (currentCategoryType === 'reels') {
        paginatedItems.forEach(reel => {
          const card = document.createElement('div');
          card.className = 'reel-thumb-card';
          card.onclick = () => {
            window.location.href = `reels.html?id=${encodeURIComponent(reel.id)}`;
          };
          card.innerHTML = `
            <img src="${reel.poster || reel.thumbnail}" alt="${reel.title}" class="reel-thumb-img" loading="lazy">
            <div class="reel-overlay-info">
              <span class="reel-badge-tag">REEL</span>
              <span class="reel-thumb-title">${reel.title}</span>
            </div>
          `;
          gridContainer.appendChild(card);
        });
      } else {
        paginatedItems.forEach((movie, idx) => {
          const rank = currentCategoryType === 'top' ? startIndex + idx + 1 : null;
          gridContainer.appendChild(createMovieCard(movie, rank));
        });
      }

      renderPaginationControls(totalPages);
    }

    function renderPaginationControls(totalPages) {
      const paginationBox = document.getElementById('category-pagination');
      if (!paginationBox) return;

      if (totalPages <= 1) {
        paginationBox.style.display = 'none';
        return;
      }

      paginationBox.style.display = 'flex';
      paginationBox.innerHTML = '';

      if (currentPage > 1) {
        const prevBtn = document.createElement('button');
        prevBtn.className = 'page-nav-btn';
        prevBtn.textContent = 'Prev';
        prevBtn.onclick = () => { currentPage--; renderCategoryContent(); window.scrollTo({ top: 0, behavior: 'smooth' }); };
        paginationBox.appendChild(prevBtn);
      }

      const numbersGroup = document.createElement('div');
      numbersGroup.className = 'page-numbers-group';

      const isMobile = window.innerWidth <= 600;

      let startPage = 1;
      let endPage = totalPages;

      if (isMobile) {
        const maxVisible = 3;
        startPage = Math.max(1, currentPage - 1);
        endPage = Math.min(totalPages, startPage + maxVisible - 1);

        if (endPage - startPage + 1 < maxVisible) {
          startPage = Math.max(1, endPage - maxVisible + 1);
        }
      }

      for (let i = startPage; i <= endPage; i++) {
        const pageBtn = document.createElement('button');
        pageBtn.className = `page-btn ${i === currentPage ? 'active' : ''}`;
        pageBtn.textContent = i;
        pageBtn.onclick = () => { currentPage = i; renderCategoryContent(); window.scrollTo({ top: 0, behavior: 'smooth' }); };
        numbersGroup.appendChild(pageBtn);
      }

      paginationBox.appendChild(numbersGroup);

      if (currentPage < totalPages) {
        const nextBtn = document.createElement('button');
        nextBtn.className = 'page-nav-btn';
        nextBtn.textContent = 'Next';
        nextBtn.onclick = () => { currentPage++; renderCategoryContent(); window.scrollTo({ top: 0, behavior: 'smooth' }); };
        paginationBox.appendChild(nextBtn);
      }
    }

    window.addEventListener('resize', () => {
      const dataset = currentCategoryType === 'reels' ? (typeof aiReelsData !== 'undefined' ? aiReelsData : []) : movies;
      const totalPages = Math.ceil(dataset.length / itemsPerPage);
      renderPaginationControls(totalPages);
    });
  </script>
</body>
</html>
