<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>DEYMFLIX - Category</title>

  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">

  <link rel="stylesheet" href="style.css?v=151.0">
</head>
<body>

  <!-- Top Navigation Header -->
  <header class="top-nav">
    <!-- 1. LEFT: Brand Logo & Title -->
    <a href="index.html" class="brand-logo-link">
      <img src="favicon.svg" alt="DEYMFLIX Icon" class="brand-logo-img">
      <span class="brand-title-text">DEYM<span class="highlight-red">FLIX</span></span>
    </a>

    <!-- 2. RIGHT: Request Button (Unwrapped for CSS Order targeting) -->
    <button class="header-request-btn" onclick="openRequestModal()">Request a Movie</button>

    <!-- 3. BOTTOM / CENTER: Search Bar -->
    <div class="search-overlay-bar">
      <form id="search-form" onsubmit="event.preventDefault();">
        <div class="search-input-wrapper">
          <input type="search" id="search-input" placeholder="Search movies..." autocomplete="off">
        </div>
      </form>
      <div id="search-suggestions-box" class="search-suggestions-box" style="display: none;"></div>
    </div>
  </header>

  <!-- Category View Main Section -->
  <main class="content-section category-main-wrapper">
    <div class="section-header-flex">
      <h2 id="category-title" class="section-header-title">Loading Category...</h2>
    </div>

    <!-- Responsive Grid Container -->
    <div class="category-grid" id="category-grid-container"></div>

    <!-- Pagination Navigation Controls -->
    <div class="pagination-wrapper" id="pagination-wrapper"></div>
  </main>

  <!-- Request Modal -->
  <div id="request-modal" class="request-modal-backdrop" style="display: none;">
    <div class="request-modal-content">
      <span class="close-modal-btn" onclick="closeRequestModal()">&times;</span>
      <h3>Request a Movie</h3>
      <p>Can't find what you're looking for? Let us know!</p>
      <div class="request-input-group">
        <input type="text" id="modal-request-input" placeholder="Enter movie title...">
        <button onclick="submitMovieRequest()">Submit</button>
      </div>
    </div>
  </div>

  <div id="loading-toast" class="toast-notification">Loading...</div>

  <script src="reels-data.js?v=151.0"></script>
  <script src="app.js?v=151.0"></script>
  <script>
    let currentPage = 1;
    const itemsPerPage = 18; // 18 items per page

    document.addEventListener('DOMContentLoaded', () => {
      loadCategoryPage(1);
    });

    function loadCategoryPage(page) {
      currentPage = page;
      const urlParams = new URLSearchParams(window.location.search);
      const categoryType = urlParams.get('type') || 'all';
      const gridContainer = document.getElementById('category-grid-container');
      const titleElement = document.getElementById('category-title');
      const paginationWrapper = document.getElementById('pagination-wrapper');

      if (!gridContainer) return;
      gridContainer.innerHTML = '';

      let itemsList = [];

      if (categoryType === 'reels') {
        titleElement.textContent = 'AI Reels & Shorts';
        gridContainer.classList.add('reels-grid-mode');
        itemsList = typeof aiReelsData !== 'undefined' ? aiReelsData : [];
      } else if (categoryType === 'tagalog') {
        titleElement.textContent = 'Tagalog Movies PH';
        itemsList = typeof movies !== 'undefined' ? movies.filter(m => m.isFilipino || m.genre?.includes('Filipino') || m.country === 'PH') : [];
      } else {
        titleElement.textContent = 'All Movies';
        itemsList = typeof movies !== 'undefined' ? movies : [];
      }

      // Calculate total pages & slice array
      const totalPages = Math.ceil(itemsList.length / itemsPerPage);
      const startIndex = (currentPage - 1) * itemsPerPage;
      const paginatedItems = itemsList.slice(startIndex, startIndex + itemsPerPage);

      if (categoryType === 'reels') {
        paginatedItems.forEach(reel => {
          const card = document.createElement('div');
          card.className = 'reel-thumb-card';
          card.onclick = () => window.location.href = `reels.html?id=${encodeURIComponent(reel.id)}`;
          card.innerHTML = `
            <img src="${reel.poster || reel.thumbnail}" alt="${reel.title}" class="reel-thumb-img" loading="lazy">
            <div class="reel-overlay-info">
              <span class="reel-badge-tag">AI REEL</span>
              <span class="reel-thumb-title">${reel.title}</span>
            </div>
          `;
          gridContainer.appendChild(card);
        });
      } else {
        paginatedItems.forEach(movie => {
          if (typeof createMovieCard === 'function') {
            gridContainer.appendChild(createMovieCard(movie));
          }
        });
      }

      renderPaginationControls(totalPages, paginationWrapper);
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function renderPaginationControls(totalPages, container) {
      if (!container) return;
      if (totalPages <= 1) {
        container.innerHTML = '';
        return;
      }

      let paginationHTML = '';

      // Prev Button
      paginationHTML += `<button class="page-nav-btn ${currentPage === 1 ? 'disabled' : ''}" 
        onclick="${currentPage > 1 ? `loadCategoryPage(${currentPage - 1})` : ''}">❮ Prev</button>`;

      // Calculate Sliding Window for Maximum 3 Numeric Buttons
      let startPage = Math.max(1, currentPage - 1);
      let endPage = startPage + 2;

      if (endPage > totalPages) {
        endPage = totalPages;
        startPage = Math.max(1, endPage - 2);
      }

      // First page shortcut
      if (startPage > 1) {
        paginationHTML += `<button class="page-num-btn" onclick="loadCategoryPage(1)">1</button>`;
        if (startPage > 2) {
          paginationHTML += `<span style="color:#666; font-weight:bold; padding: 0 4px;">...</span>`;
        }
      }

      // Render 3 numeric buttons
      for (let i = startPage; i <= endPage; i++) {
        paginationHTML += `<button class="page-num-btn ${i === currentPage ? 'active' : ''}" 
          onclick="loadCategoryPage(${i})">${i}</button>`;
      }

      // Last page shortcut
      if (endPage < totalPages) {
        if (endPage < totalPages - 1) {
          paginationHTML += `<span style="color:#666; font-weight:bold; padding: 0 4px;">...</span>`;
        }
        paginationHTML += `<button class="page-num-btn" onclick="loadCategoryPage(${totalPages})">${totalPages}</button>`;
      }

      // Next Button
      paginationHTML += `<button class="page-nav-btn ${currentPage === totalPages ? 'disabled' : ''}" 
        onclick="${currentPage < totalPages ? `loadCategoryPage(${currentPage + 1})` : ''}">Next ❯</button>`;

      container.innerHTML = paginationHTML;
    }
  </script>
</body>
</html>
