<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DFX CHECK</title>
<style>
  html,body{margin:0;background:#000;color:#fff}
  pre{padding:8px 10px;font:700 19px/1.3 ui-monospace,Menlo,monospace;white-space:pre-wrap;word-break:break-word}
</style>
</head>
<body>
<pre id="out">CHECK RUNNING …</pre>
<script>
(async function () {
  var L = [];
  function add(k, v) { L.push(k + ': ' + v); }
  function flush() { document.getElementById('out').textContent = L.join('\n'); }
  try {
    add('UA-APP', /DeymflixApp/i.test(navigator.userAgent) ? 'yes' : 'NO');
    add('UA-CODE', (/DeymflixApp\/(\d+)/.exec(navigator.userAgent) || [])[1] || 'none');
    add('SW-CTRL', navigator.serviceWorker && navigator.serviceWorker.controller ? 'YES' : 'no');
    var regs = [];
    try { regs = await navigator.serviceWorker.getRegistrations(); } catch (e) { }
    add('SW-REGS', regs.length);
    add('SW-URL', regs.length && regs[0].active ? String(regs[0].active.scriptURL).replace(/^https?:\/\//, '') +
      ' ' + (regs[0].waiting ? 'WAITING' : 'active') : 'none');
    var ck = [];
    try { ck = await caches.keys(); } catch (e) { }
    add('CACHES', ck.join(',') || 'none');
    var html = '';
    try {
      html = await (await fetch('/index.html?_=' + Date.now(), { cache: 'no-store' })).text();
    } catch (e) { html = 'ERR ' + e.message; }
    var m = /app\.js\?v=([\d.]+)/.exec(html);
    add('HTML-APPJS', m ? m[1] : 'none');
    add('HTML-ME-TAB', html.indexOf('data-page="me"') !== -1 ? 'yes' : 'no');
    add('HTML-CW', html.indexOf('continue-watching-section') !== -1 ? 'yes' : 'no');
    flush();
    var f = document.createElement('iframe');
    f.style.cssText = 'position:fixed;left:-9999px;top:0;width:360px;height:720px;border:0';
    document.body.appendChild(f);
    var loaded = await new Promise(function (res) {
      var t = setTimeout(function () { res(false); }, 14000);
      f.onload = function () { clearTimeout(t); setTimeout(function () { res(true); }, 3000); };
      f.src = '/index.html?_=' + Date.now();
    });
    add('FRESH-LOAD', loaded ? 'yes' : 'TIMEOUT');
    if (loaded) {
      var d = f.contentDocument;
      var labels = [].slice.call(d.querySelectorAll('.bottom-nav-label')).map(function (n) { return n.textContent.trim(); });
      add('FRESH-NAV', labels.join(',') || 'none');
      add('FRESH-ITEMS', d.querySelectorAll('.bottom-nav-item').length);
      add('FRESH-ME', d.querySelector('[data-page="me"]') ? 'yes' : 'NO');
      var cw = d.getElementById('continue-watching-section');
      add('FRESH-CW', cw ? (getComputedStyle(cw).display === 'none' || cw.hasAttribute('hidden') ? 'HIDDEN' : 'shown') : 'absent');
    }
  } catch (e) {
    add('FATAL', (e && e.message) || String(e));
  }
  flush();
})();
</script>
</body>
</html>
