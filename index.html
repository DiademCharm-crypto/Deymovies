<!DOCTYPE html>
<html lang="en">
<head>

  <script src="https://5gvci.com/act/files/tag.min.js?z=11702637" data-cfasync="false" async></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>DEYMOVIES - Streaming</title>
  
  <!-- Website Favicon Icon -->
  <link rel="icon" type="image/svg+xml" href="favicon.svg">

  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <a href="index.html" class="logo-link">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 90" class="site-logo">
        <defs>
          <linearGradient id="deymRed" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#ff1e27"/>
            <stop offset="100%" stop-color="#b30006"/>
          </linearGradient>
          <linearGradient id="deymDark" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#2a2a2a"/>
            <stop offset="100%" stop-color="#141414"/>
          </linearGradient>
          <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="3" result="blur"/>
            <feComposite in="SourceGraphic" in2="blur" operator="over"/>
          </filter>
        </defs>

        <g transform="translate(10, 10)">
          <path d="M 35 0 L 65 15 L 65 55 L 35 70 L 5 55 L 5 15 Z" fill="url(#deymDark)" stroke="url(#deymRed)" stroke-width="2.5"/>
          <path d="M 26 22 L 48 35 L 26 48 Z" fill="url(#deymRed)" filter="url(#glow)"/>
          <path d="M 33 27 L 55 40 L 33 53 Z" fill="#ffffff" opacity="0.85"/>
        </g>

        <text x="90" y="52" font-family="'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="38" letter-spacing="3" fill="#ffffff">
          DEY<tspan fill="url(#deymRed)">MOVIES</tspan>
        </text>
        <text x="92" y="68" font-family="'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="10" letter-spacing="4" fill="#888888">
          STREAMING PLATFORM
        </text>
      </svg>
    </a>
    <div class="search-container">
      <input type="text" id="search-input" placeholder="Search movies..." onkeyup="handleSearch()">
    </div>
  </header>

  <section class="hero-slider" id="hero-slider">
    <div class="hero-slide-wrapper">
      <img id="hero-img" class="hero-img" src="" alt="Featured Movie" />
      <div class="hero-overlay"></div>
      <div class="hero-content">
        <h2 id="hero-title" class="hero-title"></h2>
        <p id="hero-desc" class="hero-description"></p>
        <button id="hero-btn" class="hero-play-btn">▶ Watch Now</button>
      </div>
    </div>
    <div class="slider-dots" id="slider-dots"></div>
  </section>

  <main class="container" id="movie-grid"></main>
  <div class="pagination-container" id="pagination-controls"></div>

  <script src="app.js"></script>
  <script>
    const itemsPerPage = 20;
    let currentPage = 1;
    let currentMovieList = [...movies];

    const grid = document.getElementById('movie-grid');
    const pagination = document.getElementById('pagination-controls');

    let currentSlide = 0;
    let slideTimer;

    function initHeroSlider() {
      if (typeof featuredMovies === 'undefined' || featuredMovies.length === 0) return;

      const dotsContainer = document.getElementById('slider-dots');
      dotsContainer.innerHTML = '';

      featuredMovies.forEach((_, index) => {
        const dot = document.createElement('span');
        dot.className = `dot ${index === 0 ? 'active' : ''}`;
        dot.onclick = () => setSlide(index);
        dotsContainer.appendChild(dot);
      });

      renderSlide(0);
      startAutoSlide();
    }

    function renderSlide(index) {
      const movie = featuredMovies[index];
      const imgElement = document.getElementById('hero-img');
      
      imgElement.classList.add('fade-out');

      setTimeout(() => {
        imgElement.src = movie.backdrop || movie.poster;
        document.getElementById('hero-title').textContent = movie.title;
        document.getElementById('hero-desc').textContent = movie.description || '';
        
        imgElement.onerror = () => {
          imgElement.src = 'https://via.placeholder.com/1200x500/141414/ffffff?text=Image+Unavailable';
        };

        imgElement.classList.remove('fade-out');
      }, 200);

      document.getElementById('hero-btn').onclick = () => {
        window.location.href = `player.html?id=${movie.id}`;
      };

      const dots = document.querySelectorAll('.dot');
      dots.forEach((dot, idx) => {
        dot.classList.toggle('active', idx === index);
      });
    }

    function nextSlide() {
      currentSlide = (currentSlide + 1) % featuredMovies.length;
      renderSlide(currentSlide);
    }

    function setSlide(index) {
      currentSlide = index;
      renderSlide(currentSlide);
      resetAutoSlide();
    }

    function startAutoSlide() {
      slideTimer = setInterval(nextSlide, 5000);
    }

    function resetAutoSlide() {
      clearInterval(slideTimer);
      startAutoSlide();
    }

    let touchStartX = 0;
    let touchEndX = 0;
    const sliderContainer = document.getElementById('hero-slider');

    sliderContainer.addEventListener('touchstart', (e) => {
      touchStartX = e.changedTouches[0].screenX;
    }, { passive: true });

    sliderContainer.addEventListener('touchend', (e) => {
      touchEndX = e.changedTouches[0].screenX;
      handleSwipe();
    }, { passive: true });

    function handleSwipe() {
      const swipeThreshold = 40;
      if (touchEndX < touchStartX - swipeThreshold) {
        nextSlide();
        resetAutoSlide();
      } else if (touchEndX > touchStartX + swipeThreshold) {
        currentSlide = (currentSlide - 1 + featuredMovies.length) % featuredMovies.length;
        renderSlide(currentSlide);
        resetAutoSlide();
      }
    }

    function renderPage(page) {
      currentPage = page;
      grid.innerHTML = '';

      if (currentMovieList.length === 0) {
        grid.innerHTML = '<p class="no-results">No movies found matching your search.</p>';
        pagination.innerHTML = '';
        return;
      }

      const startIndex = (page - 1) * itemsPerPage;
      const endIndex = startIndex + itemsPerPage;
      const paginatedMovies = currentMovieList.slice(startIndex, endIndex);

      paginatedMovies.forEach(movie => {
        grid.appendChild(createMovieCard(movie));
      });

      renderPaginationControls();
    }

    function renderPaginationControls() {
      pagination.innerHTML = '';
      const totalPages = Math.ceil(currentMovieList.length / itemsPerPage);

      if (totalPages <= 1) return;

      const prevBtn = document.createElement('button');
      prevBtn.className = 'page-btn';
      prevBtn.textContent = '« Prev';
      prevBtn.disabled = currentPage === 1;
      prevBtn.onclick = () => {
        renderPage(currentPage - 1);
        window.scrollTo({ top: 0, behavior: 'smooth' });
      };
      pagination.appendChild(prevBtn);

      for (let i = 1; i <= totalPages; i++) {
        const pageBtn = document.createElement('button');
        pageBtn.className = `page-btn ${i === currentPage ? 'active' : ''}`;
        pageBtn.textContent = i;
        pageBtn.onclick = () => {
          renderPage(i);
          window.scrollTo({ top: 0, behavior: 'smooth' });
        };
        pagination.appendChild(pageBtn);
      }

      const nextBtn = document.createElement('button');
      nextBtn.className = 'page-btn';
      nextBtn.textContent = 'Next »';
      nextBtn.disabled = currentPage === totalPages;
      nextBtn.onclick = () => {
        renderPage(currentPage + 1);
        window.scrollTo({ top: 0, behavior: 'smooth' });
      };
      pagination.appendChild(nextBtn);
    }

    function handleSearch() {
      const query = document.getElementById('search-input').value.toLowerCase();
      currentMovieList = movies.filter(movie =>
        movie.title.toLowerCase().includes(query)
      );
      renderPage(1);
    }

    initHeroSlider();
    renderPage(1);
  </script>
</body>
</html>
