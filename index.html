<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>DEYMFLIX - Home</title>

  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">

  <link rel="stylesheet" href="style.css?v=75.0">
</head>
<body>

  <!-- Top Navigation Header -->
  <header class="top-nav">
    <a href="index.html" class="brand-logo-link">
      <img src="favicon.svg" alt="DEYMFLIX Icon" class="brand-logo-img">
      <span class="brand-title-text">DEYM<span class="highlight-red">FLIX</span></span>
    </a>
    <div style="display: flex; gap: 8px; align-items: center;">
      <button class="header-request-btn" onclick="window.location.href='reels.html'">🎬 Reels</button>
      <button class="header-request-btn" onclick="openRequestModal()">Request a Movie</button>
    </div>
  </header>

  <!-- Search Bar Overlay -->
  <div class="search-overlay-bar">
    <form id="search-form" onsubmit="event.preventDefault();">
      <div class="search-input-wrapper">
        <input type="search" id="search-input" placeholder="Search movies..." autocomplete="off">
      </div>
    </form>
    <div id="search-suggestions-box" class="search-suggestions-box" style="display: none;"></div>
  </div>

  <!-- Main Content Sections Wrapper -->
  <div id="home-sections-wrapper">
    <!-- Hero Billboard -->
    <div class="hero-wrapper">
      <img id="hero-backdrop" class="hero-backdrop-img" src="" alt="Hero Backdrop">
      <div class="hero-fade-overlay"></div>
      <div class="hero-details-container">
        <h1 id="hero-title" class="hero-title-text"></h1>
        <button id="hero-play-btn" class="hero-action-btn">▶ Watch Now</button>
      </div>
    </div>

    <!-- 1. Top Picks Row (Moved First under Hero) -->
    <section class="content-section">
      <div class="section-header-flex">
        <h2 class="section-header-title">Top Picks</h2>
      </div>
      <div class="top-picks-scroll" id="top-picks-container"></div>
    </section>

    <!-- 2. AI Reels Section (Moved Under Top Picks) -->
    <section class="content-section">
      <div class="section-header-flex">
        <h2 class="section-header-title">AI Reels & Shorts</h2>
        <a href="reels.html" class="see-all-link">View All ❯</a>
      </div>
      <div class="reels-horizontal-scroll" id="ai-reels-container"></div>
    </section>

    <!-- 3. Tagalog Movies Row -->
    <section class="content-section">
      <div class="section-header-flex">
        <h2 class="section-header-title">Tagalog Movies PH</h2>
        <a href="category.html?type=tagalog" class="see-all-link">View All ❯</a>
      </div>
      <div class="horizontal-scroll" id="filipino-movies-container"></div>
    </section>

    <!-- 4. All Movies Section (Horizontal Scroll Matching Other Categories) -->
    <section class="content-section">
      <div class="section-header-flex">
        <h2 id="grid-section-title" class="section-header-title">All Movies</h2>
        <a href="category.html?type=all" class="see-all-link">View All ❯</a>
      </div>
      <div class="horizontal-scroll" id="all-movies-grid"></div>
    </section>
  </div>

  <!-- Request Modal Dialog -->
  <div id="request-modal" class="request-modal-backdrop" style="display: none;">
    <div class="request-modal-content">
      <span class="close-modal-btn" onclick="closeRequestModal()">&times;</span>
      <h3>Request a Movie</h3>
      <p>Can't find what you're looking for? Let us know!</p>
      <div class="request-input-group">
        <input type="text" id="modal-request-input" placeholder="Enter movie title...">
        <button onclick="submitMovieRequest()">Submit</button>
      </div>
    </div>
  </div>

  <div id="loading-toast" class="toast-notification">Loading...</div>

  <script src="reels-data.js?v=75.0"></script>
  <script src="app.js?v=75.0"></script>
</body>
</html>
